<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Connexion TikTok · BlunderCheck</title>
<style>body{margin:0;background:#111614;color:#EDE7D8;font-family:system-ui,sans-serif}main{max-width:560px;margin:0 auto;padding:32px 16px}
h1{font-size:24px}code{display:block;word-break:break-all;background:#0D110F;border:1px solid #29332D;border-radius:10px;padding:12px;margin:8px 0;font-size:14px}
button{background:#C9A45C;color:#1A1407;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.err{color:#E5534B}</style></head>
<body><main><h1>Connexion TikTok</h1><div id="r"></div></main>
<script>
const q=new URLSearchParams(location.search),r=document.getElementById("r");
if(q.get("code")){r.innerHTML='<p>Autorisation reçue. Copie ce code (valable quelques minutes) dans l\'outil de publication BlunderCheck :</p><code id="c"></code><button id="b">Copier</button>';
 document.getElementById("c").textContent=q.get("code");
 document.getElementById("b").onclick=()=>navigator.clipboard.writeText(q.get("code")).then(()=>{document.getElementById("b").textContent="Copié"});}
else{r.innerHTML='<p class="err"></p>';r.firstChild.textContent="Pas d'autorisation : "+(q.get("error_description")||q.get("error")||"aucun code reçu");}
</script></body></html>
