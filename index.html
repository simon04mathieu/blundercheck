const iaErreur = e => IA_ERR[e && e.code] || (e && e.message) || "The coach was interrupted (connection problem). Try again.";
const iaDefinitif = e => e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code);
function iaCouper(e) { if (iaDefinitif(e)) { IA.dispo = false; IA.fn = null; } }

function evalEleve(e, me) {
  if (!e) return '…';
  return me === 'w' ? texteEval(e) : texteEval({ cp: -e.cp, mate: e.mate === null ? null : -e.mate, pv: e.pv });
}
const ligneTxt = (fen, pv, n = 5) => variante(fen, pv, n).map(c => `${c.num} ${c.san}`).join(' ');
const NOM_TAG_IA = { gaffe: 'gaffe', erreur: 'erreur', imprecision: 'imprécision', meilleur: 'best move', excellent: 'excellent move', bon: 'good move' };

function faitsCoup(g, D, i) {
  const P = D.P, mv = P.moves[i], fen = P.fens[i], av = g.evals[i], ap = g.evals[i + 1], t = D.tags[i], me = D.me;
  const mine = mv.color === me, L = lisible(fen, mv.uci);
  const o = { ply: i + 1, coup: `${numero(fen)} ${L.san}`, signification: L.sens, joue_par: mine ? 'élève' : 'adversaire', phase: D.phases[i], eval_avant: evalEleve(av, me), eval_apres: evalEleve(ap, me), classement: NOM_TAG_IA[t] || t };
  if (av && av.pv.length && av.pv[0] !== mv.uci) { const b = lisible(fen, av.pv[0]); o.meilleur_coup = `${b.san} (${b.sens})`; o.suite_du_meilleur = ligneTxt(fen, av.pv); }
  if (mine && MAUVAIS.includes(t)) {
    const x = expliquer(fen, mv.uci, av, ap, me), f = [];
    if (x.matContre) f.push(`after this move, the opponent has mate in ${x.matContre}`);
    if (x.pertes.length) f.push(`hangs: ${x.pertes.join(', ')}`);
    if (x.perte) f.push(`the opponent's continuation loses about ${x.perte} point(s) of material`);
    const w = pourquoi(fen, av, i ? P.fens[i - 1] : null, i ? P.moves[i - 1].uci : null);
    if (x.matPour) f.push(`the best move led to mate in ${x.matPour}`);
    else if (x.gain && !/wins/.test(w)) f.push(`the best move won about ${x.gain} point(s) of material`);
    if (w) f.push(`the best move ${w}`);
    if (ap.pv.length) o.meilleure_reponse_adverse = ligneTxt(P.fens[i + 1], ap.pv);
    o.faits = f;
  } else if (!mine && MAUVAIS.includes(t) && ap.pv.length) {
    const pun = lisible(P.fens[i + 1], ap.pv[0]);
    o.comment_punir = `${pun.san} (${pun.sens})`;
    o.suite_de_la_punition = ligneTxt(P.fens[i + 1], ap.pv);
    const w = pourquoi(P.fens[i + 1], ap, fen, mv.uci); if (w) o.pourquoi_punir = w;
    const s = P.moves[i + 1]; if (s) o.reponse_de_l_eleve = s.uci === ap.pv[0] ? 'they found the punishment' : `they played ${lisible(P.fens[i + 1], s.uci).san}`;
  }
  return o;
}
const aCommenter = D => D.P.moves.map((m, i) => i).filter(i => D.P.moves[i].color === D.me || MAUVAIS.includes(D.tags[i]));
const partieTxt = D => D.P.moves.map((mv, i) => (mv.color === 'w' || i === 0 ? `${numero(D.P.fens[i])} ` : '') + enFr(mv.san)).join(' ');
const niveau = D => D.elo(D.me) ? `about ${D.elo(D.me)} Elo` : 'beginner to intermediate';

function promptProf(g, D, idx = aCommenter(D), synthese = true) {
  const h = D.h;
  return `You are a kind, clear and concrete chess coach. Your student (level ${niveau(D)}) played ${D.me === 'w' ? 'White' : 'Black'}. You comment on their game move by move, in English, addressing them directly, with simple words.\n\nRules:\n- Rely ONLY on the Stockfish engine data below (evaluations, best moves, lines, facts). Never invent a move, a line, a threat or a piece position that isn't there. If the data isn't enough, stick to general principles.\n- Evaluations are from the student's point of view: positive = the student is better, +1 ≈ one pawn up, #3 = the student mates in 3, #-3 = they get mated in 3.\n- Explain the idea behind the moves (threat, hanging piece, development, king safety, piece activity, endgame…), not only the numbers.\n- Student move classified "meilleur coup", "excellent coup" or "bon coup" (best, excellent or good): ONE short sentence (20 words max) on the idea of the move.\n- Student inaccuracy, mistake or blunder: 2 or 3 short sentences (50 words max): what goes wrong, what they should have played and why.\n- Opponent mistake: 1 or 2 sentences on how the student could take advantage of it and whether they did.\n- EVERY move in the list gets a "conseil" (tip), without exception. The tip is ONE sentence in the imperative (15 words max), concrete and usable from the next game:\n  · it starts from THIS position (name the piece, the square or the pattern when useful) and draws a general rule from it;\n  · after a good move, it says which reflex to keep and when to reuse it; after a mistake, which check to do before moving;\n  · forbidden: vague tips ("be careful", "think harder", "play better") and the same tip twice in the game.\n- Add a "theme" among: "tactics", "hanging piece", "king safety", "development", "center", "pawn structure", "piece activity", "endgame", "calculation", "converting an advantage".\n- If the same pattern comes back several times (the same missed move, the same forgotten piece…), say it clearly.\n- Write the moves exactly as in the data.\n- Be brief and dense: don't copy the numeric evaluations, no introduction or pleasantries.\n\nAnswer format: only JSON lines, one object per line, with no text around and no code block.\nFor each move in the list, in order:\n{"p": 12, "c": "comment", "k": "tip", "t": "theme"}
${synthese ? `Then one last line:\n{"resume": "2 or 3 sentences about the game", "lecons": ["lesson 1", "lesson 2", "lesson 3"]}\nThe 3 lessons are the 3 most useful habits for THIS student, based on the mistakes that come back in the game.` : `Comment ONLY on the ${idx.length} moves in the list below (the game is commented in chunks), one object per move, without skipping any, and nothing else.`}

Partie : ${partieTxt(D)}
Result: ${h.Result || '?'}${h.Termination ? ' (' + h.Termination + ')' : ''}

Moves to comment (one JSON object per line):
${idx.map(i => JSON.stringify(faitsCoup(g, D, i))).join('\n')}`;
}

// Commente une partie (celle affichée, ou n'importe laquelle pour le commentaire en lot)
IA.lot = null;   // {fait, total} pendant un commentaire en lot
// Extrait tous les objets JSON de premier niveau d'un texte (même sur plusieurs lignes)
function objetsJSON(txt) {
  const out = []; let prof = 0, debut = -1, chaine = false, echap = false;
  for (let k = 0; k < txt.length; k++) {
    const c = txt[k];
    if (chaine) { if (echap) echap = false; else if (c === '\\') echap = true; else if (c === '"') chaine = false; continue; }
    if (c === '"') chaine = true;
    else if (c === '{') { if (!prof) debut = k; prof++; }
    else if (c === '}' && prof) { prof--; if (!prof) { try { out.push(JSON.parse(txt.slice(debut, k + 1))); } catch { } } }
  }
  return out;
}
async function commenterPartie(g, { silencieux = false } = {}) {
  const D = g && deriver(g);
  if (!IA.fn || !g || !D || !D.affine || IA.ctl) return false;
  g.prof = { comments: {}, resume: '', lecons: [], done: false, total: aCommenter(D).length, erreur: '' };
  IA.ctl = new AbortController();
  IA.cour = g.id;
  const pr = g.prof;
  majIA(g.id);
  const lireLigne = l => {
    l = l.trim().replace(/^```(json)?/, '').replace(/```$/, '').trim().replace(/,$/, '');
    if (!l.startsWith('{')) return;
    let o; try { o = JSON.parse(l); } catch { return; }
    const ply = o.p || o.ply, com = o.c || o.commentaire, cons = o.k || o.conseil, th = o.t || o.theme;
    if (ply && com) pr.comments[ply] = { c: String(com), k: cons ? String(cons) : '', t: th ? String(th).slice(0, 40) : '' };
    else if (o.resume || o.lecons) { pr.resume = String(o.resume || ''); pr.lecons = Array.isArray(o.lecons) ? o.lecons.map(String).slice(0, 5) : []; }
    majIA(g.id);
  };
  // Un appel par morceau de partie : le prof ne s'arrête plus en route
  const morceau = async (idx, synthese) => {
    let pending = '', tout = '';
    await IA.fn(promptProf(g, D, idx, synthese), { signal: IA.ctl.signal, maxTokens: 8192, onText: ({ delta }) => { tout += delta; const ls = (pending + delta).split('\n'); pending = ls.pop(); ls.forEach(lireLigne); } });
    lireLigne(pending);
    objetsJSON(tout).forEach(o => { if (!((o.p || o.ply) && pr.comments[o.p || o.ply])) lireLigne(JSON.stringify(o)); });
    return tout;
  };
  const manque = () => aCommenter(D).filter(i => !pr.comments[i + 1]);
  const TAILLE = 14;
  let ok = false, dernier = '';
  try {
    const tous = aCommenter(D), lots = [];
    for (let k = 0; k < tous.length; k += TAILLE) lots.push(tous.slice(k, k + TAILLE));
    // tous les morceaux partent en même temps (5 au plus) ; le dernier demande aussi la synthèse
    const enParallele = async (ls, synth) => {
      let suivant = 0;
      const ouvrier = async () => { while (suivant < ls.length) { const k = suivant++; dernier = await morceau(ls[k], synth && k === ls.length - 1) || dernier; } };
      await Promise.all(Array.from({ length: Math.min(5, ls.length) }, ouvrier));
    };
    await enParallele(lots, true);
    // rattrapage des coups oubliés (deux essais au plus), lui aussi en parallèle
    for (let essai = 0; essai < 2 && manque().length; essai++) {
      const m = manque(), ls = [];
      for (let k = 0; k < m.length; k += TAILLE) ls.push(m.slice(k, k + TAILLE));
      await enParallele(ls, false);
    }
    if (!pr.resume && Object.keys(pr.comments).length) await morceau(tous.slice(-3), true).catch(() => {});
    if (!Object.keys(pr.comments).length) {
      console.warn('Unreadable coach reply:', dernier.slice(0, 2000));
      throw { code: 'format', message: dernier.trim() ? "The coach answered in an unexpected format. Try again." : "The coach didn't answer. Try again in a moment." };
    }
    pr.done = true; ok = true;
    if (!silencieux) toast('The coach commented on your game.');
  } catch (e) {
    if (e && e.code !== 'cancelled') pr.erreur = iaErreur(e);
    if (e && e.code !== 'cancelled' && silencieux) toast(iaErreur(e), 'err');
    iaCouper(e);
    if (e && (e.code === 'cancelled' || iaDefinitif(e) || e.code === 'rate_limited')) IA.stopLot = true;
  } finally {
    IA.ctl = null; IA.cour = null;
    sauverLib();
    majIA(g.id);
    emit('prof', g.id);
  }
  return ok;
}
const lancerProf = () => commenterPartie(g_());

async function commenterTout() {
  if (IA.lot || !IA.fn) return;
  const liste = LIB.filter(g => estAffinee(g) && !(g.prof && g.prof.done) && deriver(g) && deriver(g).P.moves.length);
  if (!liste.length) { toast('All your analyzed games are already commented.', 'info'); return; }
  IA.lot = { fait: 0, total: liste.length }; IA.stopLot = false;
  emit('prof');
  for (const g of liste) {
    if (IA.stopLot || !IA.fn) break;
    await commenterPartie(g, { silencieux: true });
    IA.lot.fait++;
    emit('prof');
  }
  const n = IA.lot.fait;
  IA.lot = null; emit('prof');
  if (n) toast(`The coach commented ${pluriel(n, 'game')}.`);
}
function majIA(id) {

function statutIA(g, D) {
  const pr = g.prof, n = pr ? Math.min(Object.keys(pr.comments).length, pr.total || 1e9) : 0;
  if (!IA.dispo && !n) return { txt: "AI comments work on claude.ai, with your Claude account signed in.", btn: false };

  if (IA.ctl && IA.cour !== g.id) return { txt: IA.lot ? `The coach comments on your games one by one (${IA.lot.fait + 1} / ${IA.lot.total}). This one will come in turn.` : 'The coach is commenting on another game. Try again in a moment.', btn: false };
  if (IA.ctl) return { prog: pr ? [n, pr.total] : null, txt: n ? `The coach is commenting on your game… ${n} / ${pr.total} moves` : 'The coach is reading your game… the first comments usually arrive in less than a minute.', stop: true };
  if (pr && pr.erreur) return { txt: pr.erreur, btn: IA.dispo, relance: true };

}

function contexteQuestion(p) {
  const g = g_(), D = D_(), fen = p.fen, e = p.ev;
  let c = `You are your student's chess coach (level ${niveau(D)}, they played ${D.me === 'w' ? 'White' : 'Black'}) played. Answer in English, addressing the student directly, in 3 to 6 simple sentences.
Rely on the Stockfish data below. Never claim a move wins or loses if the data doesn't show it: in that case, reason with principles (hanging pieces, threats, king safety) and say you don't have the exact line. Evaluations are from the student's point of view (positive = the student is better).

Game: ${partieTxt(D)}
Position on screen (FEN): ${fen}
To move: ${fen.split(' ')[1] === 'w' ? 'White' : 'Black'}.`;
  if (p.enVar) c += `\nThis position comes from a variation played by the student from move ${A.var.base} of the game: ${A.var.moves.slice(0, A.var.k).map((u, k) => lisible(k ? A.var.fens[k - 1] : D.P.fens[A.var.base], u).san).join(' ')}.`;
  else if (A.ply > 0) c += `\nLast move played, with analysis: ${JSON.stringify(faitsCoup(g, D, A.ply - 1))}`;
  if (e && e.pv.length) c += `\nEvaluation: ${evalEleve(e, D.me)}. Meilleure suite selon Stockfish : ${ligneTxt(fen, e.pv, 6)}`;
  const cm = !p.enVar && g.prof && g.prof.comments[A.ply];
  if (cm) c += `\nYour comment on this move: ${cm.c}${cm.k ? ' Tip: ' + cm.k : ''}`;
  return c;
}

async function poserQuestion(q) {

function evalLegende(e) {
  if (!e) return 'Analysis in progress…';

  const a = Math.abs(e.cp);
  if (a < 35) return 'Equal position';
  return `Advantage ${a < 120 ? 'slight' : a < 300 ? 'net' : 'decisive'} ${e.cp > 0 ? 'for White' : 'for Black'}`;
}

// Position affichée : celle de la partie, ou celle de la variante explorée

        <span title="Opening identified from the moves">${o.eco ? `<b class="mono">${esc(o.eco)}</b>` : ''}${esc(o.nom)}</span>
        <span>${fmtDate(D.date)}</span>
      </div>
      <div class="seg" id="vueSeg" role="tablist" aria-label="View"><button data-v="analyse" class="${A.vue === 'analyse' ? 'on' : ''}">Analysis</button><button data-v="lecon" class="${A.vue === 'lecon' ? 'on' : ''}">Lesson</button><button data-v="rapport" class="${A.vue === 'rapport' ? 'on' : ''}">Report</button></div>
      <div class="an-progress" id="anProg" hidden></div>
    </div>
    <div id="anBody"></div>`;
  $$('#vueSeg button').forEach(b => b.onclick = () => { A.vue = b.dataset.v; $$('#vueSeg button').forEach(x => x.classList.toggle('on', x === b)); rendreCorps(); });
  rendreCorps();
  majProgression();
  analyserPartie(g);
}

function majProgression() {
  const g = g_(), el = $('#anProg');
  if (!g || !el) return;
  const p = progression(g);
  if (p >= 1) { el.hidden = true; return; }
  el.hidden = false;
  const pr = PROG[g.id];
  const txt = pr && pr.phase === 'affinage' ? `Refining key moments · ${pr.fait} / ${pr.total}` : `Preview · ${g.evals.filter(Boolean).length} / ${g.evals.length} positions`;
  el.innerHTML = `<span class="tag tag-moteur">${ico('moteur')}Stockfish</span><div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i></div><span class="mono">${txt}</span>`;
}

  body.innerHTML = `
    <div class="an-grid">
      <div class="an-left">
        <div class="board-zone">
          <div class="evalbar" id="evalbar"><i id="evalFill" style="height:50%"></i><b class="w-side" id="evW"></b><b class="b-side" id="evB"></b></div>
          <svg class="board-svg" id="board" role="img" aria-label="Board: click or drag a piece to play a variation"></svg>
        </div>
        <div class="var-banner" id="varBanner" hidden></div>
        <div class="controls">
          <button class="icon-btn" data-nav="first" aria-label="Start (Home)" title="Start · Home">${ico('first')}</button>
          <button class="icon-btn" data-nav="prev" aria-label="Previous move" title="Previous move · ←">${ico('prev')}</button>
          <button class="icon-btn" data-nav="next" aria-label="Next move" title="Next move · →">${ico('next')}</button>
          <button class="icon-btn" data-nav="last" aria-label="End" title="End · End">${ico('last')}</button>

          <button class="btn sm" data-nav="err">Next mistake <kbd>E</kbd></button>

          <div class="card-b"><div id="advChart" data-h="120"></div></div>
        </div>
      </div>
      <div class="card panel">
        <div class="tabs" role="tablist">
          <button data-tab="coups" class="${A.tab === 'coups' ? 'on' : ''}">Moves</button>
          <button data-tab="variantes" class="${A.tab === 'variantes' ? 'on' : ''}">Variations</button>
          <button data-tab="ia" class="ia-tab ${A.tab === 'ia' ? 'on' : ''}">${ico('ia')}Comments</button>
        </div>

    </div>`;
  A.board = creerEchiquier($('#board'), { onMove: coupJoue });

  $$('.tabs button', body).forEach(b => b.onclick = () => { A.tab = b.dataset.tab; $$('.tabs button', body).forEach(x => x.classList.toggle('on', x === b)); rendrePanneau(); });
  A.graph = graphAvantage($('#advChart'), () => {
    const D = D_(), g = g_();
    return { evals: g.evals, tags: D.tags, moves: D.P.moves, fens: D.P.fens, ply: A.ply, me: D.me, onPick: p => allerPly(p) };
  });
  majTout();
}

function nav(k) {
  const D = D_();
  if (!D) return;
  if (k === 'flip') { A.orient = autre(A.orient); majEchiquier(); return; }
  if (k === 'err') {
    const n = D.P.moves.length;
    for (let s = 1; s <= n; s++) { const i = (A.ply + s - 1) % n; if (D.P.moves[i].color === D.me && MAUVAIS.includes(D.tags[i])) return allerPly(i + 1); }
    toast('No mistakes from you in this game.', 'info');
    return;
  }
  if (A.var) {
    if (k === 'prev') { A.var.k--; if (A.var.k <= 0) { const b = A.var.base; A.var = null; return allerPly(b); } return majTout(); }
    if (k === 'next') { if (A.var.k < A.var.moves.length) { A.var.k++; majTout(); } return; }
    if (k === 'first' || k === 'last') A.var = null;
  }
  if (k === 'first') allerPly(0);
  else if (k === 'prev') allerPly(A.ply - 1);
  else if (k === 'next') allerPly(A.ply + 1);
  else if (k === 'last') allerPly(D.P.moves.length);
}

function allerPly(p) {
  const D = D_();
  if (!D) return;
  A.var = null;
  A.ply = clamp(p, 0, D.P.moves.length);
  if (A.vue !== 'analyse') { A.vue = 'analyse'; $$('#vueSeg button').forEach(x => x.classList.toggle('on', x.dataset.v === 'analyse')); rendreCorps(); return; }
  majTout();
}
function quitterVariante() { if (!A.var) return; const b = A.var.base; A.var = null; allerPly(b); }

// Un coup joué à la main sur l'échiquier
function coupJoue(uci) {
  const D = D_();
  if (!A.var && A.ply < D.P.moves.length && D.P.moves[A.ply].uci === uci) return allerPly(A.ply + 1);
  if (A.var && A.var.k < A.var.moves.length && A.var.moves[A.var.k] === uci) { A.var.k++; return majTout(); }
  const p = posCourante(), gg = new Chess(p.fen);
  if (!jouer(gg, uci)) return;
  if (!A.var) A.var = { base: A.ply, moves: [], fens: [], evals: [], k: 0 };
  const v = A.var;
  v.moves.length = v.fens.length = v.evals.length = v.k;
  v.moves.push(uci); v.fens.push(gg.fen()); v.evals.push(null); v.k++;
  const k = v.k - 1, fen = gg.fen();
  Moteur.analyser(fen, { prio: true }).then(e => { if (A.var === v && v.fens[k] === fen) { v.evals[k] = e; majTout(); } }).catch(() => { });
  majTout();
}

function majTout() {
  majEchiquier();
  majPos();
  rendrePanneau();
  if (A.graph) A.graph.redraw();
  const D = D_();
  const t = A.var ? `var. ${A.var.k}` : `${A.ply} / ${D.P.moves.length}`;
  if ($('#plyTxt')) $('#plyTxt').textContent = t;
  if ($('#plyTxtM')) $('#plyTxtM').textContent = t;
}

function majEchiquier() {
  if (!A.board) return;
  const D = D_(), g = g_(), p = posCourante();
  const arrows = [], marks = [];
  if (!p.enVar && A.ply > 0) {
    const i = A.ply - 1, t = D.tags[i];
    if (MAUVAIS.includes(t) && g.evals[i] && g.evals[i + 1]) {
      if (D.P.moves[i].color === D.me) { arrows.push({ uci: g.evals[i].pv[0], cls: 'best' }); arrows.push({ uci: g.evals[i + 1].pv[0], cls: 'bad' }); }
      else arrows.push({ uci: g.evals[i + 1].pv[0], cls: 'best' });
    }
  }
  if (p.enVar && p.ev && p.ev.pv[0]) arrows.push({ uci: p.ev.pv[0], cls: 'var' });
  A.board.set({ fen: p.fen, orient: A.orient, last: p.uci ? [p.uci.slice(0, 2), p.uci.slice(2, 4)] : null, arrows, marks, hint: null });
  // barre d'évaluation
  const e = p.ev, wc = e ? 50 + 50 * chances(e.cp) : 50;
  const bar = $('#evalbar');
  bar.classList.toggle('flip', A.orient === 'b');
  $('#evalFill').style.height = wc + '%';
  const txt = e ? texteEval(e).replace('−', '-').replace(/^[+-]/, '').replace('#', 'M') : '';
  $('#evW').textContent = e && e.cp >= 0 ? txt : '';
  $('#evB').textContent = e && e.cp < 0 ? txt : '';
  const vb = $('#varBanner');
  if (A.var) {
    vb.hidden = false;
    vb.innerHTML = `<span><b>Variation</b> since ${A.var.base ? libCoup(D.P.fens[A.var.base - 1], D.P.moves[A.var.base - 1].uci) : 'the start'} · Stockfish evaluates every move you play.</span><button class="btn sm" id="quitVar" style="margin-left:auto">${ico('back')}Back to the game <kbd>Esc</kbd></button>`;
    $('#quitVar').onclick = quitterVariante;
  } else vb.hidden = true;
}

function ligneCliquable(fen, pv, n = 8) {
  if (!pv || !pv.length) return '<span class="faint">—</span>';
  const v = variante(fen, pv, n);
  return `<div class="line">${v.map((c, k) => `<span class="n">${c.num}</span><button data-line="${k}" title="${esc(c.sens)}">${esc(c.san)}</button>`).join('')}</div>`;
}
function brancherLigne(el, fen, pv) {
  $$('[data-line]', el).forEach(b => b.onclick = () => {
    const k = +b.dataset.line, base = A.var;
    // rejoue la ligne du moteur comme une variante jusqu'au coup cliqué
    for (const uci of pv.slice(0, k + 1)) coupJoue(uci);
    if (base === undefined) return;
  });
}

/** Explication calculée (règles + moteur) du coup qui mène à la position affichée */
function explicationMoteur(i) {
  const D = D_(), g = g_(), mv = D.P.moves[i], fen = D.P.fens[i], av = g.evals[i], ap = g.evals[i + 1], t = D.tags[i];
  if (!av || !ap) return '<p class="thinking">Stockfish is still analyzing this move…</p>';
  const mine = mv.color === D.me;
  const pq = () => pourquoi(fen, av, i ? D.P.fens[i - 1] : null, i ? D.P.moves[i - 1].uci : null);
  let h = '';
  if (mine && MAUVAIS.includes(t)) {
    const x = expliquer(fen, mv.uci, av, ap, D.me);
    if (x.matContre) h += `<p><span class="k">After this move, your opponent has mate in ${x.matContre}.</span></p>`;
    if (x.pertes.length) h += `<p><span class="k">Hangs:</span> ${esc(x.pertes.join(', '))}.</p>`;
    if (x.refut) h += `<p><span class="k">Strongest reply:</span> <span class="mv">${esc(x.refut.san)}</span> <span class="muted">(${esc(x.refut.sens)})</span>${x.perte ? `, you lose about ${pluriel(x.perte, 'point')} of material.` : ''}</p>`;
    if (x.meilleur) {
      const w = pq();
      h += `<p><span class="k">You needed:</span> <span class="mv">${esc(x.meilleur.san)}</span> <span class="muted">(${esc(x.meilleur.sens)})</span>${w ? ` : it ${esc(w)}.` : '.'}</p>`;
      if (x.matPour) h += `<p class="k">It was mate in ${x.matPour}.</p>`;
      else if (x.gain) h += `<p>With this line, you won about ${pluriel(x.gain, 'point')} of material.</p>`;
    }
  } else if (mine) {
    if (t === 'meilleur') { const w = pq(); h += `<p>It's the move Stockfish picks${w ? ` : it ${esc(w)}` : ''}.</p>`; }
    else if (av.pv.length) { const b = lisible(fen, av.pv[0]); h += `<p>${t === 'excellent' ? 'Excellent move, almost as strong as the engine\'s choice' : 'Good move, it changes almost nothing'}. Stockfish preferred <span class="mv">${esc(b.san)}</span> <span class="muted">(${esc(b.sens)})</span>.</p>`; }
  } else if (MAUVAIS.includes(t) && ap.pv.length) {
    const fa = D.P.fens[i + 1], pun = lisible(fa, ap.pv[0]), w = pourquoi(fa, ap, fen, mv.uci), s = D.P.moves[i + 1];
    h += `<p>Your opponent made a mistake. <span class="k">To punish it:</span> <span class="mv">${esc(pun.san)}</span> <span class="muted">(${esc(pun.sens)})</span>${w ? ` : it ${esc(w)}.` : '.'}</p>`;
    if (s) h += s.uci === ap.pv[0] ? '<p class="up">You found the punishment.</p>' : `<p>You played <span class="mv">${esc(lisible(fa, s.uci).san)}</span>${MAUVAIS.includes(D.tags[i + 1]) ? ' : missed opportunity.' : ', which keeps a good advantage.'}</p>`;
  } else h += `<p class="muted">Correct opponent move${t === 'meilleur' ? ', it\'s even the best' : ''}.</p>`;
  return h;
}

function majPos() {
  const el = $('#posCard');
  if (!el) return;
  const D = D_(), p = posCourante();
  let titre, chipH = '', avap = '';
  if (p.enVar) titre = `<span class="san">${esc(libCoup(p.prevFen, p.uci))}</span><span class="tag tag-ia" style="color:var(--ia)">line</span>`;
  else if (A.ply === 0) titre = '<span class="san">Starting position</span>';
  else {
    const i = A.ply - 1;
    titre = `<span class="san">${esc(libCoup(D.P.fens[i], D.P.moves[i].uci))}</span>`;
    chipH = chip(D.tags[i]);
    if (REGLAGES.niveau && D.complete && D.P.moves[i].color === D.me) { const er = D.erreurs.find(x => x.i === i); if (er && !er.visible && er.tag !== 'imprecision') chipH += `<span class="chip-dur" data-tip="This mistake required calculating several moves ahead. Don't beat yourself up: focus first on the mistakes within your reach.">Hard calculation</span>`; }
    avap = `<span class="faint mono" style="font-size:12.5px">${texteEval(p.evPrev)} → ${texteEval(p.ev)}</span>`;
  }
  const e = p.ev;
  let h = `<div class="pos-top">${titre}${chipH}${avap}<span class="ev ${e ? '' : 'skel'}">${e ? texteEval(e) : '+0.0'}</span></div>
    <div class="pos-sub">${evalLegende(e)}${!p.enVar && A.ply > 0 ? ` · ${D.P.moves[A.ply - 1].color === D.me ? 'your move' : 'opponent move'}` : ''}${!p.enVar && A.ply > 0 && e ? ` <button class="btn ghost sm" data-share="${A.ply - 1}" style="margin-left:auto;padding:2px 8px">${ico('upload')}Share</button>` : ''}</div>
    <div><div class="eyebrow" style="margin-bottom:4px;display:flex;gap:8px;align-items:center">Best line <span class="tag tag-moteur">${ico('moteur')}Engine</span></div>${e ? ligneCliquable(p.fen, e.pv) : '<div class="skel" style="height:18px;width:70%"></div>'}</div>`;
  if (!p.enVar && A.ply > 0) h += `<div class="expl">${explicationMoteur(A.ply - 1)}</div>`;
  const cm = !p.enVar && A.ply > 0 && g_().prof && g_().prof.comments[A.ply];
  if (cm) h += `<div class="ia-box"><div class="ia-h"><span class="tag tag-ia">${ico('ia')}Coach · AI</span>${boutonVoix()}</div><p>${esc(cm.c)}</p>${cm.k ? `<div class="conseil-box">${ico('bulb')}<p><b>Tip</b> ${esc(cm.k)}</p></div>` : ''}</div>`;
  el.innerHTML = h;
  if (e) brancherLigne(el, p.fen, e.pv);
  if (REGLAGES.voixAuto && cm && A.dit !== g_().id + ':' + A.ply) { A.dit = g_().id + ':' + A.ply; const sb = el.querySelector('[data-say]'); if (sb && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) parler(sb); }
}

// ---------- Panneau à onglets ----------
function rendrePanneau() {
  const el = $('#panelBody');
  if (!el) return;
  if (A.tab === 'coups') rendreCoups(el);
  else if (A.tab === 'variantes') rendreVariantes(el);
  else rendreIA(el);
}

function rendreCoups(el) {
  const D = D_(), g = g_(), c = D.counts[D.me];
  const totalMine = D.P.moves.filter(m => m.color === D.me).length;
  let h = `<div class="panel-sec"><h3>Your moves${D.complete ? '' : ' <span class="faint" style="font-weight:400">· analysis in progress</span>'}</h3><div class="summary-chips">`;
  for (const t of ['meilleur', 'excellent', 'bon', 'imprecision', 'erreur', 'gaffe']) h += `<span class="chip" title="${CLASSES[t].nom}">${badge(t)}<span class="mono">${c[t]}</span></span>`;
  h += `</div><div class="faint" style="font-size:12.5px">Accuracy ${pct(D.prec[D.me])} out of ${totalMine} moves · opponent ${pct(D.prec[D.opp])}</div>`;
  const durs = new Set(D.complete ? D.erreurs.filter(e => !e.visible && e.tag !== 'imprecision').map(e => e.i) : []);
  if (D.complete) {
    const graves = D.erreurs.filter(e => e.tag !== 'imprecision'), vis = graves.filter(e => e.visible).length;
    h += `<label class="niv"><span><b>Only mistakes within my reach</b><small>${graves.length ? `${vis} out of ${graves.length} were visible at a glance (hanging piece, winning capture or check, mate). The others required deep calculation.` : 'No mistakes or blunders in this game.'}</small></span><span class="switch"><input type="checkbox" id="nivSw" ${REGLAGES.niveau ? 'checked' : ''} aria-label="Only mistakes within my reach"><span></span></span></label>`;
  }
  h += `</div><div class="moves" id="moveList">`;
  let num = +D.P.fens[0].split(' ')[5];
  if (D.P.fens[0].split(' ')[1] === 'b') h += `<span class="n">${num}.</span><span></span>`;
  D.P.moves.forEach((mv, i) => {
    if (mv.color === 'w') h += `<span class="n">${num}.</span>`;
    const t = D.tags[i], e = g.evals[i + 1];
    h += `<button data-ply="${i + 1}" class="${mv.color === D.me ? 'mine' : ''}${!A.var && A.ply === i + 1 ? ' on' : ''}"><span class="s">${esc(enFr(mv.san))}</span>${t && t !== 'bon' ? badge(t, REGLAGES.niveau && durs.has(i) ? 'dur' : '') : ''}<span class="e ${e ? '' : 'skel'}">${e ? texteEval(e) : '+0.0'}</span></button>`;
    if (mv.color === 'b') num++;
  });
  h += '</div>';
  if (!D.P.moves.length) h += '<div class="empty"><p>Position only: play moves on the board to explore variations.</p></div>';
  const sc = el.scrollTop;
  el.innerHTML = h;
  el.scrollTop = sc;
  $$('[data-ply]', el).forEach(b => b.onclick = () => allerPly(+b.dataset.ply));
  const nv = $('#nivSw', el); if (nv) nv.onchange = () => { REGLAGES.niveau = nv.checked; sauverReglages(); rendreCoups(el); };
  const on = $('.moves .on', el);
  if (on) { const t = on.offsetTop, H = el.clientHeight; if (t < el.scrollTop + 60 || t > el.scrollTop + H - 40) el.scrollTop = t - H / 2; }
}

function rendreVariantes(el) {
  const D = D_(), p = posCourante(), e = p.ev;
  const trait = p.fen.split(' ')[1] === 'w' ? 'White' : 'Black';
  let h = `<div class="panel-sec"><h3>${ico('bulb')}How to play this position better?<span class="tag tag-moteur" style="margin-left:auto">${ico('moteur')}Engine</span></h3>`;
  if (!e) h += '<p class="thinking">Stockfish is calculating this position…</p>';
  else if (!e.pv.length) h += `<p class="muted">${evalLegende(e)} : there are no moves left to play.</p>`;
  else {
    const b = lisible(p.fen, e.pv[0]);
    const prevUci = p.uci, prevFen = p.prevFen;
    const w = pourquoi(p.fen, e, prevFen, prevUci);
    h += `<p>To move: ${trait}. The recommended move is <span class="mv">${esc(b.san)}</span> <span class="muted">(${esc(b.sens)})</span>.</p>`;
    if (w) h += `<p>Why: it ${esc(w)}.</p>`;
    h += `<p class="muted">${evalLegende(e)} (${texteEval(e)}).</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="playBest">${ico('arrow')}Play this move</button>${IA.dispo ? `<button class="btn sm ia" id="iaPos">${ico('ia')}Explain simply</button>` : ''}</div>`;
    const key = p.fen;
    if (A.iaPos[key]) h += `<div class="ia-box"><span class="tag tag-ia">${ico('ia')}AI · Claude</span><p id="iaPosTxt" class="${A.iaPos[key].pending ? 'thinking' : ''}">${esc(A.iaPos[key].text)}</p></div>`;
  }
  h += '</div>';
  if (e && e.pv.length) {
    h += `<div class="panel-sec"><h3>Best line according to Stockfish</h3><ul style="margin:0;padding:0;list-style:none;display:grid;gap:4px">${variante(p.fen, e.pv, 8).map((c, k) => `<li style="display:grid;grid-template-columns:44px 60px minmax(0,1fr);gap:8px;font-size:13px"><span class="faint mono">${c.num}</span><button class="mv" data-bl="${k}" style="border:0;background:none;padding:0;text-align:left;color:var(--fg)">${esc(c.san)}</button><span class="muted">${esc(c.sens)}</span></li>`).join('')}</ul><p class="faint" style="font-size:12.5px">Click a move to replay the line on the board.</p></div>`;
  }
  if (A.var) {
    const v = A.var, base = D.P.fens[v.base];
    h += `<div class="panel-sec"><h3>Your variation</h3><div class="line">`;
    v.moves.forEach((u, k) => {
      const f = k ? v.fens[k - 1] : base, L = lisible(f, u);
      h += `<span class="n">${numero(f)}</span><button data-vk="${k + 1}" style="${k + 1 === v.k ? 'background:var(--ia-soft);box-shadow:inset 0 0 0 1px var(--ia-line)' : ''}">${esc(L.san)}</button><span class="faint" style="font-size:11.5px">${v.evals[k] ? texteEval(v.evals[k]) : '…'}</span>`;
    });
    h += `</div><button class="btn sm" id="quitVar2">${ico('back')}Back to the game</button></div>`;
  } else h += `<div class="panel-sec"><p class="muted" style="font-size:13px">${ico('info')} Play a move on the board (click or drag) to explore your own variation: Stockfish evaluates it right away.</p></div>`;
  el.innerHTML = h;
  const pb = $('#playBest', el); if (pb) pb.onclick = () => coupJoue(e.pv[0]);
  $$('[data-bl]', el).forEach(b => b.onclick = () => { for (const u of e.pv.slice(0, +b.dataset.bl + 1)) coupJoue(u); });
  $$('[data-vk]', el).forEach(b => b.onclick = () => { A.var.k = +b.dataset.vk; majTout(); });
  const q2 = $('#quitVar2', el); if (q2) q2.onclick = quitterVariante;
  const ip = $('#iaPos', el); if (ip) ip.onclick = () => expliquerPositionIA(p);
}

// ---------- Rapport d'analyse ----------
function seriesSansErreur(D, c) {
  let best = 0, cur = 0;
  D.P.moves.forEach((m, i) => { if (m.color !== c) return; if (MAUVAIS.includes(D.tags[i])) cur = 0; else best = Math.max(best, ++cur); });
  return best;
}
function pointsForts(D, c) {
  const out = [], ph = D.phasePrec[c], noms = { ouverture: 'Opening', milieu: 'Middlegame', finale: 'Endgame' };
  const phs = Object.entries(ph).filter(([, v]) => v !== null).sort((a, b) => b[1] - a[1]);
  if (phs.length && phs[0][1] >= 70) out.push(`<b>Solid ${noms[phs[0][0]].toLowerCase()}</b> : ${pct(phs[0][1])} accuracy`);
  const top = D.counts[c].meilleur + D.counts[c].excellent;
  if (top) out.push(`<b>${pluriel(top, 'move')}</b> at engine level (best or excellent)`);
  const s = seriesSansErreur(D, c);
  if (s >= 5) out.push(`<b>Streak of ${s} moves</b> without an inaccuracy`);
  const punis = D.P.moves.filter((m, i) => m.color !== c && MAUVAIS.includes(D.tags[i]) && D.P.moves[i + 1] && g_().evals[i + 1] && D.P.moves[i + 1].uci === g_().evals[i + 1].pv[0]).length;
  if (punis) out.push(`<b>${pluriel(punis, 'opponent mistake punished', 'opponent mistakes punished')}</b> immediately`);
  return out.length ? out : ['<span class="faint">No clear strength in this game.</span>'];
}
function syntheseMoteur(D, g) {
  const me = D.me, s = me === 'w' ? 1 : -1, E = g.evals;
  let maxV = -Infinity, maxI = 0;
  E.forEach((e, i) => { const v = s * e.cp; if (v > maxV) { maxV = v; maxI = i; } });
  const parts = [];
  const res = D.resultat === 'victoire' ? 'won' : D.resultat === 'defaite' ? 'lost' : D.resultat === 'nulle' ? 'drew' : null;
  if (maxV >= 300 && D.resultat !== 'victoire') {
    const ev = E[maxI];
    parts.push(`You had a winning advantage (${evalEleve(ev, me)}) ${maxI ? `after ${libCoup(D.P.fens[maxI - 1], D.P.moves[maxI - 1].uci)}` : ''}, but it slipped away${res ? ` and you finally ${res}` : ''}.`);
  } else if (res) parts.push(`You ${res} this game with ${pct(D.prec[me])} accuracy, against ${pct(D.prec[D.opp])} for your opponent.`);
  const pire = [...D.erreurs].sort((a, b) => b.delta - a.delta)[0];
  if (pire) parts.push(`Your most costly move: ${libCoup(D.P.fens[pire.i], D.P.moves[pire.i].uci)}.`);
  if (D.manquees.length) parts.push(`You let ${pluriel(D.manquees.length, 'opponent mistake', 'opponent mistakes')} go unpunished.`);
  const fin = E[E.length - 1];
  if (D.resultat === 'defaite' && fin && s * fin.cp > -150 && !/mat|checkmate/i.test(D.h.Termination || '') && fin.mate !== 0) parts.push(`At the end, the position wasn't lost (${evalEleve(fin, me)}): resigning was premature.`);
  return parts.join(' ');
}

function ligneMoment(D, i, extra) {
  const L = lisible(D.P.fens[i], D.P.moves[i].uci);
  return `<button class="row moment" data-goto="${i + 1}"><span class="mv">${numero(D.P.fens[i])} ${esc(L.san)}</span><span class="ellip muted">${extra}</span>${ico('arrow')}</button>`;
}

  if (!manq.length) manq = D.erreurs.filter(e => e.motifs.includes('tactique')).slice(0, 3).map(e => ({ i: e.i, txt: () => { const b = lisible(D.P.fens[e.i], g.evals[e.i].pv[0]); return `${b.san} won material (${b.sens})`; } }));

      <table class="dist" style="margin-top:14px"><thead><tr><th>By phase <span class="tipq" tabindex="0" data-tip="Average accuracy of the moves played in each phase. At least 3 moves are needed to show it.">?</span></th><th>White</th><th>Black</th></tr></thead><tbody>
      ${['ouverture', 'milieu', 'finale'].map(ph => `<tr><th>${({ ouverture: 'Opening', milieu: 'Middlegame', finale: 'Endgame' })[ph]}</th><td>${pct(D.phasePrec.w[ph])}</td><td>${pct(D.phasePrec.b[ph])}</td></tr>`).join('')}</tbody></table>
    </div></section>
    <section class="card span-6"><div class="card-h"><h2>Move breakdown</h2><span class="tipq" tabindex="0" data-tip="Ranked by the winning chances lost with each move: inaccuracy from 5 points, mistake from 10, blunder from 15.">?</span></div><div class="card-b">
      <table class="dist"><thead><tr><th></th><th>White</th><th>Black</th></tr></thead><tbody>

    </div></section>
    <section class="card span-12"><div class="card-h"><h2>Advantage over time</h2><span class="faint" style="font-size:12.5px">Click the graph to review the position</span></div><div class="card-b"><div id="repChart" data-h="180"></div></div></section>
    <section class="card span-4"><div class="card-h"><h2>Decisive moments</h2></div><div class="list" style="padding-top:6px">${swings.length ? swings.map(s => ligneMoment(D, s.i, `${D.P.moves[s.i].color === D.me ? 'Your move' : 'Opponent move'} · ${texteEval(g.evals[s.i])} → ${texteEval(g.evals[s.i + 1])}`)).join('') : '<p class="muted card-b">No major swing: the game stayed balanced.</p>'}</div></section>

    <section class="card span-6"><div class="card-h"><h2>Strengths</h2></div><div class="card-b" style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      ${['w', 'b'].map(c => `<div><div class="eyebrow" style="margin-bottom:8px">${nom(c)}</div><ul class="strength" style="margin:0;padding-left:16px">${pointsForts(D, c).map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('')}

// ---------- Pages ----------
const MOTIFS = {
  en_prise: { titre: 'Hanging pieces', desc: "Before moving, check that the target square and your other pieces stay defended." },
  tactique: { titre: 'Missed material wins', desc: "The winning move was there: look at checks, captures and threats first." },
  double: { titre: 'Missed double attacks', desc: "A check that also attacks a second piece often wins material. Look for it when the enemy king and a piece are lined up." },
  mat_concede: { titre: 'Mates allowed', desc: "Before every move, ask yourself which checks your opponent can give." },
  manquee: { titre: 'Unpunished opponent mistakes', desc: "When your opponent makes a mistake, take the time to look for the punishment before following your plan." },
};
const NOM_PHASE = { ouverture: "l'ouverture", milieu: 'the middlegame', finale: 'the endgame' };

const partiesCompletes = () => LIB.map(g => ({ g, D: deriver(g) })).filter(x => x.D && x.D.affine && x.D.P.moves.length);

function agregats(list) {
  const mot = { en_prise: 0, tactique: 0, double: 0, mat_concede: 0, manquee: 0 };
  const ph = { ouverture: [], milieu: [], finale: [] }, phErr = { ouverture: 0, milieu: 0, finale: 0 };
  for (const { D } of list) {
    D.erreurs.forEach(e => { e.motifs.forEach(m => mot[m]++); phErr[e.phase]++; });
    mot.manquee += D.manquees.length;
    for (const k in ph) if (D.phasePrec[D.me][k] !== null) ph[k].push(D.phasePrec[D.me][k]);
  }
  const phMoy = {}; for (const k in ph) phMoy[k] = moyenne(ph[k]);
  return { mot, phMoy, phErr };
}

function axesTravail(list) {
  const { mot, phMoy, phErr } = agregats(list);
  const axes = Object.entries(mot).filter(([, n]) => n > 0).map(([k, n]) => ({ key: k, n, titre: MOTIFS[k].titre, desc: MOTIFS[k].desc, filtre: k }));
  const phs = Object.entries(phMoy).filter(([, v]) => v !== null).sort((a, b) => a[1] - b[1]);
  if (phs.length && phs[0][1] < 85) axes.push({ key: 'phase', n: phErr[phs[0][0]], titre: `Your accuracy in ${NOM_PHASE[phs[0][0]]}`, desc: `It's the phase where you're least accurate (${pct(phs[0][1])} on average).`, filtre: 'tous' });
  return axes.sort((a, b) => b.n - a.n).slice(0, 3);
}

function lignePartie(g, compact) {
  const D = deriver(g);
  if (!D) return '';
  const opp = D.opp, p = progression(g);
  const resLab = { victoire: 'Win', defaite: 'Loss', nulle: 'Draw', inconnu: '—' }[D.resultat];
  return `<button class="row games-row" data-open="${g.id}">
    <span class="opp"><span class="pc-dot ${D.me}" title="You had ${D.me === 'w' ? 'White' : 'Black'}"></span><span class="ellip"><b>${esc(D.P.moves.length ? D.nom(opp) : 'FEN position')}</b> ${D.elo(opp) ? `<small>${D.elo(opp)}</small>` : ''}<br><small class="ellip" style="font-family:var(--f-ui)">${esc(D.ouverture.nom)}</small></span></span>
    <span><span class="res res-${D.resultat}">${resLab}</span></span>
    <span class="muted hide-sm">${esc(D.cadence.type ? D.cadence.txt + ' · ' + D.cadence.type : '—')}</span>
    <span class="muted hide-sm hide-md">${fmtDate(D.date)}</span>
    <span class="mono hide-sm">${p < 1 ? `<span class="bar" style="display:block;width:70px"><i style="width:${p * 100}%"></i></span>` : pct(D.prec[D.me])}</span>
    ${compact ? '' : `<span class="mono hide-sm hide-md faint">${D.P.moves.length ? Math.ceil(D.P.moves.length / 2) + ' moves' : '—'}</span>`}
    ${ico('arrow', 'faint')}
  </button>`;
}
function brancherOuvertures(root) { $$('[data-open]', root).forEach(b => b.onclick = () => ouvrirAnalyse(b.dataset.open)); }

// ---------- Overview ----------
let periodeOv = 'tout';
function pageOverview(view) {
  const list = partiesCompletes(), tous = LIB.length;
  let h = `<div class="page-head"><div><h1>Your chess progress</h1><p>Every analyzed game refines your profile: accuracy, results and areas to work on are calculated from your real games.</p></div><button class="btn primary" data-route="import">${ico('analyser')}New analysis</button></div>`;
  if (!tous) {
    view.innerHTML = h + `<div class="card"><div class="empty">${ico('board')}<h3>No analyzed games yet</h3><p>Import your first game: Stockfish analyzes it move by move, then this dashboard fills itself.</p><button class="btn primary" data-route="import">${ico('analyser')}Analyze my first game</button></div></div>`;
    return;
  }
  const precs = list.map(x => x.D.prec[x.D.me]).filter(v => v !== null);

    <div class="card kpi"><span class="eyebrow">Win rate</span><span class="v">${avecRes.length ? pct(100 * win / avecRes.length) : '–'}</span><span class="d">${pluriel(win, 'win')} out of ${pluriel(avecRes.length, 'game')}</span></div>
    <div class="card kpi"><span class="eyebrow">Rating change</span><span class="v ${dElo > 0 ? 'up' : dElo < 0 ? 'down' : ''}">${dElo === null ? (elos.length ? elos[0] : '–') : (dElo > 0 ? '+' : '') + dElo}${dElo === null && elos.length ? '<small>Elo</small>' : ''}</span><span class="d">${dElo === null ? (elos.length ? 'only one data point so far' : 'rating missing from the PGNs') : `de ${elos[0]} à ${elos[elos.length - 1]} Elo`}</span></div>
    <div class="card kpi"><span class="eyebrow">Most frequent mistake</span><span class="v" style="font-size:16px;line-height:1.3">${topMot && topMot[1] ? MOTIFS[topMot[0]].titre : '–'}</span><span class="d">${topMot && topMot[1] ? `${pluriel(topMot[1], 'times', 'times')} in your games` : 'nothing recurring'}</span></div>
  </div>
  <div class="ov-grid">
    <div style="display:grid;gap:16px;min-width:0">
      <section class="card"><div class="card-h"><h2>Accuracy and rating</h2><div class="seg" id="perSeg">${[['7', '7 d'], ['30', '30 d'], ['90', '90 d'], ['tout', 'All']].map(([k, l]) => `<button data-p="${k}" class="${periodeOv === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
        <div class="card-b"><div class="legend" style="margin-bottom:10px"><span><i style="background:var(--accent)"></i>Accuracy (%)</span><span><i style="background:var(--fg-2)"></i>Rating (Elo)</span></div><div id="progChart"></div><p class="faint" id="progNote" style="font-size:12.5px;margin-top:8px"></p></div></section>
      <section class="card"><div class="card-h"><h2>Recent games</h2><button class="btn ghost sm" data-route="parties">See all ${ico('arrow')}</button></div>
        <div class="list" style="margin-top:8px">${LIB.slice(0, 5).map(g => lignePartie(g, true)).join('')}</div></section>
    </div>
    <div style="display:grid;gap:16px;align-self:start;min-width:0">${carteDuJour()}${bulletin(list)}
    <section class="card"><div class="card-h"><h2>To work on</h2><span class="tag tag-moteur">${ico('moteur')}Engine</span></div>
      <div class="work">${(() => { const ax = axesTravail(list); return ax.length ? ax.map((a, k) => `<div class="work-item"><span class="n">${k + 1}</span><div><b>${esc(a.titre)}</b> <span class="faint mono" style="font-size:12px">· ${a.key === 'phase' ? pluriel(a.n, 'mistake') : pluriel(a.n, 'times', 'times')}</span><p>${esc(a.desc)}</p><button class="btn sm" data-train="${a.filtre}">${ico('entrainement')}Practice</button></div></div>`).join('') : `<p class="muted">${list.length ? 'No recurring weakness detected. Keep importing your games.' : 'Areas to work on will appear once a game is fully analyzed.'}</p>`; })()}</div>
      <p class="faint" style="font-size:12.5px;padding:0 16px 16px">Calculated from your real mistakes over ${pluriel(list.length, 'game')}.</p></section></div>

  view.innerHTML = h;

  const jd = $('#jourGo', view); if (jd) jd.onclick = () => { const x = exoDuJour(); TR.filtre = 'tous'; TR.cur = x; TR.etat = 'jeu'; TR.essais = 0; TR.hint = false; aller('entrainement'); };
  $$('[data-train]', view).forEach(b => b.onclick = () => { TR.filtre = b.dataset.train; TR.cur = null; aller('entrainement'); });
  const dessin = () => {
    const now = Date.now(), lim = periodeOv === 'tout' ? 0 : now - (+periodeOv) * 864e5;
    const pts = parDate.filter(x => x.D.date >= lim).map(x => ({ date: x.D.date, prec: x.D.prec[x.D.me], elo: x.D.elo(x.D.me), label: `against ${x.D.nom(x.D.opp)}`, onPick: () => ouvrirAnalyse(x.g.id) }));
    $('#progNote').textContent = !pts.length ? 'No games in this period.' : pts.length < 2 ? 'Only one game in this period: analyze more to see your curve.' : `${pluriel(pts.length, 'game')} in this period.`;
    graphProgression($('#progChart'), () => pts);
  };
  $$('#perSeg button').forEach(b => b.onclick = () => { periodeOv = b.dataset.p; $$('#perSeg button').forEach(x => x.classList.toggle('on', x === b)); dessin(); });

// ---------- Bulletin (inspiré des « report cards ») ----------
const NOTE = v => v === null ? null : (v = Math.round(v)) >= 90 ? 'A' : v >= 80 ? 'B' : v >= 70 ? 'N' : v >= 60 ? 'Q' : 'E';
const NOTE_PAR = (r, k = 1) => r <= 0.25 * k ? 'A' : r <= 0.6 * k ? 'B' : r <= 1 * k ? 'N' : r <= 1.6 * k ? 'Q' : 'E';
function bulletin(list) {
  if (!list.length) return '';
  const { mot, phMoy } = agregats(list), n = list.length;
  const vig = (mot.en_prise + mot.mat_concede) / n, tac = (mot.tactique + mot.double + mot.manquee) / n;
  const lignes = [
    ['Opening', NOTE(phMoy.ouverture), phMoy.ouverture === null ? 'no data yet' : `${pct(phMoy.ouverture)} accuracy`],
    ['Middlegame', NOTE(phMoy.milieu), phMoy.milieu === null ? 'no data yet' : `${pct(phMoy.milieu)} accuracy`],
    ['Endgame', NOTE(phMoy.finale), phMoy.finale === null ? 'no endgame played' : `${pct(phMoy.finale)} accuracy`],
    ['Vigilance', NOTE_PAR(vig), `${vig.toFixed(1)} piece${vig >= 2 ? 's' : ''} left hanging or mate allowed per game`],
    ['Tactics', NOTE_PAR(tac, 8), `${tac.toFixed(1)} chance${tac >= 2 ? 's' : ''} missed per game`],
  ];
  return `<section class="card"><div class="card-h"><h2>Your report card</h2><span class="tag tag-moteur" data-tip="Grades calculated from your ${n} game(s) analyzed by Stockfish. A = excellent, E = top priority.">${ico('moteur')}${pluriel(n, 'game')}</span></div>
    <div class="bulletin">${lignes.map(([t, nt, d]) => `<div class="bl"><span class="note note-${nt || 'x'}">${nt || '–'}</span><div><b>${t}</b><small>${d}</small></div></div>`).join('')}</div></section>`;
}

// ---------- Ouvertures ----------
let colOuv = 'tous';
function pageOuvertures(view) {
  const list = LIB.map(g => ({ g, D: deriver(g) })).filter(x => x.D && x.D.P.moves.length && (colOuv === 'tous' || x.D.me === colOuv));
  const grp = {};
  for (const x of list) {
    const k = x.D.ouverture.nom;
    const o = grp[k] || (grp[k] = { nom: k, eco: x.D.ouverture.eco, n: 0, v: 0, nul: 0, d: 0, prec: [], first: [], last: x });
    o.n++; if (x.D.resultat === 'victoire') o.v++; else if (x.D.resultat === 'nulle') o.nul++; else if (x.D.resultat === 'defaite') o.d++;
    if (x.D.complete && x.D.prec[x.D.me] !== null) o.prec.push(x.D.prec[x.D.me]);
    if (x.D.complete) { const e = x.D.erreurs[0]; if (e) o.first.push(Math.floor(e.i / 2) + 1); }
    if (x.D.date > o.last.D.date) o.last = x;
  }
  const rows = Object.values(grp).sort((a, b) => b.n - a.n);
  view.innerHTML = `<div class="page-head"><div><h1>Openings</h1><p>Your openings, recognized from the first moves of each game, with your results and when your first mistake happens.</p></div><button class="btn primary" data-route="repertoire">${ico('entrainement')}Practice my openings</button>

    <div class="card">${rows.length ? `<div class="row op-row games-head"><span>Opening</span><span>Games</span><span class="hide-sm">Accuracy</span><span class="hide-sm">Wins · draws · losses</span><span class="hide-sm">1st mistake</span><span></span></div>

// ---------- Statistiques ----------
function pageStats(view) {
  const list = partiesCompletes();
  let h = `<div class="page-head"><div><h1>Statistics</h1><p>Based on ${pluriel(list.length, 'fully analyzed game', 'fully analyzed games')}.</p></div></div>`;
  if (!list.length) { view.innerHTML = h + `<div class="card"><div class="empty">${ico('stats')}<h3>No statistics yet</h3><p>They appear as soon as a game is fully analyzed by Stockfish.</p><button class="btn primary" data-route="import">${ico('analyser')}Analyze a game</button></div></div>`; return; }
  const tot = { meilleur: 0, excellent: 0, bon: 0, imprecision: 0, erreur: 0, gaffe: 0 };
  list.forEach(({ D }) => { for (const k in tot) tot[k] += D.counts[D.me][k]; });
  const n = Object.values(tot).reduce((a, b) => a + b, 0) || 1;
  const { mot, phMoy } = agregats(list);

// ---------- Entraînement : tes propres positions ratées ----------
const TR = { filtre: 'tous', cur: null, board: null, etat: 'jeu', essais: 0, hint: false };
const FILTRES_TR = [['tous', 'All'], ['visible', 'Within my reach'], ['en_prise', 'Hanging pieces'], ['tactique', 'Missed wins'], ['double', 'Double attacks'], ['manquee', 'Missed punishments']];

function exercices() {
  const out = [];
  for (const { g, D } of partiesCompletes()) {
    D.erreurs.filter(e => e.tag !== 'imprecision').forEach(e => out.push({ key: g.id + ':' + e.i, g, D, i: e.i, motifs: e.motifs, tag: e.tag, visible: e.visible }));
    D.manquees.forEach(m => out.push({ key: g.id + ':' + m.j, g, D, i: m.j, motifs: ['manquee'], tag: D.tags[m.j], visible: m.visible }));
  }
  const seen = new Set();
  return out.filter(x => !seen.has(x.key) && seen.add(x.key) && x.g.evals[x.i] && x.g.evals[x.i].pv.length);
}

function pageEntrainement(view) {
  const all = exercices(), res = exosResolus();
  const list = all.filter(x => TR.filtre === 'tous' || (TR.filtre === 'visible' ? x.visible : x.motifs.includes(TR.filtre)));
  const ok = all.filter(x => res[x.key] === 'ok').length;
  let h = `<div class="page-head"><div><h1>Training</h1><p>Replay the positions where you went wrong in your own games, and find the move Stockfish recommended.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="tag tag-moteur">${ico('moteur')}${ok} / ${all.length} solved</span><button class="btn sm" data-route="rush">${ico('flame')}Rush mode</button><button class="btn sm" data-route="repertoire">${ico('ouvertures')}My openings</button></div></div>`;
  if (!all.length) {
    view.innerHTML = h + `<div class="card"><div class="empty">${ico('entrainement')}<h3>No puzzles yet</h3><p>Puzzles are created from your mistakes and blunders, once a game is fully analyzed.</p><button class="btn primary" data-route="import">${ico('analyser')}Analyze a game</button></div></div>`;
    return;
  }
  if (!TR.cur || !list.find(x => x.key === TR.cur.key)) { TR.cur = list.find(x => res[x.key] !== 'ok') || list[0] || null; TR.etat = 'jeu'; TR.essais = 0; TR.hint = false; }
  h += `<div class="filters" style="margin-bottom:16px">${FILTRES_TR.map(([k, l]) => { const n = k === 'tous' ? all.length : all.filter(x => k === 'visible' ? x.visible : x.motifs.includes(k)).length; return `<button class="btn sm ${TR.filtre === k ? 'primary' : ''}" data-f="${k}" ${n ? '' : 'disabled'}>${l} <span class="mono" style="opacity:.7">${n}</span></button>`; }).join('')}</div>`;
  if (!TR.cur) { view.innerHTML = h + `<div class="card"><div class="empty"><p>No puzzles in this category.</p></div></div>`; brancherFiltres(view); return; }
  const x = TR.cur, D = x.D, fen = D.P.fens[x.i], trait = fen.split(' ')[1] === 'w' ? 'White' : 'Black';
  const idx = list.indexOf(x);
  h += `<div class="train-grid">
    <div class="train-board"><svg class="board-svg" id="trBoard" role="img" aria-label="Puzzle board: play the move you're looking for"></svg></div>
    <section class="card"><div class="card-h"><h2>Puzzle ${idx + 1} out of ${list.length}</h2>${res[x.key] === 'ok' ? '<span class="tag" style="color:var(--c-meilleur)">' + ico('check') + 'Solved</span>' : ''}</div>
      <div class="card-b" style="display:grid;gap:12px">
        <p><b>Your turn, ${trait} to move.</b> Against ${esc(D.nom(D.opp))}, ${fmtDate(D.date)}, move ${Math.floor(x.i / 2) + 1}.</p>
        <p class="muted" style="font-size:13px">${x.motifs.includes('manquee') ? "Your opponent just made a mistake: find how to punish it." : `In the game, you played ${esc(lisible(fen, D.P.moves[x.i].uci).san)} (${CLASSES[x.tag].nom.toLowerCase()}). Find better.`}</p>

        </div>
        <button class="btn ghost sm" id="trOpen" style="justify-self:start">${ico('board')}Review this position in the game</button>

  view.innerHTML = h;

  $('#trRetry').onclick = () => { TR.etat = 'jeu'; majExo(); };
  $('#trNext').onclick = () => { const l = list; TR.cur = l[(l.indexOf(x) + 1) % l.length]; TR.etat = 'jeu'; TR.essais = 0; TR.hint = false; pageEntrainement(view); };
  $('#trOpen').onclick = () => ouvrirAnalyse(x.g.id, x.i);

function brancherFiltres(view) { $$('[data-f]', view).forEach(b => b.onclick = () => { TR.filtre = b.dataset.f; TR.cur = null; pageEntrainement(view); }); }

function majExo(extra) {
  const x = TR.cur, D = x.D, fen = D.P.fens[x.i], best = x.g.evals[x.i].pv[0], fb = $('#trFb');
  const b = lisible(fen, best), w = pourquoi(fen, x.g.evals[x.i], x.i ? D.P.fens[x.i - 1] : null, x.i ? D.P.moves[x.i - 1].uci : null);
  const st = { fen, orient: D.me, last: x.i ? [D.P.moves[x.i - 1].from, D.P.moves[x.i - 1].to] : null, arrows: [], hint: TR.hint ? best.slice(0, 2) : null, interactive: TR.etat === 'jeu' };
  $('#trRetry').hidden = TR.etat !== 'rate';
  if (TR.etat === 'jeu') fb.innerHTML = TR.hint ? `<div class="feedback">${ico('hint')}<p>The piece to move is highlighted.</p></div>` : '';
  if (TR.etat === 'calcul') { fb.innerHTML = `<div class="feedback"><p class="thinking">Stockfish is checking your move…</p></div>`; st.interactive = false; st.fen = extra.fen; st.last = [extra.uci.slice(0, 2), extra.uci.slice(2, 4)]; }
  if (TR.etat === 'trouve' || TR.etat === 'solution') {
    st.interactive = false; st.arrows = [{ uci: best, cls: 'best' }];
    fb.innerHTML = `<div class="feedback ${TR.etat === 'trouve' ? 'ok' : ''}"><b>${TR.etat === 'trouve' ? (extra && extra.equiv ? 'Well played: a move as strong as the engine\'s.' : 'Great, that\'s the best move!') : 'Solution'}</b>
      <p><span class="mv">${esc(b.san)}</span> <span class="muted">(${esc(b.sens)})</span>${w ? ` : it ${esc(w)}.` : '.'}</p>
      <div class="line">${variante(fen, x.g.evals[x.i].pv, 6).map(c => `<span class="n">${c.num}</span><span>${esc(c.san)}</span>`).join(' ')}</div></div>`;
  }
  if (TR.etat === 'rate') {
    st.interactive = false; st.fen = extra.fen; st.last = [extra.uci.slice(0, 2), extra.uci.slice(2, 4)];
    fb.innerHTML = `<div class="feedback ko"><b>Not quite.</b><p>After <span class="mv">${esc(extra.san)}</span>, Stockfish evaluates the position at ${texteEval(extra.ev)}, versus ${texteEval(x.g.evals[x.i])} with the best move.${extra.rep ? ` The opponent's reply would be <span class="mv">${esc(extra.rep)}</span>.` : ''}</p></div>`;
  }
  TR.board.set(st);
}

async function essaiExo(uci) {
  const x = TR.cur, fen = x.D.P.fens[x.i], ev0 = x.g.evals[x.i];
  if (uci === ev0.pv[0]) { if (TR.essais === 0) marquerExo(x.key, true); TR.etat = 'trouve'; majExo(); toast('Puzzle solved.'); return; }
  const g = new Chess(fen), m = jouer(g, uci), nf = g.fen();
  TR.etat = 'calcul'; majExo({ fen: nf, uci });
  let ev;
  try { ev = await Moteur.analyser(nf, { depth: 13, ms: 1500, prio: true }); } catch { TR.etat = 'jeu'; majExo(); return; }
  if (TR.cur !== x) return;
  const perte = deltaCoup(x.D.me, ev0, ev);
  if (perte < 0.05) { if (TR.essais === 0) marquerExo(x.key, true); TR.etat = 'trouve'; majExo({ equiv: true }); toast('Puzzle solved.'); return; }
  TR.essais++; marquerExo(x.key, false);
  TR.etat = 'rate';
  majExo({ fen: nf, uci, san: m.san, ev, rep: ev.pv[0] ? lisible(nf, ev.pv[0]).san : '' });
}

// ---------- Leçon guidée : le prof te fait rejouer les moments clés de ta partie ----------
const LC = { id: null, moments: [], k: 0, etat: 'jeu', hint: false, res: {}, extra: null, board: null };

function momentsLecon(g, D) {
  const m = D.erreurs.map(e => ({ i: e.i, type: 'erreur', tag: e.tag, delta: e.delta }))
    .concat(D.manquees.map(x => ({ i: x.j, type: 'punir', tag: D.tags[x.i], delta: x.delta })))
    .filter(x => g.evals[x.i] && g.evals[x.i].pv.length);
  const graves = m.filter(x => x.tag !== 'imprecision');
  const choix = (graves.length >= 3 ? graves : m).sort((a, b) => b.delta - a.delta).slice(0, 7);
  return choix.sort((a, b) => a.i - b.i);
}

function rendreLecon(body) {

function majLecon() {
  const g = g_(), D = D_(), x = LC.moments[LC.k], fen = D.P.fens[x.i], ev0 = g.evals[x.i], best = ev0.pv[0];
  const fb = $('#lcFb'), ex = LC.extra;
  const st = { fen, orient: D.me, last: x.i ? [D.P.moves[x.i - 1].from, D.P.moves[x.i - 1].to] : null, arrows: [], hint: LC.hint ? best.slice(0, 2) : null, interactive: LC.etat === 'jeu' };
  $('#lcRetry').hidden = LC.etat !== 'rate';
  $('#lcHint').disabled = $('#lcSol').disabled = LC.etat !== 'jeu' && LC.etat !== 'rate';
  let h = '';
  if (LC.etat === 'jeu' && LC.hint) h = `<div class="feedback">${ico('hint')}<p>The piece to move is highlighted on the board.</p></div>`;
  if (LC.etat === 'calcul') { st.interactive = false; st.fen = ex.fen; st.last = [ex.uci.slice(0, 2), ex.uci.slice(2, 4)]; h = `<div class="feedback"><p class="thinking">Stockfish is checking your move…</p></div>`; }
  if (LC.etat === 'rate') {
    st.interactive = false; st.fen = ex.fen; st.last = [ex.uci.slice(0, 2), ex.uci.slice(2, 4)];
    if (ex.ev.pv[0]) st.arrows = [{ uci: ex.ev.pv[0], cls: 'bad' }];
    h = `<div class="feedback ko"><b>Not yet.</b><p>After <span class="mv">${esc(ex.san)}</span>, Stockfish evaluates the position at ${evalEleve(ex.ev, D.me)} for you, versus ${evalEleve(ev0, D.me)} with the best move.${ex.ev.pv[0] ? ` Your opponent would reply <span class="mv">${esc(lisible(ex.fen, ex.ev.pv[0]).san)}</span>.` : ''}</p></div>`;
  }
  if (LC.etat === 'trouve' || LC.etat === 'solution') {
    st.interactive = false; st.arrows = [{ uci: best, cls: 'best' }];
    const b = lisible(fen, best);
    h = `<div class="feedback ${LC.etat === 'trouve' ? 'ok' : ''}"><b>${LC.etat === 'trouve' ? (ex && ex.equiv ? 'Well spotted: your move is as strong as the engine\'s.' : 'Great, that\'s the best move!') : 'The answer'}</b>
      <p><span class="mv">${esc(b.san)}</span> <span class="muted">(${esc(b.sens)})</span></p>${ligneCliquable(fen, ev0.pv, 6).replace(/<button data-line="\d+"/g, '<span').replace(/<\/button>/g, '</span>')}</div>`;
    h += `<div class="expl" style="border-top:0;padding-top:0"><span class="tag tag-moteur" style="justify-self:start">${ico('moteur')}Engine</span>${explicationMoteur(x.type === 'punir' ? x.i - 1 : x.i)}</div>`;
    const cm = g.prof && g.prof.comments[x.type === 'punir' ? x.i : x.i + 1];
    if (cm) h += `<div class="ia-box"><div class="ia-h"><span class="tag tag-ia">${ico('ia')}Coach · AI</span>${boutonVoix()}</div><p>${esc(cm.c)}</p>${cm.k ? `<div class="conseil-box">${ico('bulb')}<p><b>Tip</b> ${esc(cm.k)}</p></div>` : ''}</div>`;
    else if (IA.dispo) h += `<p class="faint" style="font-size:12.5px">${ico('ia')} Start the coach (Comments tab of the analysis) to get their explanation and tip on this moment.</p>`;
  }
  fb.innerHTML = h;
  LC.board.set(st);
}

async function essaiLecon(uci) {
  const g = g_(), D = D_(), x = LC.moments[LC.k], fen = D.P.fens[x.i], ev0 = g.evals[x.i], key = g.id + ':' + x.i;
  const premier = LC.res[LC.k] === undefined;
  if (uci === ev0.pv[0]) { if (premier) LC.res[LC.k] = true; marquerExo(key, premier); LC.etat = 'trouve'; LC.extra = null; majLecon(); return; }
  const gg = new Chess(fen), m = jouer(gg, uci), nf = gg.fen();
  LC.etat = 'calcul'; LC.extra = { fen: nf, uci }; majLecon();
  let ev;
  try { ev = await Moteur.analyser(nf, { depth: 13, ms: 1500, prio: true }); } catch { LC.etat = 'jeu'; majLecon(); return; }
  if (LC.moments[LC.k] !== x || !$('#lcFb')) return;
  if (deltaCoup(D.me, ev0, ev) < 0.05) { if (premier) LC.res[LC.k] = true; marquerExo(key, premier); LC.etat = 'trouve'; LC.extra = { equiv: true }; majLecon(); return; }
  if (premier) LC.res[LC.k] = false;
  marquerExo(key, false);
  LC.etat = 'rate'; LC.extra = { fen: nf, uci, san: m.san, ev }; majLecon();
}

function finLecon(body) {
  const g = g_(), D = D_();

  }).join('');
  body.innerHTML = `<div class="card" style="max-width:820px;margin:0 auto">

    </div>

}

// ---------- Mon prof : plan de progression, progrès et carnet de conseils sur toutes tes parties ----------
const K_PLAN = 'coupjuste-plan-v1';
const COACH = { theme: 'tous', plan: lire(K_PLAN, null), enCours: false, tout: false };

function carnetConseils() {
  const out = [];
  for (const g of LIB) {
    if (!g.prof || !g.prof.comments) continue;
    const D = deriver(g); if (!D) continue;
    for (const [ply, c] of Object.entries(g.prof.comments)) {
      const i = +ply - 1, mv = D.P.moves[i];
      if (!mv || !c.k) continue;
      out.push({ g, D, ply: +ply, i, conseil: c.k, theme: (c.t || 'autre').toLowerCase(), tag: D.tags[i], mine: mv.color === D.me, san: `${numero(D.P.fens[i])} ${lisible(D.P.fens[i], mv.uci).san}` });
    }
  }
  return out.sort((a, b) => (b.D.date - a.D.date) || (a.ply - b.ply));
}

function tendances(list) {
  const tri = [...list].sort((a, b) => a.D.date - b.D.date || a.g.addedAt - b.g.addedAt);
  if (tri.length < 4) return null;
  const mid = Math.floor(tri.length / 2), A1 = tri.slice(0, mid), A2 = tri.slice(mid);
  const parPartie = (l, f) => l.reduce((s, x) => s + f(x), 0) / l.length;
  const lignes = [{ nom: 'Average accuracy', a: moyenne(A1.map(x => x.D.prec[x.D.me]).filter(v => v !== null)), b: moyenne(A2.map(x => x.D.prec[x.D.me]).filter(v => v !== null)), pct: true, haut: true }];
  lignes.push({ nom: 'Blunders per game', a: parPartie(A1, x => x.D.counts[x.D.me].gaffe), b: parPartie(A2, x => x.D.counts[x.D.me].gaffe), haut: false });
  for (const k of Object.keys(MOTIFS)) {
    const f = x => k === 'manquee' ? x.D.manquees.length : x.D.erreurs.filter(e => e.motifs.includes(k)).length;
    lignes.push({ nom: MOTIFS[k].titre, a: parPartie(A1, f), b: parPartie(A2, f), haut: false });
  }
  return { n1: A1.length, n2: A2.length, lignes };
}

function resumePourPlan(list, carnet) {
  const { mot, phMoy } = agregats(list);
  const themes = {};
  carnet.filter(c => c.mine && MAUVAIS.includes(c.tag)).forEach(c => themes[c.theme] = (themes[c.theme] || 0) + 1);
  const res = { victoire: 0, defaite: 0, nulle: 0 };
  list.forEach(x => { if (res[x.D.resultat] !== undefined) res[x.D.resultat]++; });
  const ouv = {};
  list.forEach(x => { const k = `${x.D.ouverture.nom} (${x.D.me === 'w' ? 'White' : 'Black'})`; ouv[k] = ouv[k] || { n: 0, v: 0 }; ouv[k].n++; if (x.D.resultat === 'victoire') ouv[k].v++; });
  const elos = [...list].sort((a, b) => a.D.date - b.D.date).map(x => x.D.elo(x.D.me)).filter(Boolean);
  return {
    parties: list.length, resultats: res, elo: elos.length ? { premier: elos[0], dernier: elos[elos.length - 1] } : null,
    precision_moyenne: Math.round(moyenne(list.map(x => x.D.prec[x.D.me]).filter(v => v !== null)) || 0),
    precision_par_phase: Object.fromEntries(Object.entries(phMoy).map(([k, v]) => [k, v === null ? null : Math.round(v)])),
    erreurs_par_motif: Object.fromEntries(Object.entries(mot).map(([k, v]) => [MOTIFS[k].titre, v])),
    themes_des_erreurs_selon_le_prof: themes,
    ouvertures: ouv,
    derniers_conseils_du_prof: carnet.filter(c => c.mine).slice(0, 25).map(c => `[${c.theme}] ${c.conseil}`),
  };
}

Rules:

- 3 priorities maximum, ranked by impact on their results. Each with a concrete exercise doable in 10 to 20 minutes a day.
- For each priority, choose "filtre" among: "en_prise", "tactique", "double", "manquee", "tous" (the app's most useful puzzle category).
- A single golden rule, short, to apply before every move.
- A measurable goal for their next set of games (for example fewer blunders per game, or a target accuracy).

Data:
${JSON.stringify(data, null, 1)}

Answer only with this JSON:
{"diagnostic": "2 or 3 sentences", "priorites": [{"titre": "…", "pourquoi": "…", "exercice": "…", "filtre": "tactique"}], "regle_d_or": "…", "objectif": "…"}`;

}

  if (!t) h += `<p class="muted">Analyze at least 4 games to see if you repeat the same mistakes less often. You have ${list.length}.</p>`;
  else {
    h += `<table class="dist"><thead><tr><th></th><th>${pluriel(t.n1, 'older game', 'older games')}</th><th>${pluriel(t.n2, 'recent game', 'recent games')}</th><th>Trend</th></tr></thead><tbody>`;
    for (const l of t.lignes) {
      if (l.a === null || l.b === null || isNaN(l.a) || isNaN(l.b)) continue;
      const d = l.b - l.a, mieux = l.haut ? d > 0.5 : d < -0.05, pire = l.haut ? d < -0.5 : d > 0.05;
      const fmt = v => l.pct ? pct(v) : v.toFixed(1);
      h += `<tr><th>${esc(l.nom)}</th><td>${fmt(l.a)}</td><td>${fmt(l.b)}</td><td class="${mieux ? 'up' : pire ? 'down' : 'faint'}">${mieux ? 'improving' : pire ? 'to watch' : 'stable'}</td></tr>`;
    }
    h += `</tbody></table>`;
  }
  h += `</div></section>`;
  // carnet de conseils
  const mes = carnet.filter(c => c.mine);
  const themes = {};
  mes.forEach(c => themes[c.theme] = (themes[c.theme] || 0) + 1);
  const ths = Object.entries(themes).sort((a, b) => b[1] - a[1]);
  if (COACH.theme !== 'tous' && !themes[COACH.theme]) COACH.theme = 'tous';
  const filtres = mes.filter(c => COACH.theme === 'tous' || c.theme === COACH.theme);
  const vis = COACH.tout ? filtres.slice(0, 200) : filtres.slice(0, 10);
  h += `<section class="card" style="margin-top:16px"><div class="card-h"><h2>Tip notebook</h2><span class="faint" style="font-size:12.5px">${pluriel(mes.length, 'tip')} on your moves</span></div>`;
  if (!mes.length) h += `<div class="card-b"><p class="muted">The coach's tips on your moves will appear here, sorted by theme, as soon as a game is commented.</p></div>`;
  else {
    h += `<div class="filters" style="padding:12px 16px 4px"><button class="btn sm ${COACH.theme === 'tous' ? 'primary' : ''}" data-th="tous">All <span class="mono" style="opacity:.7">${mes.length}</span></button>${ths.map(([k, n]) => `<button class="btn sm ${COACH.theme === k ? 'primary' : ''}" data-th="${esc(k)}">${esc(k[0].toUpperCase() + k.slice(1))} <span class="mono" style="opacity:.7">${n}</span></button>`).join('')}</div>
      <div class="list" style="margin-top:6px">${vis.map(c => `<button class="row carnet-row" data-g="${c.g.id}" data-p="${c.ply}"><span>${badge(c.tag)}</span><span class="ellip"><span class="mv">${esc(c.san)}</span> <span class="faint" style="font-size:12px">· against ${esc(c.D.nom(c.D.opp))}, ${fmtDateCourt(c.D.date)}</span><br><span style="white-space:normal">${esc(c.conseil)}</span></span>${ico('arrow', 'faint')}</button>`).join('')}</div>${filtres.length > vis.length ? `<div class="card-b" style="border-top:1px solid var(--line)"><button class="btn sm" id="carnetTout">See the ${filtres.length - vis.length} more tips</button></div>` : ''}`;
  }
  h += `</section>`;
  view.innerHTML = h;
  $$('[data-train]', view).forEach(b => b.onclick = () => { TR.filtre = b.dataset.train; TR.cur = null; aller('entrainement'); });
  $$('[data-th]', view).forEach(b => b.onclick = () => { COACH.theme = b.dataset.th; COACH.tout = false; pageProf(view); });
  const ct = $('#carnetTout', view); if (ct) ct.onclick = () => { COACH.tout = true; pageProf(view); };
  $$('[data-g]', view).forEach(b => b.onclick = () => ouvrirAnalyse(b.dataset.g, +b.dataset.p));
  const pg = $('#planGo', view); if (pg) pg.onclick = () => genererPlan(list, carnet);
  const lg = $('#lotGo', view); if (lg) lg.onclick = () => commenterTout();
  const ls = $('#lotStop', view); if (ls) ls.onclick = () => { IA.stopLot = true; if (IA.ctl) IA.ctl.abort(); };
}

function meilleureSerie() {
  const jours = [...new Set(lire(K_SERIE, []))].map(k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; }).sort((a, b) => a - b);
  let best = 0, cur = 0;
  jours.forEach((j, i) => { cur = i && j - jours[i - 1] === 1 ? cur + 1 : 1; best = Math.max(best, cur); });
  return best;
}
const debutSemaine = () => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };

function eloParCadence(list) {
  const par = {};
  [...list].sort((a, b) => a.D.date - b.D.date).forEach(({ D }) => {
    const t = D.cadence.type, e = D.elo(D.me);
    if (!t || e === null) return;
    (par[t] = par[t] || []).push({ date: D.date, elo: e });
  });
  return par;
}

function sparkline(pts) {
  if (pts.length < 2) return '';
  const W = 120, H = 32, v = pts.map(p => p.elo), lo = Math.min(...v), hi = Math.max(...v), r = hi - lo || 1;
  const d = v.map((e, i) => `${i ? 'L' : 'M'}${(i / (v.length - 1) * W).toFixed(1)} ${(H - 3 - (e - lo) / r * (H - 6)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

function badges(list) {
  const res = exosResolus(), resolus = Object.values(res).filter(x => x === 'ok').length;
  const n = list.length, serie = meilleureSerie();
  const sansGaffe = list.some(({ D }) => D.P.moves.length >= 40 && D.counts[D.me].gaffe === 0);
  const prec90 = list.some(({ D }) => D.prec[D.me] !== null && D.prec[D.me] >= 90);
  const victoire = list.some(({ D }) => D.resultat === 'victoire');
  const ouv = new Set(list.map(({ D }) => D.ouverture.nom).filter(Boolean)).size;
  const prof = LIB.filter(g => g.prof && Object.keys(g.prof.comments || {}).length).length;
  return [
    ['First step', 'Analyze your first game', n, 1],
    ['Regular', 'Analyze 10 games', n, 10],
    ['Analyst', 'Analyze 50 games', n, 50],
    ['First win', 'Analyze a game you won', +victoire, 1],
    ['Steady hand', 'A game of 20 moves or more without a single blunder', +sansGaffe, 1],
    ['Surgical precision', 'A game with 90% accuracy or more', +prec90, 1],
    ['Attentive student', 'A game commented by the coach', prof, 1],
    ['Consistent', 'A 3-day training streak', serie, 3],
    ['Unstoppable', 'A 7-day training streak', serie, 7],
    ['Tactician', 'Solve 10 puzzles', resolus, 10],
    ['Puzzle master', 'Solve 50 puzzles', resolus, 50],
    ['Explorer', 'Play 5 different openings', ouv, 5],
  ].map(([t, d, v, c]) => ({ t, d, v: Math.min(v, c), c, ok: v >= c }));
}

// ---------- Rapport de partie en PDF (jsPDF chargé à la demande depuis cdnjs) ----------
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let JSPDF = null;
function chargerJsPDF() {
  if (JSPDF) return JSPDF;
  JSPDF = new Promise((ok, ko) => {
    if (window.jspdf) return ok(window.jspdf);
    const s = Object.assign(document.createElement('script'), { src: JSPDF_URL, async: true });
    s.onload = () => window.jspdf ? ok(window.jspdf) : ko(new Error('jsPDF'));
    s.onerror = () => { JSPDF = null; ko(new Error('jsPDF')); };
    document.head.append(s);
  });
  return JSPDF;
}

// Téléchargement d'un fichier généré (claude.ai : capacité downloads ; site : lien direct)
async function telecharger(nom, blob) {
  if (window.claude && claude.use) {
    const dl = await claude.use('downloads').catch(() => null);
    if (dl) { try { await dl.save({ filename: nom, data: blob }); return true; } catch (e) { if (e && (e.code === 'declined' || e.code === 'cancelled')) return false; } }
  }
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: nom });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}

// Échiquier seul en SVG (pour le PDF)
function plateauSVG(fen, orient, fleches = [], marque = null) {
  const sprite = (document.querySelector('svg defs') || {}).innerHTML || '';
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="480" viewBox="0 0 480 480"><defs>${sprite}</defs>${plateauCorps(fen, orient, fleches, marque)}</svg>`;
}
// Contenu d'un échiquier de 480 × 480 (sans defs), réutilisé par le PDF et les images du bilan
function plateauCorps(fen, orient, fleches = [], marque = null) {
  const c = 60, B = 480;
  const cs = getComputedStyle(document.documentElement), L = cs.getPropertyValue('--sq-l').trim() || '#ECE5D2', Dk = cs.getPropertyValue('--sq-d').trim() || '#4F7363';
  const xy = sq => { const f = sq.charCodeAt(0) - 97, r = +sq[1] - 1; return orient === 'w' ? [f * c, (7 - r) * c] : [(7 - f) * c, r * c]; };
  let s = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { const [x, y] = xy(String.fromCharCode(97 + f) + (r + 1)); s += `<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="${(f + r) % 2 === 0 ? Dk : L}"/>`; }
  if (marque) for (const sq of [marque.slice(0, 2), marque.slice(2, 4)]) { const [x, y] = xy(sq); s += `<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="rgba(214,178,98,.55)"/>`; }
  fen.split(' ')[0].split('/').forEach((row, ri) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { f += +ch; continue; }
      const [x, y] = xy(String.fromCharCode(97 + f) + (8 - ri));
      s += `<use href="#${ch === ch.toUpperCase() ? 'w' : 'b'}${ch.toLowerCase()}" transform="translate(${x},${y}) scale(${c / 40})"/>`; f++;
    }
  });
  for (const [uci, fill] of fleches) {
    if (!uci) continue;
    let [x1, y1] = xy(uci.slice(0, 2)), [x2, y2] = xy(uci.slice(2, 4)); x1 += c / 2; y1 += c / 2; x2 += c / 2; y2 += c / 2;
    const dx = x2 - x1, dy = y2 - y1, Ln = Math.hypot(dx, dy); if (!Ln) continue;
    const ux = dx / Ln, uy = dy / Ln, nx = -uy, ny = ux, w = 6, hw = 16, hl = 22, tx = x2 - ux * 6, ty = y2 - uy * 6, bx = tx - ux * hl, by = ty - uy * hl, sx = x1 + ux * 12, sy = y1 + uy * 12;
    s += `<polygon fill="${fill}" points="${[[sx + nx * w, sy + ny * w], [bx + nx * w, by + ny * w], [bx + nx * hw, by + ny * hw], [tx, ty], [bx - nx * hw, by - ny * hw], [bx - nx * w, by - ny * w], [sx - nx * w, sy - ny * w]].map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
  }
  return s;
}
