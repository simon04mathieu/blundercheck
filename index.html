function brancherFiltres(view) { $$('[data-f]', view).forEach(b => b.onclick = () => { TR.filtre = b.dataset.f; TR.cur = null; pageEntrainement(view); }); }

function majExo(extra) {
  const x = TR.cur, D = x.D, fen = D.P.fens[x.i], best = x.g.evals[x.i].pv[0], fb = $('#trFb');
  const b = lisible(fen, best), w = pourquoi(fen, x.g.evals[x.i], x.i ? D.P.fens[x.i - 1] : null, x.i ? D.P.moves[x.i - 1].uci : null);
  const st = { fen, orient: D.me, last: x.i ? [D.P.moves[x.i - 1].from, D.P.moves[x.i - 1].to] : null, arrows: [], hint: TR.hint ? best.slice(0, 2) : null, interactive: TR.etat === 'jeu' };
  $('#trRetry').hidden = TR.etat !== 'rate';
  if (TR.etat === 'jeu') fb.innerHTML = TR.hint ? `<div class="feedback">${ico('hint')}<p>La pièce à jouer est surlignée.</p></div>` : '';
  if (TR.etat === 'calcul') { fb.innerHTML = `<div class="feedback"><p class="thinking">Stockfish vérifie ton coup…</p></div>`; st.interactive = false; st.fen = extra.fen; st.last = [extra.uci.slice(0, 2), extra.uci.slice(2, 4)]; }
  if (TR.etat === 'trouve' || TR.etat === 'solution') {
    st.interactive = false; st.arrows = [{ uci: best, cls: 'best' }];
    fb.innerHTML = `<div class="feedback ${TR.etat === 'trouve' ? 'ok' : ''}"><b>${TR.etat === 'trouve' ? (extra && extra.equiv ? 'Bien joué : coup aussi fort que celui du moteur.' : 'Bravo, c’est le meilleur coup !') : 'Solution'}</b>
      <p><span class="mv">${esc(b.san)}</span> <span class="muted">(${esc(b.sens)})</span>${w ? ` : il ${esc(w)}.` : '.'}</p>
      <div class="line">${variante(fen, x.g.evals[x.i].pv, 6).map(c => `<span class="n">${c.num}</span><span>${esc(c.san)}</span>`).join(' ')}</div></div>`;
  }
  if (TR.etat === 'rate') {
    st.interactive = false; st.fen = extra.fen; st.last = [extra.uci.slice(0, 2), extra.uci.slice(2, 4)];
    fb.innerHTML = `<div class="feedback ko"><b>Pas tout à fait.</b><p>Après <span class="mv">${esc(extra.san)}</span>, Stockfish évalue la position à ${texteEval(extra.ev)}, contre ${texteEval(x.g.evals[x.i])} avec le meilleur coup.${extra.rep ? ` La réponse adverse serait <span class="mv">${esc(extra.rep)}</span>.` : ''}</p></div>`;
  }
  TR.board.set(st);
}

async function essaiExo(uci) {
  const x = TR.cur, fen = x.D.P.fens[x.i], ev0 = x.g.evals[x.i];
  if (uci === ev0.pv[0]) { if (TR.essais === 0) marquerExo(x.key, true); TR.etat = 'trouve'; majExo(); toast('Exercice réussi.'); return; }
  const g = new Chess(fen), m = jouer(g, uci), nf = g.fen();
  TR.etat = 'calcul'; majExo({ fen: nf, uci });
  let ev;
  try { ev = await Moteur.analyser(nf, { depth: 13, ms: 1500, prio: true }); } catch { TR.etat = 'jeu'; majExo(); return; }
  if (TR.cur !== x) return;
  const perte = deltaCoup(x.D.me, ev0, ev);
  if (perte < 0.05) { if (TR.essais === 0) marquerExo(x.key, true); TR.etat = 'trouve'; majExo({ equiv: true }); toast('Exercice réussi.'); return; }
  TR.essais++; marquerExo(x.key, false);
  TR.etat = 'rate';
  majExo({ fen: nf, uci, san: m.san, ev, rep: ev.pv[0] ? lisible(nf, ev.pv[0]).san : '' });
}

// ---------- Leçon guidée : le prof te fait rejouer les moments clés de ta partie ----------
const LC = { id: null, moments: [], k: 0, etat: 'jeu', hint: false, res: {}, extra: null, board: null };

function momentsLecon(g, D) {
  const m = D.erreurs.map(e => ({ i: e.i, type: 'erreur', tag: e.tag, delta: e.delta }))
    .concat(D.manquees.map(x => ({ i: x.j, type: 'punir', tag: D.tags[x.i], delta: x.delta })))
    .filter(x => g.evals[x.i] && g.evals[x.i].pv.length);
  const graves = m.filter(x => x.tag !== 'imprecision');
  const choix = (graves.length >= 3 ? graves : m).sort((a, b) => b.delta - a.delta).slice(0, 7);
  return choix.sort((a, b) => a.i - b.i);
}

function rendreLecon(body) {
  const g = g_(), D = D_();
  if (!D.affine) {
    body.innerHTML = `<div class="card"><div class="empty">${ico('entrainement')}<h3>La leçon se prépare</h3><p>Elle sera prête dès que Stockfish aura fini d'analyser la partie (${Math.round(progression(g) * 100)} %).</p></div></div>`;
    return;
  }
  if (LC.id !== g.id) Object.assign(LC, { id: g.id, moments: momentsLecon(g, D), k: 0, etat: 'jeu', hint: false, res: {}, extra: null });
  if (!LC.moments.length) {
    body.innerHTML = `<div class="card"><div class="empty">${ico('check')}<h3>Rien à reprendre dans cette partie</h3><p>Aucune erreur importante de ta part et aucune occasion manquée. Importe une autre partie, ou travaille tes positions dans l'Entraînement.</p><button class="btn" data-route="entrainement">${ico('entrainement')}Entraînement</button></div></div>`;
    return;
  }
  if (LC.k >= LC.moments.length) { finLecon(body); return; }
  const x = LC.moments[LC.k];
  const fen = D.P.fens[x.i], trait = fen.split(' ')[1] === 'w' ? 'Blancs' : 'Noirs';
  const pts = LC.moments.map((m, n) => `<span class="lc-dot ${LC.res[n] === true ? 'ok' : LC.res[n] === false ? 'ko' : ''} ${n === LC.k ? 'cur' : ''}" title="Moment ${n + 1}"></span>`).join('');
  const consigne = x.type === 'punir'
    ? `${esc(D.nom(D.opp))} vient de jouer ${esc(libCoup(D.P.fens[x.i - 1], D.P.moves[x.i - 1].uci))}, une ${CLASSES[x.tag].nom.toLowerCase()}. <b>Trouve comment en profiter.</b>`
    : `Dans la partie, tu as joué ici <span class="mv">${esc(lisible(fen, D.P.moves[x.i].uci).san)}</span> (${CLASSES[x.tag].nom.toLowerCase()}). <b>Trouve mieux.</b>`;
  body.innerHTML = `<div class="an-grid">
    <div class="an-left"><div class="board-zone" style="grid-template-columns:minmax(0,1fr)"><svg class="board-svg" id="lcBoard" role="img" aria-label="Échiquier de la leçon : joue le coup que tu proposes"></svg></div></div>
    <section class="card panel lc-panel">
      <div class="card-h"><h2>${ico('entrainement')} Leçon de la partie</h2><span class="faint mono" style="font-size:12.5px">${LC.k + 1} / ${LC.moments.length}</span></div>
      <div class="lc-dots">${pts}</div>
      <div class="panel-body" style="padding:14px 16px;display:grid;gap:12px;align-content:start">
        <div class="eyebrow">Coup ${Math.floor(x.i / 2) + 1} · trait aux ${trait}</div>
        <p>${consigne}</p>
        <div id="lcFb"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn sm" id="lcHint">${ico('hint')}Indice</button>
          <button class="btn sm" id="lcSol">Voir la réponse</button>
          <button class="btn sm" id="lcRetry" hidden>Réessayer</button>
          <button class="btn sm primary" id="lcNext" style="margin-left:auto">${LC.k + 1 < LC.moments.length ? 'Moment suivant' : 'Terminer la leçon'} ${ico('next')}</button>
        </div>
        <button class="btn ghost sm" id="lcOpen" style="justify-self:start">${ico('board')}Voir ce moment dans l'analyse</button>
      </div>
    </section></div>`;
  LC.board = creerEchiquier($('#lcBoard'), { onMove: essaiLecon });
  $('#lcHint').onclick = () => { LC.hint = true; majLecon(); };
  $('#lcSol').onclick = () => { if (LC.res[LC.k] === undefined) LC.res[LC.k] = false; marquerExo(g.id + ':' + x.i, false); LC.etat = 'solution'; majLecon(); };
  $('#lcRetry').onclick = () => { LC.etat = 'jeu'; LC.extra = null; majLecon(); };
  $('#lcNext').onclick = () => { if (LC.res[LC.k] === undefined) LC.res[LC.k] = false; LC.k++; LC.etat = 'jeu'; LC.hint = false; LC.extra = null; rendreLecon(body); };
  $('#lcOpen').onclick = () => { allerPly(x.type === 'punir' ? x.i : x.i + 1); };
  majLecon();
}

function majLecon() {
  const g = g_(), D = D_(), x = LC.moments[LC.k], fen = D.P.fens[x.i], ev0 = g.evals[x.i], best = ev0.pv[0];
  const fb = $('#lcFb'), ex = LC.extra;
  const st = { fen, orient: D.me, last: x.i ? [D.P.moves[x.i - 1].from, D.P.moves[x.i - 1].to] : null, arrows: [], hint: LC.hint ? best.slice(0, 2) : null, interactive: LC.etat === 'jeu' };
  $('#lcRetry').hidden = LC.etat !== 'rate';
  $('#lcHint').disabled = $('#lcSol').disabled = LC.etat !== 'jeu' && LC.etat !== 'rate';
  let h = '';
  if (LC.etat === 'jeu' && LC.hint) h = `<div class="feedback">${ico('hint')}<p>La pièce à jouer est surlignée sur l'échiquier.</p></div>`;
  if (LC.etat === 'calcul') { st.interactive = false; st.fen = ex.fen; st.last = [ex.uci.slice(0, 2), ex.uci.slice(2, 4)]; h = `<div class="feedback"><p class="thinking">Stockfish vérifie ton coup…</p></div>`; }
  if (LC.etat === 'rate') {
    st.interactive = false; st.fen = ex.fen; st.last = [ex.uci.slice(0, 2), ex.uci.slice(2, 4)];
    if (ex.ev.pv[0]) st.arrows = [{ uci: ex.ev.pv[0], cls: 'bad' }];
    h = `<div class="feedback ko"><b>Pas encore.</b><p>Après <span class="mv">${esc(ex.san)}</span>, Stockfish évalue la position à ${evalEleve(ex.ev, D.me)} pour toi, contre ${evalEleve(ev0, D.me)} avec le meilleur coup.${ex.ev.pv[0] ? ` Ton adversaire répondrait <span class="mv">${esc(lisible(ex.fen, ex.ev.pv[0]).san)}</span>.` : ''}</p></div>`;
  }
  if (LC.etat === 'trouve' || LC.etat === 'solution') {
    st.interactive = false; st.arrows = [{ uci: best, cls: 'best' }];
    const b = lisible(fen, best);
    h = `<div class="feedback ${LC.etat === 'trouve' ? 'ok' : ''}"><b>${LC.etat === 'trouve' ? (ex && ex.equiv ? 'Bien vu : ton coup est aussi fort que celui du moteur.' : 'Bravo, c’est le meilleur coup !') : 'La réponse'}</b>
      <p><span class="mv">${esc(b.san)}</span> <span class="muted">(${esc(b.sens)})</span></p>${ligneCliquable(fen, ev0.pv, 6).replace(/<button data-line="\d+"/g, '<span').replace(/<\/button>/g, '</span>')}</div>`;
    h += `<div class="expl" style="border-top:0;padding-top:0"><span class="tag tag-moteur" style="justify-self:start">${ico('moteur')}Moteur</span>${explicationMoteur(x.type === 'punir' ? x.i - 1 : x.i)}</div>`;
    const cm = g.prof && g.prof.comments[x.type === 'punir' ? x.i : x.i + 1];
    if (cm) h += `<div class="ia-box"><div class="ia-h"><span class="tag tag-ia">${ico('ia')}Le prof · IA</span>${boutonVoix()}</div><p>${esc(cm.c)}</p>${cm.k ? `<div class="conseil-box">${ico('bulb')}<p><b>Conseil</b> ${esc(cm.k)}</p></div>` : ''}</div>`;
    else if (IA.dispo) h += `<p class="faint" style="font-size:12.5px">${ico('ia')} Lance le prof (onglet Commentaires de l'analyse) pour avoir son explication et son conseil sur ce moment.</p>`;
  }
  fb.innerHTML = h;
  LC.board.set(st);
}

async function essaiLecon(uci) {
  const g = g_(), D = D_(), x = LC.moments[LC.k], fen = D.P.fens[x.i], ev0 = g.evals[x.i], key = g.id + ':' + x.i;
  const premier = LC.res[LC.k] === undefined;
  if (uci === ev0.pv[0]) { if (premier) LC.res[LC.k] = true; marquerExo(key, premier); LC.etat = 'trouve'; LC.extra = null; majLecon(); return; }
  const gg = new Chess(fen), m = jouer(gg, uci), nf = gg.fen();
  LC.etat = 'calcul'; LC.extra = { fen: nf, uci }; majLecon();
  let ev;
  try { ev = await Moteur.analyser(nf, { depth: 13, ms: 1500, prio: true }); } catch { LC.etat = 'jeu'; majLecon(); return; }
  if (LC.moments[LC.k] !== x || !$('#lcFb')) return;
  if (deltaCoup(D.me, ev0, ev) < 0.05) { if (premier) LC.res[LC.k] = true; marquerExo(key, premier); LC.etat = 'trouve'; LC.extra = { equiv: true }; majLecon(); return; }
  if (premier) LC.res[LC.k] = false;
  marquerExo(key, false);
  LC.etat = 'rate'; LC.extra = { fen: nf, uci, san: m.san, ev }; majLecon();
}

// ---------- Mon prof : plan de progression, progrès et carnet de conseils sur toutes tes parties ----------
const K_PLAN = 'coupjuste-plan-v1';
const COACH = { theme: 'tous', plan: lire(K_PLAN, null), enCours: false, tout: false };

function carnetConseils() {
  const out = [];
  for (const g of LIB) {
    if (!g.prof || !g.prof.comments) continue;
    const D = deriver(g); if (!D) continue;
    for (const [ply, c] of Object.entries(g.prof.comments)) {
      const i = +ply - 1, mv = D.P.moves[i];
      if (!mv || !c.k) continue;
      out.push({ g, D, ply: +ply, i, conseil: c.k, theme: (c.t || 'autre').toLowerCase(), tag: D.tags[i], mine: mv.color === D.me, san: `${numero(D.P.fens[i])} ${lisible(D.P.fens[i], mv.uci).san}` });
    }
  }
  return out.sort((a, b) => (b.D.date - a.D.date) || (a.ply - b.ply));
}

function tendances(list) {
  const tri = [...list].sort((a, b) => a.D.date - b.D.date || a.g.addedAt - b.g.addedAt);
  if (tri.length < 4) return null;
  const mid = Math.floor(tri.length / 2), A1 = tri.slice(0, mid), A2 = tri.slice(mid);
  const parPartie = (l, f) => l.reduce((s, x) => s + f(x), 0) / l.length;
  const lignes = [{ nom: 'Précision moyenne', a: moyenne(A1.map(x => x.D.prec[x.D.me]).filter(v => v !== null)), b: moyenne(A2.map(x => x.D.prec[x.D.me]).filter(v => v !== null)), pct: true, haut: true }];
  lignes.push({ nom: 'Gaffes par partie', a: parPartie(A1, x => x.D.counts[x.D.me].gaffe), b: parPartie(A2, x => x.D.counts[x.D.me].gaffe), haut: false });
  for (const k of Object.keys(MOTIFS)) {
    const f = x => k === 'manquee' ? x.D.manquees.length : x.D.erreurs.filter(e => e.motifs.includes(k)).length;
    lignes.push({ nom: MOTIFS[k].titre, a: parPartie(A1, f), b: parPartie(A2, f), haut: false });
  }
  return { n1: A1.length, n2: A2.length, lignes };
}

function resumePourPlan(list, carnet) {
  const { mot, phMoy } = agregats(list);
  const themes = {};
  carnet.filter(c => c.mine && MAUVAIS.includes(c.tag)).forEach(c => themes[c.theme] = (themes[c.theme] || 0) + 1);
  const res = { victoire: 0, defaite: 0, nulle: 0 };
  list.forEach(x => { if (res[x.D.resultat] !== undefined) res[x.D.resultat]++; });
  const ouv = {};
  list.forEach(x => { const k = `${x.D.ouverture.nom} (${x.D.me === 'w' ? 'Blancs' : 'Noirs'})`; ouv[k] = ouv[k] || { n: 0, v: 0 }; ouv[k].n++; if (x.D.resultat === 'victoire') ouv[k].v++; });
  const elos = [...list].sort((a, b) => a.D.date - b.D.date).map(x => x.D.elo(x.D.me)).filter(Boolean);
  return {
    parties: list.length, resultats: res, elo: elos.length ? { premier: elos[0], dernier: elos[elos.length - 1] } : null,
    precision_moyenne: Math.round(moyenne(list.map(x => x.D.prec[x.D.me]).filter(v => v !== null)) || 0),
    precision_par_phase: Object.fromEntries(Object.entries(phMoy).map(([k, v]) => [k, v === null ? null : Math.round(v)])),
    erreurs_par_motif: Object.fromEntries(Object.entries(mot).map(([k, v]) => [MOTIFS[k].titre, v])),
    themes_des_erreurs_selon_le_prof: themes,
    ouvertures: ouv,
    derniers_conseils_du_prof: carnet.filter(c => c.mine).slice(0, 25).map(c => `[${c.theme}] ${c.conseil}`),
  };
}

async function genererPlan(list, carnet) {
  if (!IA.fn || COACH.enCours) return;
  COACH.enCours = true; pageProf($('#view'));
  const data = resumePourPlan(list, carnet);
  const prompt = `Tu es le professeur d'échecs personnel de ton élève. Voici le bilan de ses ${data.parties} dernières parties analysées par Stockfish, avec les conseils que tu lui as déjà donnés coup par coup. Construis son plan de travail pour les 7 prochains jours, en français, en le tutoyant, avec des mots simples.

Règles :
- Appuie-toi uniquement sur ces données ; n'invente ni partie, ni coup, ni chiffre.
- 3 priorités maximum, classées par impact sur ses résultats. Chacune avec un exercice concret et faisable en 10 à 20 minutes par jour.
- Pour chaque priorité, choisis "filtre" parmi : "en_prise", "tactique", "double", "manquee", "tous" (la catégorie d'exercices de l'appli la plus utile).
- Une seule règle d'or, courte, à appliquer avant chaque coup.
- Un objectif mesurable pour sa prochaine série de parties (par exemple moins de gaffes par partie, ou une précision visée).

Données :
${JSON.stringify(data, null, 1)}

Réponds uniquement avec ce JSON :
{"diagnostic": "2 ou 3 phrases", "priorites": [{"titre": "…", "pourquoi": "…", "exercice": "…", "filtre": "tactique"}], "regle_d_or": "…", "objectif": "…"}`;
  try {
    const p = await IA.fn.json(prompt, {});
    if (!p || !Array.isArray(p.priorites)) throw { code: 'invalid_json' };
    COACH.plan = { date: Date.now(), parties: list.length, plan: p };
    ecrire(K_PLAN, COACH.plan);
    toast('Ton plan de la semaine est prêt.');
  } catch (e) {
    if (e && e.code !== 'cancelled') toast(e && e.code === 'invalid_json' ? "Le prof n'a pas rendu un plan lisible. Réessaie." : iaErreur(e), 'err');
    iaCouper(e);
  } finally {
    COACH.enCours = false;
    if (ROUTE === 'prof') pageProf($('#view'));
  }
}

const K_OBJ = 'coupjuste-objectifs-v1';
const OBJ = Object.assign({ cadence: '', cible: null, parties: 5, jours: 4 }, lire(K_OBJ, {}));
const sauverObj = () => ecrire(K_OBJ, OBJ);

function meilleureSerie() {
  const jours = [...new Set(lire(K_SERIE, []))].map(k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; }).sort((a, b) => a - b);
  let best = 0, cur = 0;
  jours.forEach((j, i) => { cur = i && j - jours[i - 1] === 1 ? cur + 1 : 1; best = Math.max(best, cur); });
  return best;
}

function eloParCadence(list) {
  const par = {};
  [...list].sort((a, b) => a.D.date - b.D.date).forEach(({ D }) => {
    const t = D.cadence.type, e = D.elo(D.me);
    if (!t || e === null) return;
    (par[t] = par[t] || []).push({ date: D.date, elo: e });
  });
  return par;
}

function sparkline(pts) {
  if (pts.length < 2) return '';
  const W = 120, H = 32, v = pts.map(p => p.elo), lo = Math.min(...v), hi = Math.max(...v), r = hi - lo || 1;
  const d = v.map((e, i) => `${i ? 'L' : 'M'}${(i / (v.length - 1) * W).toFixed(1)} ${(H - 3 - (e - lo) / r * (H - 6)).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

// ---------- Rapport de partie en PDF (jsPDF chargé à la demande depuis cdnjs) ----------
const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
let JSPDF = null;
function chargerJsPDF() {
  if (JSPDF) return JSPDF;
  JSPDF = new Promise((ok, ko) => {
    if (window.jspdf) return ok(window.jspdf);
    const s = Object.assign(document.createElement('script'), { src: JSPDF_URL, async: true });
    s.onload = () => window.jspdf ? ok(window.jspdf) : ko(new Error('jsPDF'));
    s.onerror = () => { JSPDF = null; ko(new Error('jsPDF')); };
    document.head.append(s);
  });
  return JSPDF;
}

// Téléchargement d'un fichier généré (claude.ai : capacité downloads ; site : lien direct)
async function telecharger(nom, blob) {
  if (window.claude && claude.use) {
    const dl = await claude.use('downloads').catch(() => null);
    if (dl) { try { await dl.save({ filename: nom, data: blob }); return true; } catch (e) { if (e && (e.code === 'declined' || e.code === 'cancelled')) return false; } }
  }
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement('a'), { href: url, download: nom });
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}

function plateauSVG(fen, orient, fleches = [], marque = null) {
  const sprite = (document.querySelector('svg defs') || {}).innerHTML || '';
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="480" viewBox="0 0 480 480"><defs>${sprite}</defs>${plateauCorps(fen, orient, fleches, marque)}</svg>`;
}
// Contenu d'un échiquier de 480 × 480 (sans defs), réutilisé par le PDF et les images du bilan
function plateauCorps(fen, orient, fleches = [], marque = null) {
  const c = 60, B = 480;
  const cs = getComputedStyle(document.documentElement), L = cs.getPropertyValue('--sq-l').trim() || '#ECE5D2', Dk = cs.getPropertyValue('--sq-d').trim() || '#4F7363';
  const xy = sq => { const f = sq.charCodeAt(0) - 97, r = +sq[1] - 1; return orient === 'w' ? [f * c, (7 - r) * c] : [(7 - f) * c, r * c]; };
  let s = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) { const [x, y] = xy(String.fromCharCode(97 + f) + (r + 1)); s += `<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="${(f + r) % 2 === 0 ? Dk : L}"/>`; }
  if (marque) for (const sq of [marque.slice(0, 2), marque.slice(2, 4)]) { const [x, y] = xy(sq); s += `<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="rgba(214,178,98,.55)"/>`; }
  fen.split(' ')[0].split('/').forEach((row, ri) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { f += +ch; continue; }
      const [x, y] = xy(String.fromCharCode(97 + f) + (8 - ri));
      s += `<use href="#${ch === ch.toUpperCase() ? 'w' : 'b'}${ch.toLowerCase()}" transform="translate(${x},${y}) scale(${c / 40})"/>`; f++;
    }
  });
  for (const [uci, fill] of fleches) {
    if (!uci) continue;
    let [x1, y1] = xy(uci.slice(0, 2)), [x2, y2] = xy(uci.slice(2, 4)); x1 += c / 2; y1 += c / 2; x2 += c / 2; y2 += c / 2;
    const dx = x2 - x1, dy = y2 - y1, Ln = Math.hypot(dx, dy); if (!Ln) continue;
    const ux = dx / Ln, uy = dy / Ln, nx = -uy, ny = ux, w = 6, hw = 16, hl = 22, tx = x2 - ux * 6, ty = y2 - uy * 6, bx = tx - ux * hl, by = ty - uy * hl, sx = x1 + ux * 12, sy = y1 + uy * 12;
    s += `<polygon fill="${fill}" points="${[[sx + nx * w, sy + ny * w], [bx + nx * w, by + ny * w], [bx + nx * hw, by + ny * hw], [tx, ty], [bx - nx * hw, by - ny * hw], [bx - nx * w, by - ny * w], [sx - nx * w, sy - ny * w]].map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
  }
  return s;
}

      const bloc = (t, opt = {}) => { doc.setFont('helvetica', opt.bold ? 'bold' : 'normal'); doc.setFontSize(opt.size || 9); doc.setTextColor(...(opt.color || NOIR)); for (const l of doc.splitTextToSize(pdfTxt(t), tw)) { if (yy > top + bs + 4) break; doc.text(l, tx, yy); yy += (opt.size || 9) * 0.42; } yy += 1.5; };
      if (best) { const b = lisible(fen, best); bloc(`Meilleur coup : ${b.san} (${b.sens})`, { bold: true, color: [30, 120, 210] }); }
      bloc(explicationMoteur(e.i), { color: GRIS });
      const cm = pr && pr.comments[e.i + 1];
      if (cm) { bloc(`Le prof : ${cm.c}`); if (cm.k) bloc(`Conseil : ${cm.k}`, { bold: true, color: [46, 139, 95] }); }
      y = top + bs + 8;
    }
  }

  // Conseils du prof
  const conseils = pr ? Object.entries(pr.comments || {}).filter(([, c]) => c.k).sort((a, b) => a[0] - b[0]) : [];
  if (conseils.length) {
    titre('Les conseils du prof (IA)');
    conseils.slice(0, 20).forEach(([ply, c]) => { const i = +ply - 1; para(`${libCoup(D.P.fens[i], D.P.moves[i].uci)} : ${c.k}`, { size: 9.5, gap: 1.5 }); });
  }

  // Partie complète
  titre('La partie');
  const coups = D.P.moves.map((m, i) => `${m.color === 'w' ? Math.floor(i / 2) + 1 + '. ' : ''}${lisible(D.P.fens[i], m.uci).san}${{ gaffe: '??', erreur: '?', imprecision: '?!' }[D.tags[i]] || ''}`).join(' ');
  para(coups, { size: 9.5, gap: 2 });
  para('Légende : ?? gaffe, ? erreur, ?! imprécision. Évaluations calculées par Stockfish 10 ; commentaires marqués IA rédigés par Claude (Anthropic).', { size: 8, color: GRIS });
  pied();

  const nom = `blundercheck-${pdfTxt(D.nom('w')).replace(/\W+/g, '')}-${pdfTxt(D.nom('b')).replace(/\W+/g, '')}.pdf`.toLowerCase();
  const ok = await telecharger(nom, doc.output('blob'));
  if (ok) toast('Rapport PDF prêt.');
}

// ---------- Bilan de la période, en images verticales 9:16 (TikTok, Reels, stories) ----------
const BL = { periode: '7', idx: 0, imgs: [] };
const PERIODES = [['7', '7 derniers jours'], ['30', '30 derniers jours'], ['tout', 'Depuis le début']];

function donneesBilan() {
  const lim = BL.periode === 'tout' ? 0 : Date.now() - (+BL.periode) * 864e5;
  const list = partiesCompletes().filter(({ g, D }) => (D.date || g.addedAt) >= lim);
  if (!list.length) return null;
  const precs = list.map(x => x.D.prec[x.D.me]).filter(v => v !== null);
  const res = { victoire: 0, nulle: 0, defaite: 0 };
  list.forEach(x => { if (res[x.D.resultat] !== undefined) res[x.D.resultat]++; });
  let pire = null, top = null, bestGame = null;
  for (const x of list) {
    const errs = x.D.erreurs.filter(e => e.tag !== 'imprecision');
    const pool = errs.some(e => e.visible) ? errs.filter(e => e.visible) : errs;
    for (const e of pool) if (!pire || e.delta > pire.e.delta) pire = { ...x, e };
    // meilleur coup : la punition la plus forte d'une erreur adverse, sinon un coup « meilleur » décisif
    x.D.P.moves.forEach((m, i) => {
      if (m.color !== x.D.me || !i) return;
      const t = x.D.tags[i], prev = x.D.tags[i - 1];
      if (['meilleur', 'excellent'].includes(t) && MAUVAIS.includes(prev) && prev !== 'imprecision') {
        const gain = x.D.deltas[i - 1];
        if (!top || gain > top.gain) top = { ...x, i, gain };
      }
    });
    const p = x.D.prec[x.D.me];
    if (p !== null && (!bestGame || p > bestGame.p)) bestGame = { ...x, p };
  }
  const mot = agregats(list).mot, topMot = Object.entries(mot).sort((a, b) => b[1] - a[1])[0];
  const ouv = {}; list.forEach(x => { ouv[x.D.ouverture.nom] = (ouv[x.D.ouverture.nom] || 0) + 1; });
  const ouvTop = Object.entries(ouv).sort((a, b) => b[1] - a[1])[0];
  const erreursVis = list.reduce((n, x) => n + x.D.erreurs.filter(e => e.visible && e.tag !== 'imprecision').length, 0);
  return { list, n: list.length, prec: precs.length ? moyenne(precs) : null, res, pire, top, bestGame, topMot: topMot && topMot[1] ? topMot : null, ouvTop, erreursVis, serie: serieJours().n };
}

// ---------- Mode Rush : tes erreurs en puzzles chronométrés (3 minutes, 3 vies) ----------
const K_RUSH = 'coupjuste-rush-v1';
const RS = { etat: 'accueil', score: 0, vies: 3, fin: 0, pool: [], k: 0, board: null, tick: null, bloque: false, record: lire(K_RUSH, { best: 0, parties: 0 }) };
const RUSH_MS = 180000;

function melanger(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function pageRush(view) {
  clearInterval(RS.tick);
  const all = exercices();
  if (RS.etat === 'jeu') RS.etat = 'accueil';
  if (all.length < 3) {
    view.innerHTML = `${enteteRush()}<div class="card"><div class="empty">${ico('entrainement')}<h3>Pas encore assez de puzzles</h3><p>Le Rush utilise tes propres erreurs. Analyse quelques parties de plus (il faut au moins 3 positions ratées) pour le débloquer.</p><button class="btn primary" data-route="import">${ico('analyser')}Importer mes parties</button></div></div>`;
    return;
  }
  if (RS.etat === 'fin') return finRush(view);
  view.innerHTML = `${enteteRush()}
  <section class="card rush-intro">
    <div class="rush-big">${ico('flame')}</div>
    <h2>3 minutes. 3 vies. Tes propres erreurs.</h2>
    <p class="muted">Chaque position vient d'une de tes parties. Trouve le meilleur coup le plus vite possible. Un bon coup rapporte un point, une erreur coûte une vie.</p>
    <div class="rush-stats"><div><span class="v">${RS.record.best}</span><span>ton record</span></div><div><span class="v">${all.length}</span><span>positions disponibles</span></div><div><span class="v">${RS.record.parties}</span><span>rush joués</span></div></div>
    <button class="btn primary lg" id="rsGo">${ico('flame')}Lancer le Rush</button>
  </section>`;
  $('#rsGo').onclick = () => demarrerRush(view);
}
const enteteRush = () => `<div class="page-head"><div><h1>Rush</h1><p>Le mode le plus rapide pour ne plus refaire les mêmes gaffes.</p></div><button class="btn" data-route="entrainement">${ico('entrainement')}Entraînement classique</button></div>`;

function demarrerRush(view) {
  const all = exercices(), vis = melanger(all.filter(x => x.visible)), dur = melanger(all.filter(x => !x.visible));
  Object.assign(RS, { etat: 'jeu', score: 0, vies: 3, fin: Date.now() + RUSH_MS, pool: [...vis, ...dur], k: 0, bloque: false, rates: [] });
  view.innerHTML = `${enteteRush()}<div class="rush-grid">
    <div class="train-board"><svg class="board-svg" id="rsBoard" role="img" aria-label="Échiquier du Rush"></svg></div>
    <section class="card rush-side">
      <div class="rush-timer mono" id="rsTime">3:00</div>
      <div class="rush-bar"><i id="rsBar"></i></div>
      <div class="rush-row"><div><span class="eyebrow">Score</span><span class="rush-score mono" id="rsScore">0</span></div><div><span class="eyebrow">Vies</span><span class="rush-vies" id="rsVies"></span></div></div>
      <p id="rsTrait" class="muted"></p>
      <div id="rsFb" class="rush-fb"></div>
      <button class="btn ghost sm" id="rsStop" style="justify-self:start">${ico('stop')}Abandonner</button>
    </section></div>`;
  RS.board = creerEchiquier($('#rsBoard'), { onMove: essaiRush });
  $('#rsStop').onclick = () => terminerRush(view);
  RS.tick = setInterval(() => {
    if (ROUTE !== 'rush') { clearInterval(RS.tick); RS.etat = 'accueil'; return; }
    const r = Math.max(0, RS.fin - Date.now());
    const t = $('#rsTime'); if (t) { t.textContent = `${Math.floor(r / 60000)}:${String(Math.floor(r / 1000) % 60).padStart(2, '0')}`; t.classList.toggle('urgent', r < 20000); }
    const b = $('#rsBar'); if (b) b.style.width = (r / RUSH_MS * 100) + '%';
    if (!r) terminerRush(view);
  }, 200);
  puzzleRush();
}
function puzzleRush() {
  const x = RS.pool[RS.k % RS.pool.length], fen = x.D.P.fens[x.i];
  RS.cur = x; RS.bloque = false;
  $('#rsVies').innerHTML = [0, 1, 2].map(k => `<i class="${k < RS.vies ? 'on' : ''}"></i>`).join('');
  $('#rsScore').textContent = RS.score;
  $('#rsTrait').innerHTML = `<b>${fen.split(' ')[1] === 'w' ? 'Les Blancs' : 'Les Noirs'} jouent.</b> ${x.motifs.includes('manquee') ? 'Punis l’erreur adverse.' : 'Trouve mieux que dans ta partie.'}`;
  RS.board.set({ fen, orient: fen.split(' ')[1], last: x.i ? [x.D.P.moves[x.i - 1].from, x.D.P.moves[x.i - 1].to] : null, arrows: [], hint: null, interactive: true });
}
function essaiRush(uci) {
  if (RS.bloque || RS.etat !== 'jeu') return;
  const x = RS.cur, best = x.g.evals[x.i].pv[0], fen = x.D.P.fens[x.i];
  RS.bloque = true;
  const g = new Chess(fen); jouer(g, uci);
  const ok = uci === best || (best && uci.slice(0, 4) === best.slice(0, 4)) || g.in_checkmate();
  const b = lisible(fen, best);
  if (ok) { RS.score++; $('#rsFb').innerHTML = `<div class="feedback ok"><b>${ico('check')}${esc(b.san)} !</b></div>`; RS.board.set({ fen: g.fen(), last: [uci.slice(0, 2), uci.slice(2, 4)], interactive: false }); }
  else {
    RS.vies--; RS.rates.push(x);
    $('#rsFb').innerHTML = `<div class="feedback ko"><b>Raté</b><p>Il fallait <span class="mv">${esc(b.san)}</span> <span class="muted">(${esc(b.sens)})</span></p></div>`;
    RS.board.set({ fen, arrows: [{ uci: best, cls: 'best' }], interactive: false });
  }
  $('#rsVies').innerHTML = [0, 1, 2].map(k => `<i class="${k < RS.vies ? 'on' : ''}"></i>`).join('');
  $('#rsScore').textContent = RS.score;
  setTimeout(() => {
    if (RS.etat !== 'jeu') return;
    if (RS.vies <= 0) return terminerRush($('#view'));
    RS.k++; puzzleRush();
  }, ok ? 450 : 1500);
}
function terminerRush(view) {
  if (RS.etat !== 'jeu') return;
  clearInterval(RS.tick);
  RS.etat = 'fin';
  RS.nouveau = RS.score > RS.record.best;
  RS.record = { best: Math.max(RS.record.best, RS.score), parties: RS.record.parties + 1 };
  ecrire(K_RUSH, RS.record);
  if (RS.score > 0) noterJour();
  finRush(view);
}
function finRush(view) {
  const rates = [...new Map((RS.rates || []).map(x => [x.key, x])).values()];
  view.innerHTML = `${enteteRush()}
  <section class="card rush-intro">
    <span class="eyebrow">${RS.nouveau ? '🎉 Nouveau record !' : 'Rush terminé'}</span>
    <div class="rush-final mono">${RS.score}</div>
    <p class="muted">${RS.score === 1 ? 'position trouvée' : 'positions trouvées'} · record : ${RS.record.best}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
      <button class="btn primary lg" id="rsAgain">${ico('flame')}Rejouer</button>

const DEFI = { data: null, etat: 'jeu', board: null, essais: 0 };
const SITE_URL = 'https://blundercheck.app/';
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));

function lienDefi(g, D, i) {
  const ev = g.evals[i], mv = D.P.moves[i];
  if (!ev || !ev.pv[0]) return null;
  const d = { f: D.P.fens[i], s: ev.pv[0], j: mv.uci !== ev.pv[0] ? mv.uci : '', n: (REGLAGES.pseudos || '').split(',')[0].trim().slice(0, 30), t: D.tags[i] || '' };
  return SITE_URL + '#defi=' + b64e(JSON.stringify(d));
}
function lireDefi(hash) {
  try {
    const d = JSON.parse(b64d(hash.replace(/^#?defi=/, '')));
    if (!d.f || !/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(d.s) || !new Chess().validate_fen(d.f).valid) return null;
    return d;
  } catch { return null; }
}

function defierAmi(i, g = g_(), D = D_()) {

// ---------- Entraînement d'ouvertures : tes propres lignes, corrigées là où tu t'es trompé ----------
const K_REP = 'coupjuste-repertoire-v1';
const RP = { cle: null, p: 0, fautes: 0, board: null, etat: 'jeu', suivi: lire(K_REP, {}), filtre: 'tous' };
const REP_MAX = 16;

function lignesOuverture() {
  const vues = new Map();
  for (const { g, D } of partiesCompletes()) {
    const seq = [];
    let fixe = false;
    for (let i = 0; i < Math.min(D.P.moves.length, REP_MAX); i++) {
      const mv = D.P.moves[i];
      if (mv.color !== D.me) { seq.push({ i, uci: mv.uci, moi: false }); continue; }
      const ev = g.evals[i];
      if (MAUVAIS.includes(D.tags[i]) && ev && ev.pv[0]) { seq.push({ i, uci: ev.pv[0], moi: true, fix: mv.uci, tag: D.tags[i] }); fixe = true; break; }
      seq.push({ i, uci: mv.uci, moi: true });
    }
    if (seq.filter(s => s.moi).length < 2) continue;
    const cle = D.me + ':' + seq.map(s => s.uci).join(' ');
    if (vues.has(cle)) { vues.get(cle).n++; continue; }
    vues.set(cle, { cle, g, D, seq, fixe, n: 1, nom: D.ouverture.nom, eco: D.ouverture.eco, color: D.me });
  }
  return [...vues.values()];
}
function statutLigne(l) {
  const s = RP.suivi[l.cle] || { ok: 0 };
  if (s.ok >= 3) return { k: 'ok', txt: 'Maîtrisée' };
  if (l.fixe && !s.ok) return { k: 'fix', txt: 'À corriger' };
  return { k: 'rev', txt: s.ok ? `Réussie ${s.ok} fois` : 'À apprendre' };
}

function pageRepertoire(view) {

  const ordre = { fix: 0, rev: 1, ok: 2 };
  lignes.sort((a, b) => ordre[statutLigne(a).k] - ordre[statutLigne(b).k] || b.n - a.n);
  const vis = lignes.filter(l => RP.filtre === 'tous' || l.color === RP.filtre);

      <div class="list">${vis.map(x => { const s = statutLigne(x); return `<button class="row rep-row ${x.cle === RP.cle ? 'on' : ''}" data-l="${esc(x.cle)}"><span class="pc-dot ${x.color}"></span><span class="ellip"><b>${esc(x.nom)}</b><br><small class="faint">${pluriel(x.seq.filter(z => z.moi).length, 'coup')} à jouer${x.n > 1 ? ` · ${x.n} parties` : ''}</small></span><span class="rep-st st-${s.k}">${s.txt}</span></button>`; }).join('')}</div>
    </section>
    <div class="train-board"><svg class="board-svg" id="rpBoard" role="img" aria-label="Échiquier d'entraînement d'ouverture"></svg></div>

      <button class="btn ghost sm" id="rpOpen" style="justify-self:start">${ico('board')}Voir la partie d'origine</button>
    </section></div>`;
  $$('#rpSeg button').forEach(b => b.onclick = () => { RP.filtre = b.dataset.c; RP.cle = null; pageRepertoire(view); });
  $$('[data-l]', view).forEach(b => b.onclick = () => { RP.cle = b.dataset.l; pageRepertoire(view); });
  $('#rpRe').onclick = () => lancerLigne(l);
  $('#rpNext').onclick = () => { const k = vis.indexOf(l); RP.cle = vis[(k + 1) % vis.length].cle; pageRepertoire(view); };
  $('#rpOpen').onclick = () => ouvrirAnalyse(l.g.id, 0);
  $('#rpHint').onclick = () => { const s = l.seq[RP.p]; if (s && s.moi && RP.etat === 'jeu') { RP.fautes++; RP.board.set({ hint: s.uci.slice(0, 2) }); } };
  RP.board = creerEchiquier($('#rpBoard'), { onMove: uci => essaiLigne(l, uci) });
  lancerLigne(l);
}
function fenLigne(l, p) { return l.D.P.fens[l.seq[0].i + p] || l.D.P.fens[0]; }
function lancerLigne(l) {
  RP.p = 0; RP.fautes = 0; RP.etat = 'jeu';
  RP.board.set({ fen: l.D.P.fens[0], orient: l.color, last: null, arrows: [], hint: null, interactive: false });
  $('#rpFb').innerHTML = `<p class="muted">Joue les coups de ta ligne. Les coups de l'adversaire se jouent tout seuls.</p>`;
  avancerLigne(l);
}
function avancerLigne(l) {
  const bar = $('#rpBar'); if (bar) bar.style.width = (RP.p / l.seq.length * 100) + '%';
  if (RP.p >= l.seq.length) return finLigne(l);
  const s = l.seq[RP.p], fen = fenLigne(l, RP.p);
  if (!s.moi) {
    RP.board.set({ fen, interactive: false, arrows: [], hint: null });
    setTimeout(() => { if (ROUTE !== 'repertoire' || RP.cle !== l.cle) return; const g = new Chess(fen); jouer(g, s.uci); RP.p++; RP.board.set({ fen: g.fen(), last: [s.uci.slice(0, 2), s.uci.slice(2, 4)] }); avancerLigne(l); }, 380);
    return;
  }
  RP.etat = 'jeu';
  RP.board.set({ fen, interactive: true, arrows: [], hint: null });
}
function essaiLigne(l, uci) {
  if (RP.etat !== 'jeu') return;
  const s = l.seq[RP.p], fen = fenLigne(l, RP.p);
  if (uci.slice(0, 4) === s.uci.slice(0, 4)) {
    const g = new Chess(fen); jouer(g, s.uci);
    RP.board.set({ fen: g.fen(), last: [s.uci.slice(0, 2), s.uci.slice(2, 4)], interactive: false, hint: null });
    if (s.fix) $('#rpFb').innerHTML = `<div class="feedback ok"><b>${ico('check')}C'est ça !</b><p>Dans ta partie, tu avais joué <span class="mv">${esc(lisible(fen, s.fix).san)}</span> (${CLASSES[s.tag].nom.toLowerCase()}). Retiens plutôt <span class="mv">${esc(lisible(fen, s.uci).san)}</span>.</p></div>`;
    else $('#rpFb').innerHTML = `<div class="feedback ok"><b>${ico('check')}${esc(lisible(fen, s.uci).san)}</b></div>`;
    RP.p++; setTimeout(() => avancerLigne(l), 250);
    return;
  }
  RP.fautes++; RP.etat = 'rate';
  const b = lisible(fen, s.uci);
  RP.board.set({ fen, arrows: [{ uci: s.uci, cls: 'best' }], interactive: false });
  $('#rpFb').innerHTML = `<div class="feedback ko"><b>Ce n'est pas ta ligne.</b><p>Ici, il faut jouer <span class="mv">${esc(b.san)}</span>${s.fix ? ` : c'est la correction de ton erreur de la partie` : ''}. Rejoue-le.</p></div>`;
  setTimeout(() => { if (RP.etat === 'rate' && RP.cle === l.cle) { RP.etat = 'jeu'; RP.board.set({ fen, arrows: [{ uci: s.uci, cls: 'best' }], interactive: true }); } }, 900);
}
function finLigne(l) {
  RP.etat = 'fin';
  const s = RP.suivi[l.cle] || { ok: 0, essais: 0 };
  s.essais = (s.essais || 0) + 1; s.last = Date.now();
  if (!RP.fautes) s.ok = (s.ok || 0) + 1;
  RP.suivi[l.cle] = s; ecrire(K_REP, RP.suivi);
  if (!RP.fautes) noterJour();
  $('#rpFb').innerHTML = RP.fautes
    ? `<div class="feedback"><b>Ligne terminée avec ${pluriel(RP.fautes, 'faute')}.</b><p>Recommence-la sans faute pour qu'elle compte comme réussie.</p></div>`
    : `<div class="feedback ok"><b>Sans faute ! 🎯</b><p>${s.ok >= 3 ? 'Ligne maîtrisée : réussie 3 fois.' : `Réussie ${s.ok} fois sur 3 pour la maîtriser.`}</p></div>`;
  $$('.rep-row.on .rep-st').forEach(e => { const st = statutLigne(l); e.textContent = st.txt; e.className = 'rep-st st-' + st.k; });
}

// ---------- Version hébergée (blundercheck.app) : le prof passe par /api/prof ----------
// Utilisé seulement quand la page ne tourne pas dans claude.ai (pas de window.claude).
function webSample() {
  const fusion = msgs => msgs.reduce((acc, m) => {
    const last = acc[acc.length - 1];
    if (last && last.role === m.role) last.content += '\n\n' + m.content; else acc.push({ role: m.role, content: String(m.content) });
    return acc;
  }, []);
  async function appel(input, opts = {}) {
    const messages = fusion(typeof input === 'string' ? [{ role: 'user', content: input }] : input);
    let r;
    try {
      r = await fetch('/api/prof', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ messages, max_tokens: opts.maxTokens || 4096 }), signal: opts.signal });
    } catch (e) { throw (e && e.name === 'AbortError') ? { code: 'cancelled' } : { code: 'network', message: 'Connexion impossible au prof.' }; }
    if (!r.ok) {
      let msg = 'Le prof est indisponible pour le moment.';
      try { const j = await r.json(); if (j && j.error) msg = j.error; } catch { }
      throw { code: r.status === 429 ? 'quota' : 'server', message: msg };
    }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '';
    try {
      for (;;) {
        const { value, done } = await rd.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n'); buf = parts.pop();
        for (const l of parts) {
          if (!l.startsWith('data:')) continue;
          let ev; try { ev = JSON.parse(l.slice(5)); } catch { continue; }
          if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') {
            text += ev.delta.text;
            if (opts.onText) opts.onText({ delta: ev.delta.text, text });
          } else if (ev.type === 'error') throw { code: 'server', message: 'Le prof a rencontré une erreur.', text };
        }
      }
    } catch (e) {
      if (e && e.name === 'AbortError') throw { code: 'cancelled', text };
      throw e && e.code ? e : { code: 'network', message: 'La connexion au prof a été coupée.', text };
    }
    return { text };
  }
  appel.json = async (prompt, opts = {}) => {
    const { text } = await appel(prompt, opts);
    const m = text.match(/\{[\s\S]*\}/);
    if (!m) throw { code: 'invalid_json' };
    try { return JSON.parse(m[0]); } catch { throw { code: 'invalid_json' }; }
  };
  return appel;
}

const COUL_CLS = { meilleur: '#5DBB8A', excellent: '#7CC59C', bon: '#A7B0A8', imprecision: '#EFD06A', erreur: '#E8894A', gaffe: '#E5534B' };

function carteSVG(D, g, i) {
  const W = 1080, H = 1350, B = 880, X0 = 100, Y0 = 300, c = B / 8;
  const fen = D.P.fens[i], mv = D.P.moves[i], ev0 = g.evals[i], ev1 = g.evals[i + 1];
  const tag = D.tags[i], col = COUL_CLS[tag] || '#A7B0A8';
  const orient = D.me;
  const xy = sq => { const f = sq.charCodeAt(0) - 97, r = +sq[1] - 1; return orient === 'w' ? [X0 + f * c, Y0 + (7 - r) * c] : [X0 + (7 - f) * c, Y0 + r * c]; };
  const cs = getComputedStyle(document.documentElement), SQ = { l: cs.getPropertyValue('--sq-l').trim() || '#ECE5D2', d: cs.getPropertyValue('--sq-d').trim() || '#4F7363' };
  let s = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const [x, y] = xy(String.fromCharCode(97 + f) + (r + 1));
    s += `<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="${(f + r) % 2 === 0 ? SQ.d : SQ.l}"/>`;
  }
  const hl = (sq, fill) => { const [x, y] = xy(sq); s += `<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="${fill}"/>`; };
  hl(mv.uci.slice(0, 2), 'rgba(214,178,98,.55)'); hl(mv.uci.slice(2, 4), 'rgba(214,178,98,.55)');
  fen.split(' ')[0].split('/').forEach((row, ri) => {
    let f = 0;
    for (const ch of row) {
      if (/\d/.test(ch)) { f += +ch; continue; }
      const cl = ch === ch.toUpperCase() ? 'w' : 'b', [x, y] = xy(String.fromCharCode(97 + f) + (8 - ri));
      s += `<use href="#${cl}${ch.toLowerCase()}" transform="translate(${x},${y}) scale(${c / 40})"/>`;
      f++;
    }
  });
  const fleche = (uci, fill) => {
    let [x1, y1] = xy(uci.slice(0, 2)), [x2, y2] = xy(uci.slice(2, 4));
    x1 += c / 2; y1 += c / 2; x2 += c / 2; y2 += c / 2;
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); if (!L) return '';
    const ux = dx / L, uy = dy / L, nx = -uy, ny = ux, w = 10, hw = 26, hl = 36;
    const tx = x2 - ux * 10, ty = y2 - uy * 10, bx = tx - ux * hl, by = ty - uy * hl, sx = x1 + ux * 18, sy = y1 + uy * 18;
    const p = [[sx + nx * w, sy + ny * w], [bx + nx * w, by + ny * w], [bx + nx * hw, by + ny * hw], [tx, ty], [bx - nx * hw, by - ny * hw], [bx - nx * w, by - ny * w], [sx - nx * w, sy - ny * w]];
    return `<polygon points="${p.map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="${fill}"/>`;
  };
  s += fleche(mv.uci, 'rgba(242,85,90,.9)');
  const best = ev0 && ev0.pv[0] && ev0.pv[0] !== mv.uci ? ev0.pv[0] : null;
  if (best) s += fleche(best, 'rgba(46,146,232,.92)');
  const joue = libCoup(fen, mv.uci), b = best ? lisible(fen, best) : null;
  const qui = mv.color === D.me ? 'Mon coup' : 'Coup adverse';
  const sous = `${qui} contre ${D.nom(mv.color === D.me ? D.opp : D.me)}${D.date ? ' · ' + fmtDate(D.date) : ''}`;
  const sprite = (document.querySelector('svg defs') || {}).innerHTML || '';
  const F = "font-family=\"Helvetica, Arial, sans-serif\"";
  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <defs>${sprite}</defs>
  <rect width="${W}" height="${H}" fill="#111614"/>
  <rect x="${X0}" y="70" width="34" height="34" rx="8" fill="none" stroke="#36413A" stroke-width="3"/><rect x="${X0 + 8}" y="78" width="9" height="9" rx="2" fill="#C9A45C"/><rect x="${X0 + 17}" y="87" width="9" height="9" rx="2" fill="#fff"/>
  <text x="${X0 + 50}" y="99" ${F} font-size="34" font-weight="700" fill="#EDE7D8">Blunder<tspan fill="#C9A45C">Check</tspan></text>
  <text x="${W - X0}" y="99" ${F} font-size="26" fill="#A7B0A8" text-anchor="end">blundercheck.app</text>
  <text x="${X0}" y="200" ${F} font-size="64" font-weight="800" fill="#EDE7D8">${esc(joue)}</text>
  <rect x="${W - X0 - 230}" y="148" width="230" height="64" rx="32" fill="${col}" fill-opacity=".18" stroke="${col}" stroke-width="3"/>
  <text x="${W - X0 - 115}" y="191" ${F} font-size="32" font-weight="700" fill="${col}" text-anchor="middle">${esc(CLASSES[tag] ? CLASSES[tag].court + ' ' + CLASSES[tag].g : '')}</text>
  <text x="${X0}" y="260" ${F} font-size="28" fill="#A7B0A8">${esc(sous)}</text>
  ${s}
  <text x="${X0}" y="${Y0 + B + 70}" ${F} font-size="34" font-weight="600" fill="#5DBB8A">${b ? esc(`Il fallait ${b.san} (${b.sens})`) : 'Le meilleur coup de la position'}</text>
  <text x="${X0}" y="${Y0 + B + 118}" ${F} font-size="28" fill="#A7B0A8">${ev0 && ev1 ? esc(`Évaluation Stockfish : ${texteEval(ev0)} → ${texteEval(ev1)}`) : ''}</text>
</svg>`;
}

async function svgEnPng(svg, W = 1080, H = 1350) {
  const img = new Image();
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  await img.decode();
  const cv = Object.assign(document.createElement('canvas'), { width: W, height: H });
  cv.getContext('2d').drawImage(img, 0, 0, W, H);
  return cv.toDataURL('image/png');
}

const PS = { site: 'chesscom', pseudo: '', n: 10, list: null, etat: '', msg: '' };

async function partiesChessCom(u, n) {
  const r = await fetch(`https://api.chess.com/pub/player/${encodeURIComponent(u.toLowerCase())}/games/archives`);
  if (r.status === 404) throw { msg: `Aucun joueur « ${u} » sur Chess.com.` };
  if (!r.ok) throw { msg: 'Chess.com ne répond pas pour le moment. Réessaie dans un instant.' };
  const arch = ((await r.json()).archives || []).slice(-3).reverse();
  const out = [];
  for (const url of arch) {
    const m = await fetch(url); if (!m.ok) continue;
    const games = ((await m.json()).games || []).filter(x => x.pgn && x.rules === 'chess').sort((a, b) => b.end_time - a.end_time);
    out.push(...games.map(x => x.pgn));
    if (out.length >= n) break;
  }
  return out.slice(0, n);
}
async function partiesLichess(u, n) {
  const r = await fetch(`https://lichess.org/api/games/user/${encodeURIComponent(u)}?max=${n}&moves=true&tags=true&clocks=false&evals=false&opening=false&literate=false`, { headers: { Accept: 'application/x-chess-pgn' } });
  if (r.status === 404) throw { msg: `Aucun joueur « ${u} » sur Lichess.` };
  if (r.status === 429) throw { msg: 'Lichess limite les demandes : réessaie dans une minute.' };
  if (!r.ok) throw { msg: 'Lichess ne répond pas pour le moment. Réessaie dans un instant.' };
  return decouperPgn(await r.text()).slice(0, n);
}
const clePartie = pgn => { const P = chargerPartie(pgn); if (!P) return pgn.slice(0, 200); const h = P.headers; return h.Link || h.Site + '|' + h.Date + '|' + h.White + '|' + h.Black + '|' + (h.UTCTime || h.EndTime || '') + '|' + P.moves.length; };

// ---- audio : musique + bruitages ----
function audioStudio(actx, sc, t0, sortie) {
  const master = actx.createGain(); master.gain.value = 0.9; master.connect(sortie);
  const bruit = (t, dur, f1, f2, vol) => {
    const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);

    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl).connect(g).connect(master); s.start(t); s.stop(t + dur);

    const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
  };
  if (ST.sons) for (const e of sc.sons) {
    const t = t0 + e.t;
    if (e.s === 'whoosh') bruit(t, 0.45, 400, 3000, 0.5);
    if (e.s === 'clac') { bruit(t, 0.06, 1800, 900, 0.9); ton(t, 220, 0.08, 0.3, 'triangle', 120); }
    if (e.s === 'tick') ton(t, 1250, 0.07, 0.35);
    if (e.s === 'buzz') { ton(t, 160, 0.55, 0.32, 'sawtooth', 70); ton(t + 0.02, 155, 0.55, 0.25, 'square', 65); }
    if (e.s === 'ding') { ton(t, 880, 0.5, 0.35); ton(t + 0.09, 1320, 0.6, 0.3); }
    if (e.s === 'boum') { ton(t, 90, 0.7, 0.8, 'sine', 35); bruit(t, 0.3, 300, 80, 0.6); }
  }

      if (k % 2) bruit(t, 0.05, 8000, 6000, 0.12);
      bruit(t + beat / 2, 0.03, 9000, 7000, 0.06);

}

async function jouerStudio(enregistrer) {

    const flux = cv.captureStream(30);
    dest.stream.getAudioTracks().forEach(tr => flux.addTrack(tr));
    mime = ['video/mp4;codecs="avc1.42E01E, mp4a.40.2"', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';

    setTimeout(() => actx.close().catch(() => { }), 300);
    if (rec) rec.onstop = async () => {
      const type = (rec.mimeType || mime || 'video/webm').split(';')[0], ext = type.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(morceaux, { type });
      $('#stEtat').textContent = '';
      if (await telecharger(`blundercheck-${ST.modele}.${ext}`, blob)) toast(`Vidéo prête (${ext.toUpperCase()}).`);
    };

    if (ROUTE !== 'studio') { if (rec && rec.state !== 'inactive') rec.stop(); ST.enCours = false; actx.close().catch(() => { }); return; }
    const t = actx.currentTime - t0;
