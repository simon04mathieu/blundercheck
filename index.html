// ---------- Moteur Stockfish : plusieurs workers en parallèle, WebAssembly si possible ----------
// Profils : [profondeur max, temps max en ms] pour l'aperçu (toutes les positions) puis l'affinage (moments clés)
const PROFILS = {
  '12|1200': { nom: 'Rapide', apercu: [9, 250], fin: [12, 700] },
  '14|2500': { nom: 'Normale', apercu: [10, 350], fin: [13, 1000] },
  '16|5000': { nom: 'Poussée', apercu: [11, 700], fin: [16, 3500] },
};
const profil = () => PROFILS[REGLAGES.depth] || PROFILS['14|2500'];

const SF_CDN = 'https://cdn.jsdelivr.net/npm/stockfish@10.0.2/src/stockfish.asm.js';
const absUrl = f => new URL(f, location.href).href;
function chargerScript(src) {
  return new Promise((res, rej) => {
    if (window.STOCKFISH) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script refusé'));
    document.head.append(s);
  });
}
async function workerBlob(fichier, hash = '') {
  const r = await fetch(fichier);
  if (!r.ok) throw new Error('fichier ' + r.status);
  const url = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
  return new Worker(url + hash);
}
// Chaque façon de lancer Stockfish, de la plus rapide à la plus compatible
const STRATEGIES = [
  { nom: 'WebAssembly', w: () => new Worker('stockfish.js') },
  { nom: 'WebAssembly', w: () => workerBlob('stockfish.js', '#' + absUrl('stockfish.wasm')) },
  { nom: 'asm.js', w: () => new Worker('stockfish.asm.js') },
  { nom: 'asm.js', w: () => workerBlob('stockfish.asm.js') },
  { nom: 'asm.js', w: () => new Worker(URL.createObjectURL(new Blob([`importScripts(${JSON.stringify(SF_CDN)});`], { type: 'text/javascript' }))) },
  { nom: 'asm.js sans worker', principal: true },
];

// Un "slot" = une instance de Stockfish, dans un worker ou (en dernier recours) dans la page
function slotWorker(w) {
  const s = { send: c => w.postMessage(c), kill: () => w.terminate(), onLine: null, onErr: null };
  w.onmessage = ev => s.onLine && s.onLine(String(ev.data));
  w.onerror = ev => { if (ev && ev.preventDefault) ev.preventDefault(); s.onErr && s.onErr(ev && ev.message || 'erreur du worker'); };
  return s;
}
async function slotPrincipal() {
  await chargerScript(SF_CDN);
  if (typeof STOCKFISH !== 'function') throw new Error('Stockfish introuvable');
  const sf = STOCKFISH();
  const s = { send: c => setTimeout(() => sf.postMessage(c, true), 0), kill: () => { }, onLine: null, onErr: null, principal: true };
  sf.onmessage = l => s.onLine && s.onLine(String(l));
  return s;
}

const Moteur = {
  pool: [], q: [], type: null, etat: 'arret', init: null, raisons: [], strat: null,
  get nb() { return this.strat && this.strat.principal ? 1 : clamp((navigator.hardwareConcurrency || 2) - 1, 1, 4); },

  async creer(strat) {
    const slot = strat.principal ? await slotPrincipal() : slotWorker(await strat.w());
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { slot.kill(); reject(new Error('pas de réponse')); }, 6000);
      slot.onLine = l => { if (l.startsWith('uciok')) { clearTimeout(t); resolve(slot); } };
      slot.onErr = m => { clearTimeout(t); slot.kill(); reject(new Error(m)); };
      slot.send('uci');
    });
  },
  brancher(slot) {
    const s = { slot, cur: null };
    slot.onLine = l => this.ligne(s, l);
    slot.onErr = () => this.perdre(s);
    slot.send('setoption name Hash value 16');
    this.pool.push(s);
    return s;
  },
  perdre(s) {
    clearTimeout(s.garde);
    try { s.slot.kill(); } catch { }
    if (s.cur) { this.q.unshift(s.cur); s.cur = null; }
    this.pool = this.pool.filter(x => x !== s);
    if (!this.pool.length) { this.init = null; this.etat = 'arret'; if (this.q.length) this.demarrer(); }
    emit('moteur');
    this.dispatch();
  },
  demarrer() {
    if (this.init) return this.init;
    this.etat = 'demarrage'; emit('moteur');
    this.init = (async () => {
      let slot = null;
      for (const st of STRATEGIES) {
        try { slot = await this.creer(st); this.strat = st; this.type = st.nom; break; }
        catch (e) { this.raisons.push(`${st.nom} : ${e && e.message || e}`); }
      }
      if (!slot) { this.etat = 'erreur'; emit('moteur'); this.echecTout(); return false; }
      this.brancher(slot);
      this.etat = 'pret'; emit('moteur'); this.dispatch();
      for (let k = 1; k < this.nb; k++) this.creer(this.strat).then(x => { this.brancher(x); emit('moteur'); this.dispatch(); }).catch(() => { });
      return true;
    })();
    return this.init;
  },
  analyser(fen, { depth, ms, tag = '', prio = false } = {}) {
    if (!depth) [depth, ms] = profil().fin;
    const fin = evalFin(fen);
    if (fin) return Promise.resolve(fin);
    if (this.etat === 'erreur') return Promise.reject({ code: 'moteur' });
    return new Promise((resolve, reject) => {
      const job = { fen, depth, ms, tag, resolve, reject };
      if (prio) this.q.unshift(job); else this.q.push(job);
      this.demarrer();
      this.dispatch();
    });
  },
  abandonner(tag) {
    this.q = this.q.filter(j => { if (j.tag === tag) { j.reject({ code: 'cancelled' }); return false; } return true; });
  },
  dispatch() {
    for (const s of this.pool) {
      if (s.cur || !this.q.length) continue;
      const j = s.cur = this.q.shift();
      j.exact = null; j.any = null;
      let { depth, ms } = j;
      if (s.slot.principal) { depth = Math.min(depth, 11); ms = Math.min(ms, 350); }   // ne pas figer la page
      s.slot.send('position fen ' + j.fen);
      s.slot.send(`go depth ${depth} movetime ${ms}`);
      clearTimeout(s.garde);
      s.garde = setTimeout(() => { if (s.cur === j) { s.slot.send('stop'); s.garde = setTimeout(() => { if (s.cur === j) this.perdre(s); }, 4000); } }, ms + 6000);
    }
    const occ = this.pool.some(s => s.cur);
    const e = this.etat === 'erreur' || this.etat === 'demarrage' ? this.etat : occ ? 'calcul' : this.pool.length ? 'pret' : this.etat;
    if (e !== this.etat) { this.etat = e; emit('moteur'); }
  },
  ligne(s, l) {
    const j = s.cur;
    if (!j) return;
    if (l.startsWith('info') && l.includes(' score ') && l.includes(' pv ')) {
      j.any = l;
      if (!/ (upper|lower)bound/.test(l)) j.exact = l;
    } else if (l.startsWith('bestmove')) {
      clearTimeout(s.garde);
      s.cur = null;
      const e = lireInfo(j.fen, j.exact || j.any, l);
      e.pv = e.pv.slice(0, 10);
      j.resolve(e);
      this.dispatch();
    }
  },
  echecTout() {
    const all = this.pool.map(s => s.cur).filter(Boolean).concat(this.q);
    this.q = []; this.pool.forEach(s => (s.cur = null));
    all.forEach(j => j.reject({ code: 'moteur' }));
  },
};

// ---------- Analyse d'une partie en deux temps ----------
// 1. Aperçu : toutes les positions, vite, en parallèle  ->  courbe, classement et rapport disponibles
// 2. Affinage : seulement les moments clés, plus profond ->  explications et prof IA fiables
const ANALYSES = new Set();
const PROG = {};   // id -> {phase, fait, total}

function aAffiner(g, D) {
  const set = new Set();
  D.P.moves.forEach((mv, i) => {
    const a = g.evals[i], b = g.evals[i + 1];
    if (!a || !b) return;
    const d = deltaCoup(mv.color, a, b), swing = Math.abs(chances(b.cp) - chances(a.cp));
    if (d >= 0.07 || swing >= 0.15) { set.add(i); set.add(i + 1); }
  });
  return [...set].filter(i => !g.evals[i] || (g.evals[i].lvl || 2) < 2).sort((x, y) => x - y);
}

async function analyserPartie(g) {
  if (ANALYSES.has(g.id) || estAffinee(g)) return;
  ANALYSES.add(g.id);
  const P = chargerPartie(g.pgn), pr = profil();
  const ecrire = (i, e, lvl) => { e.lvl = lvl; g.evals[i] = e; g.rev = (g.rev || 0) + 1; };
  try {
    // 1. aperçu
    const manque = P.fens.map((f, i) => i).filter(i => !g.evals[i]);
    PROG[g.id] = { phase: 'apercu', fait: P.fens.length - manque.length, total: P.fens.length };
    let compte = 0;
    await Promise.all(manque.map(i => Moteur.analyser(P.fens[i], { depth: pr.apercu[0], ms: pr.apercu[1], tag: g.id }).then(e => {
      ecrire(i, e, 1); PROG[g.id].fait++; emit('progres', g.id, i);
      if (++compte % 12 === 0) sauverLib();
    })));
    sauverLib();
    emit('apercu', g.id);
    // 2. affinage des moments clés
    const D = deriver(g);
    const liste = aAffiner(g, D);
    PROG[g.id] = { phase: 'affinage', fait: 0, total: liste.length };
    await Promise.all(liste.map(i => Moteur.analyser(P.fens[i], { depth: pr.fin[0], ms: pr.fin[1], tag: g.id }).then(e => {
      ecrire(i, e, 2); PROG[g.id].fait++; emit('progres', g.id, i);
    })));
    g.affine = true;
    g.rev = (g.rev || 0) + 1;
    sauverLib();
    emit('analysee', g.id);
  } catch (e) {
    if (e && e.code === 'moteur') toast("Le moteur Stockfish n'a pas pu démarrer dans ce navigateur.", 'err');
    sauverLib();
  } finally {
    delete PROG[g.id];
    ANALYSES.delete(g.id);
  }
}

// ---------- Échiquier SVG interactif (clic ou glisser-déposer) ----------
function creerEchiquier(svg, { onMove } = {}) {
  const st = { fen: DEFAULT_FEN, orient: 'w', last: null, arrows: [], sel: null, hint: null, interactive: true, drag: null, marks: [] };
  svg.setAttribute('viewBox', '0 0 320 320');
  const xy = sq => { const [f, r] = sqFR(sq); return st.orient === 'w' ? [f * 40, (7 - r) * 40] : [(7 - f) * 40, r * 40]; };
  const sqAt = (x, y) => {
    const f0 = Math.floor(x / 40), r0 = Math.floor(y / 40);
    if (f0 < 0 || f0 > 7 || r0 < 0 || r0 > 7) return null;
    return st.orient === 'w' ? sqName(f0, 7 - r0) : sqName(7 - f0, r0);
  };
  const pt = e => { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 320, (e.clientY - r.top) / r.height * 320]; };
  const jeu = () => new Chess(st.fen);
  const cibles = () => st.sel ? jeu().moves({ square: st.sel, verbose: true }).map(m => m.to) : [];

  function fleche(uci, cls) {
    if (!uci) return '';
    let [x1, y1] = xy(uci.slice(0, 2)), [x2, y2] = xy(uci.slice(2, 4));
    x1 += 20; y1 += 20; x2 += 20; y2 += 20;
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
    if (!len) return '';
    const ux = dx / len, uy = dy / len, nx = -uy, ny = ux, w = 3.4, hw = 9, hl = 12.5;
    const tx = x2 - ux * 4, ty = y2 - uy * 4, bx = tx - ux * hl, by = ty - uy * hl, sx = x1 + ux * 7, sy = y1 + uy * 7;
    const p = [[sx + nx * w, sy + ny * w], [bx + nx * w, by + ny * w], [bx + nx * hw, by + ny * hw], [tx, ty], [bx - nx * hw, by - ny * hw], [bx - nx * w, by - ny * w], [sx - nx * w, sy - ny * w]];
    return `<polygon class="arrow ${cls}" points="${p.map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
  }

  function render() {
    const g = jeu();
    let s = '';
    for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
      const [x, y] = xy(sqName(f, r));
      s += `<rect x="${x}" y="${y}" width="40" height="40" class="${(f + r) % 2 === 0 ? 'sq-d' : 'sq-l'}"/>`;
    }
    const hl = (sq, cls) => { const [x, y] = xy(sq); s += `<rect x="${x}" y="${y}" width="40" height="40" class="${cls}"/>`; };
    if (st.last) { hl(st.last[0], 'hl-last'); hl(st.last[1], 'hl-last'); }
    for (const m of st.marks) hl(m.sq, m.cls);
    if (st.hint) hl(st.hint, 'hl-hint');
    if (st.sel) hl(st.sel, 'hl-sel');
    if (g.in_check()) {
      for (const sq of ALL_SQ) { const p = g.get(sq); if (p && p.type === 'k' && p.color === g.turn()) { const [x, y] = xy(sq); s += `<circle cx="${x + 20}" cy="${y + 20}" r="18" class="chk"/>`; } }
    }
    for (let i = 0; i < 8; i++) {
      const f = st.orient === 'w' ? i : 7 - i, rb = st.orient === 'w' ? 0 : 7;
      s += `<text x="${i * 40 + 36.5}" y="317.5" class="${(f + rb) % 2 === 0 ? 'co-d' : 'co-l'}">${FILES[f]}</text>`;
      const r = st.orient === 'w' ? 7 - i : i, fg = st.orient === 'w' ? 0 : 7;
      s += `<text x="2" y="${i * 40 + 8}" class="${(fg + r) % 2 === 0 ? 'co-d' : 'co-l'}">${r + 1}</text>`;
    }
    const tour = g.turn();
    const rows = st.fen.split(' ')[0].split('/');
    rows.forEach((row, ri) => {
      let f = 0;
      for (const ch of row) {
        if (/\d/.test(ch)) { f += +ch; continue; }
        const col = ch === ch.toUpperCase() ? 'w' : 'b', sq = sqName(f, 7 - ri);
        const [x, y] = xy(sq);
        const mobile = st.interactive && col === tour;
        const cache = st.drag && st.drag.moved && st.drag.sq === sq;
        s += `<use href="#${col}${ch.toLowerCase()}" transform="translate(${x},${y})" class="pc${mobile ? ' mob' : ''}${cache ? ' ghosted' : ''}"/>`;
        f++;
      }
    });
    for (const t of cibles()) {
      const [x, y] = xy(t);
      s += g.get(t) ? `<circle cx="${x + 20}" cy="${y + 20}" r="17" class="dot-cap"/>` : `<circle cx="${x + 20}" cy="${y + 20}" r="5.5" class="dot"/>`;
    }
    for (const a of st.arrows) s += fleche(a.uci, a.cls);
    if (st.drag && st.drag.moved) {
      const p = g.get(st.drag.sq);
      if (p) s += `<use href="#${p.color}${p.type}" id="dragGhost" transform="translate(${st.drag.x - 20},${st.drag.y - 20})" class="pc drag"/>`;
    }
    svg.innerHTML = s;
  }

  function jouerCoup(from, to) {
    const g = jeu(), p = g.get(from);
    let promo = '';
    if (p && p.type === 'p' && (to[1] === '8' || to[1] === '1')) promo = 'q';
    st.sel = null; st.drag = null;
    render();
    if (onMove) onMove(from + to + promo);
  }

  svg.addEventListener('pointerdown', e => {
    if (!st.interactive) return;
    const [x, y] = pt(e), sq = sqAt(x, y);
    if (!sq) return;
    if (st.sel && cibles().includes(sq)) { jouerCoup(st.sel, sq); return; }
    const g = jeu(), p = g.get(sq);
    if (p && p.color === g.turn()) {
      st.sel = sq; st.drag = { sq, x, y, x0: x, y0: y, moved: false };
      try { svg.setPointerCapture(e.pointerId); } catch { }
      e.preventDefault();
    } else st.sel = null;
    render();
  });
  svg.addEventListener('pointermove', e => {
    if (!st.drag) return;
    const [x, y] = pt(e);
    st.drag.x = x; st.drag.y = y;
    if (!st.drag.moved && Math.hypot(x - st.drag.x0, y - st.drag.y0) > 5) { st.drag.moved = true; render(); return; }
    const gh = svg.querySelector('#dragGhost');
    if (gh) gh.setAttribute('transform', `translate(${x - 20},${y - 20})`);
  });
  svg.addEventListener('pointerup', e => {
    if (!st.drag) return;
    const [x, y] = pt(e), sq = sqAt(x, y), d = st.drag;
    st.drag = null;
    if (d.moved && sq && sq !== d.sq && cibles().includes(sq)) return jouerCoup(d.sq, sq);
    if (d.moved) st.sel = null;
    render();
  });
  svg.addEventListener('pointercancel', () => { st.drag = null; render(); });

  render();
  return {
    set(o) { const avant = st.fen; Object.assign(st, o); if (!('sel' in o)) st.sel = null; render(); if (o.fen && avant && o.fen !== avant && o.last) sonCoup(avant, o.fen); },
    get orient() { return st.orient; },
    render,
  };
}

// ---------- Sons des coups (synthétisés, aucun fichier) ----------
let AUDIO = null;
function bip(ctx, t, freq, dur, vol, type = 'triangle') {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.55, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sonCoup(avant, apres) {
  if (REGLAGES.sons === false) return;
  if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
  try {
    AUDIO = AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    if (AUDIO.state === 'suspended') AUDIO.resume();
    const n = f => f.split(' ')[0].replace(/[^a-z]/gi, '').length;
    const prise = n(apres) < n(avant), echec = new Chess(apres).in_check(), t = AUDIO.currentTime + 0.005;
    if (prise) { bip(AUDIO, t, 340, 0.09, 0.32); bip(AUDIO, t + 0.012, 900, 0.05, 0.12, 'square'); }
    else bip(AUDIO, t, 620, 0.06, 0.25);
    if (echec) bip(AUDIO, t + 0.08, 980, 0.12, 0.14, 'sine');
  } catch { }
}

// ---------- Graphiques (SVG dessinés à la taille réelle, infobulles HTML) ----------
function monterGraph(wrap, dessiner) {
  wrap.classList.add('chart');
  wrap.innerHTML = '<svg class="chart-svg"></svg><div class="tip" hidden></div>';
  const svg = wrap.firstChild, tip = wrap.lastChild;
  let w = 0;
  const go = () => { w = wrap.clientWidth; if (w > 0) dessiner(svg, tip, w); };
  go();
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => { if (wrap.clientWidth !== w) go(); }); ro.observe(wrap); wrap._ro = ro; }
  return { redraw: go };
}
function placerTip(tip, wrap, x, y, html) {
  tip.innerHTML = html; tip.hidden = false;
  const tw = tip.offsetWidth, W = wrap.clientWidth;
  tip.style.left = clamp(x - tw / 2, 0, W - tw) + 'px';
  tip.style.top = Math.max(0, y - tip.offsetHeight - 10) + 'px';
}

/** Courbe d'avantage : chances de gain des Blancs, cliquable */
function graphAvantage(wrap, get) {
  return monterGraph(wrap, (svg, tip, W) => {
    const H = +wrap.dataset.h || 150, padT = 8, padB = 18;
    const { evals, tags, moves, fens, ply, onPick, me } = get();
    const N = Math.max(1, evals.length - 1);
    const X = i => (i / N) * (W - 2) + 1;
    const Y = cp => padT + (H - padT - padB) / 2 * (1 - chances(cp));
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
    const pts = [];
    evals.forEach((e, i) => { if (e) pts.push([X(i), Y(e.cp), i]); });
    const mid = Y(0);
    let s = `<line class="g-mid" x1="0" x2="${W}" y1="${mid}" y2="${mid}"/>`;
    s += `<text class="g-lab" x="4" y="${padT + 9}">Blancs</text><text class="g-lab" x="4" y="${H - padB - 3}">Noirs</text>`;
    if (pts.length > 1) {
      const d = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      s += `<path class="g-area" d="${d} L${pts[pts.length - 1][0].toFixed(1)} ${H - padB} L${pts[0][0].toFixed(1)} ${H - padB} Z"/>`;
      s += `<path class="g-line" d="${d}"/>`;
    }
    // numéros de coups sur l'axe
    const pas = N > 80 ? 20 : N > 40 ? 10 : 5;
    for (let m = pas; m * 2 <= N; m += pas) s += `<text class="g-axis" x="${X(m * 2 - 1)}" y="${H - 4}" text-anchor="middle">${m}</text>`;
    tags.forEach((t, i) => {
      if ((t !== 'gaffe' && t !== 'erreur') || !evals[i + 1]) return;
      const mine = moves[i].color === me;
      s += `<circle class="g-crit g-${t}${mine ? ' mine' : ''}" cx="${X(i + 1)}" cy="${Y(evals[i + 1].cp)}" r="${mine ? 3.6 : 2.6}"/>`;
    });
    if (ply >= 0) s += `<line class="g-cur" x1="${X(ply)}" x2="${X(ply)}" y1="${padT - 4}" y2="${H - padB}"/>`;
    if (evals[ply]) s += `<circle class="g-dot" cx="${X(ply)}" cy="${Y(evals[ply].cp)}" r="4"/>`;
    s += `<line class="g-hover" x1="0" x2="0" y1="${padT - 4}" y2="${H - padB}" visibility="hidden"/>`;
    s += `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="g-hit"/>`;
    svg.innerHTML = s;
    const hv = svg.querySelector('.g-hover');
    const plyAt = e => { const r = svg.getBoundingClientRect(); return clamp(Math.round((e.clientX - r.left) / r.width * N), 0, N); };
    const hit = svg.querySelector('.g-hit');
    hit.onpointermove = e => {
      const p = plyAt(e), x = X(p);
      hv.setAttribute('x1', x); hv.setAttribute('x2', x); hv.setAttribute('visibility', 'visible');
      const ev = evals[p];
      let html = p === 0 ? '<b>Départ</b>' : `<b class="mono">${numero(fens[p - 1])} ${esc(enFr(moves[p - 1].san))}</b>`;
      if (p > 0 && tags[p - 1] && CLASSES[tags[p - 1]]) html += ` ${badge(tags[p - 1])}`;
      html += `<span class="mono"> ${ev ? texteEval(ev) : '…'}</span>`;
      placerTip(tip, wrap, x, ev ? Y(ev.cp) : mid, html);
    };
    hit.onpointerleave = () => { hv.setAttribute('visibility', 'hidden'); tip.hidden = true; };
    hit.onclick = e => onPick && onPick(plyAt(e));
  });
}

/** Courbe double : précision (%) et classement (Elo) partie après partie */
function graphProgression(wrap, get) {
  return monterGraph(wrap, (svg, tip, W) => {
    const H = 220, padL = 34, padR = 40, padT = 12, padB = 26;
    const pts = get();   // [{date, prec, elo, label}]
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
    if (!pts.length) { svg.innerHTML = ''; return; }
    const n = pts.length, X = i => n === 1 ? (padL + W - padR) / 2 : padL + i / (n - 1) * (W - padL - padR);
    const Yp = v => padT + (1 - v / 100) * (H - padT - padB);
    const elos = pts.map(p => p.elo).filter(v => v !== null);
    let lo = Math.min(...elos), hi = Math.max(...elos);
    if (!elos.length) { lo = 0; hi = 1; }
    if (hi - lo < 40) { lo -= 20; hi += 20; }
    const Ye = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
    let s = '';
    for (const v of [0, 25, 50, 75, 100]) s += `<line class="g-grid" x1="${padL}" x2="${W - padR}" y1="${Yp(v)}" y2="${Yp(v)}"/><text class="g-axis" x="${padL - 6}" y="${Yp(v) + 3}" text-anchor="end">${v}</text>`;
    if (elos.length) for (const v of [lo, (lo + hi) / 2, hi]) s += `<text class="g-axis g-axis-elo" x="${W - padR + 6}" y="${Ye(v) + 3}">${Math.round(v)}</text>`;
    const path = (arr, Y) => arr.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
    const P = pts.map((p, i) => [X(i), p.prec]).filter(p => p[1] !== null);
    const Eo = pts.map((p, i) => [X(i), p.elo]).filter(p => p[1] !== null);
    if (P.length > 1) s += `<path class="g-line g-prec" d="${path(P, Yp)}"/>`;
    if (Eo.length > 1) s += `<path class="g-line g-elo" d="${path(Eo, Ye)}"/>`;
    P.forEach(p => { s += `<circle class="g-pt g-prec-pt" cx="${p[0]}" cy="${Yp(p[1])}" r="3.2"/>`; });
    Eo.forEach(p => { s += `<circle class="g-pt g-elo-pt" cx="${p[0]}" cy="${Ye(p[1])}" r="3.2"/>`; });
    const step = Math.ceil(n / Math.max(1, Math.floor((W - padL - padR) / 70)));
    pts.forEach((p, i) => { if (i % step === 0 || i === n - 1) s += `<text class="g-axis" x="${X(i)}" y="${H - 8}" text-anchor="middle">${fmtDateCourt(p.date)}</text>`; });
    s += `<line class="g-hover" x1="0" x2="0" y1="${padT}" y2="${H - padB}" visibility="hidden"/><rect class="g-hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;
    svg.innerHTML = s;
    const hv = svg.querySelector('.g-hover'), hit = svg.querySelector('.g-hit');
    hit.onpointermove = e => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
      let k = 0, best = Infinity;
      pts.forEach((p, i) => { const d = Math.abs(X(i) - x); if (d < best) { best = d; k = i; } });
      const p = pts[k];
      hv.setAttribute('x1', X(k)); hv.setAttribute('x2', X(k)); hv.setAttribute('visibility', 'visible');
      placerTip(tip, wrap, X(k), Yp(p.prec ?? 50), `<b>${fmtDate(p.date)}</b><span>${esc(p.label)}</span><span class="mono">Précision ${pct(p.prec)}${p.elo ? ' · ' + p.elo + ' Elo' : ''}</span>`);
    };
    hit.onpointerleave = () => { hv.setAttribute('visibility', 'hidden'); tip.hidden = true; };
    hit.onclick = e => { const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W; let k = 0, b = Infinity; pts.forEach((p, i) => { const d = Math.abs(X(i) - x); if (d < b) { b = d; k = i; } }); if (pts[k].onPick) pts[k].onPick(); };
  });
}

// ---------- Le prof IA (Claude, via la capacité "sample" du compte claude.ai) ----------
const IA = { fn: null, dispo: false, ctl: null, ask: null };
const IA_ERR = {
  not_granted: "Tu n'as pas autorisé la page à utiliser Claude : les commentaires IA sont en pause pour cette visite.",
  sampling_disabled: "Claude n'est pas disponible sur ce compte.",
  rate_limited: "Limite d'utilisation de Claude atteinte. Réessaie un peu plus tard.",
  session_expired: "Ta session claude.ai a expiré : reconnecte-toi puis réessaie.",
  prompt_too_large: "Cette partie est trop longue pour être commentée d'un coup.",
  refused: "Claude a refusé de répondre à cette demande.",
  empty_completion: "Le prof n'a rien répondu. Réessaie.",
};
const iaErreur = e => IA_ERR[e && e.code] || (e && e.message) || "Le prof a été interrompu (problème de connexion). Réessaie.";
const iaDefinitif = e => e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code);
function iaCouper(e) { if (iaDefinitif(e)) { IA.dispo = false; IA.fn = null; } }

function evalEleve(e, me) {
  if (!e) return '…';
  return me === 'w' ? texteEval(e) : texteEval({ cp: -e.cp, mate: e.mate === null ? null : -e.mate, pv: e.pv });
}
const ligneTxt = (fen, pv, n = 5) => variante(fen, pv, n).map(c => `${c.num} ${c.san}`).join(' ');
const NOM_TAG_IA = { gaffe: 'gaffe', erreur: 'erreur', imprecision: 'imprécision', meilleur: 'meilleur coup', excellent: 'excellent coup', bon: 'bon coup' };

function faitsCoup(g, D, i) {
  const P = D.P, mv = P.moves[i], fen = P.fens[i], av = g.evals[i], ap = g.evals[i + 1], t = D.tags[i], me = D.me;
  const mine = mv.color === me, L = lisible(fen, mv.uci);
  const o = { ply: i + 1, coup: `${numero(fen)} ${L.san}`, signification: L.sens, joue_par: mine ? 'élève' : 'adversaire', phase: D.phases[i], eval_avant: evalEleve(av, me), eval_apres: evalEleve(ap, me), classement: NOM_TAG_IA[t] || t };
  if (av && av.pv.length && av.pv[0] !== mv.uci) { const b = lisible(fen, av.pv[0]); o.meilleur_coup = `${b.san} (${b.sens})`; o.suite_du_meilleur = ligneTxt(fen, av.pv); }
  if (mine && MAUVAIS.includes(t)) {
    const x = expliquer(fen, mv.uci, av, ap, me), f = [];
    if (x.matContre) f.push(`après ce coup, l'adversaire a un mat en ${x.matContre}`);
    if (x.pertes.length) f.push(`laisse en prise : ${x.pertes.join(', ')}`);
    if (x.perte) f.push(`la suite adverse fait perdre environ ${x.perte} point(s) de matériel`);
    const w = pourquoi(fen, av, i ? P.fens[i - 1] : null, i ? P.moves[i - 1].uci : null);
    if (x.matPour) f.push(`le meilleur coup menait au mat en ${x.matPour}`);
    else if (x.gain && !/gagne/.test(w)) f.push(`le meilleur coup gagnait environ ${x.gain} point(s) de matériel`);
    if (w) f.push(`le meilleur coup ${w}`);
    if (ap.pv.length) o.meilleure_reponse_adverse = ligneTxt(P.fens[i + 1], ap.pv);
    o.faits = f;
  } else if (!mine && MAUVAIS.includes(t) && ap.pv.length) {
    const pun = lisible(P.fens[i + 1], ap.pv[0]);
    o.comment_punir = `${pun.san} (${pun.sens})`;
    o.suite_de_la_punition = ligneTxt(P.fens[i + 1], ap.pv);
    const w = pourquoi(P.fens[i + 1], ap, fen, mv.uci); if (w) o.pourquoi_punir = w;
    const s = P.moves[i + 1]; if (s) o.reponse_de_l_eleve = s.uci === ap.pv[0] ? 'il a trouvé la punition' : `il a joué ${lisible(P.fens[i + 1], s.uci).san}`;
  }
  return o;
}
const aCommenter = D => D.P.moves.map((m, i) => i).filter(i => D.P.moves[i].color === D.me || MAUVAIS.includes(D.tags[i]));
const partieTxt = D => D.P.moves.map((mv, i) => (mv.color === 'w' || i === 0 ? `${numero(D.P.fens[i])} ` : '') + enFr(mv.san)).join(' ');
const niveau = D => D.elo(D.me) ? `environ ${D.elo(D.me)} Elo` : 'débutant à intermédiaire';

function promptProf(g, D, idx = aCommenter(D), synthese = true) {
  const h = D.h;
  return `Tu es un professeur d'échecs bienveillant, clair et concret. Ton élève (niveau ${niveau(D)}) avait les ${D.me === 'w' ? 'Blancs' : 'Noirs'}. Tu commentes sa partie coup par coup, en français, en le tutoyant, avec des mots simples.

Règles :
- Appuie-toi UNIQUEMENT sur les données du moteur Stockfish ci-dessous (évaluations, meilleurs coups, suites, faits). N'invente jamais de coup, de variante, de menace ou de position de pièce qui n'y figure pas. Si les données ne suffisent pas, reste sur des principes généraux.
- Les évaluations sont du point de vue de l'élève : positif = l'élève est mieux, +1 ≈ un pion d'avance, #3 = l'élève mate en 3, #-3 = il se fait mater en 3.
- Explique l'idée derrière les coups (menace, pièce en prise, développement, sécurité du roi, activité des pièces, finale…), pas seulement les chiffres.
- Coup de l'élève classé "meilleur coup", "excellent coup" ou "bon coup" : UNE phrase courte (20 mots maximum) sur l'idée du coup.
- Imprécision, erreur ou gaffe de l'élève : 2 ou 3 phrases courtes (50 mots maximum) : ce qui ne va pas, ce qu'il fallait jouer et pourquoi.
- Erreur de l'adversaire : 1 ou 2 phrases sur comment l'élève pouvait en profiter et s'il l'a fait.
- CHAQUE coup de la liste reçoit un "conseil", sans exception. Le conseil est UNE phrase à l'impératif (15 mots maximum), concrète et utilisable dès la prochaine partie :
  · il part de CETTE position (cite la pièce, la case ou le motif quand c'est utile) puis en tire une règle générale ;
  · après un bon coup, il dit quel réflexe garder et quand le réutiliser ; après une erreur, quelle vérification faire avant de jouer ;
  · interdit : les conseils vagues ("fais attention", "réfléchis bien", "joue mieux") et deux fois le même conseil dans la partie.
- Ajoute un "theme" parmi : "tactique", "pièce en prise", "sécurité du roi", "développement", "centre", "structure de pions", "activité des pièces", "finale", "calcul", "gestion de l'avantage".
- Si le même motif revient plusieurs fois (le même coup raté, la même pièce oubliée…), dis-le clairement.
- Écris les coups exactement comme dans les données.
- Sois bref et dense : ne recopie pas les évaluations chiffrées, pas d'introduction ni de formule de politesse.

Format de la réponse : uniquement des lignes JSON, un objet par ligne, sans texte autour et sans bloc de code.
Pour chaque coup de la liste, dans l'ordre :
{"p": 12, "c": "commentaire", "k": "conseil", "t": "thème"}
${synthese ? `Puis une dernière ligne :
{"resume": "2 ou 3 phrases sur la partie", "lecons": ["leçon 1", "leçon 2", "leçon 3"]}
Les 3 leçons sont les 3 habitudes les plus utiles pour CET élève, d'après les erreurs qui reviennent dans la partie.` : `Ne commente QUE les ${idx.length} coups de la liste ci-dessous (la partie est commentée par morceaux), un objet par coup, sans en sauter aucun, et rien d'autre.`}

Partie : ${partieTxt(D)}
Résultat : ${h.Result || '?'}${h.Termination ? ' (' + h.Termination + ')' : ''}

Coups à commenter (un objet JSON par ligne) :
${idx.map(i => JSON.stringify(faitsCoup(g, D, i))).join('\n')}`;
}

// Commente une partie (celle affichée, ou n'importe laquelle pour le commentaire en lot)
IA.lot = null;   // {fait, total} pendant un commentaire en lot
// Extrait tous les objets JSON de premier niveau d'un texte (même sur plusieurs lignes)
function objetsJSON(txt) {
  const out = []; let prof = 0, debut = -1, chaine = false, echap = false;
  for (let k = 0; k < txt.length; k++) {
    const c = txt[k];
    if (chaine) { if (echap) echap = false; else if (c === '\\') echap = true; else if (c === '"') chaine = false; continue; }
    if (c === '"') chaine = true;
    else if (c === '{') { if (!prof) debut = k; prof++; }
    else if (c === '}' && prof) { prof--; if (!prof) { try { out.push(JSON.parse(txt.slice(debut, k + 1))); } catch { } } }
  }
  return out;
}
async function commenterPartie(g, { silencieux = false } = {}) {
  const D = g && deriver(g);
  if (!IA.fn || !g || !D || !D.affine || IA.ctl) return false;
  g.prof = { comments: {}, resume: '', lecons: [], done: false, total: aCommenter(D).length, erreur: '' };
  IA.ctl = new AbortController();
  IA.cour = g.id;
  const pr = g.prof;
  majIA(g.id);
  const lireLigne = l => {
    l = l.trim().replace(/^```(json)?/, '').replace(/```$/, '').trim().replace(/,$/, '');
    if (!l.startsWith('{')) return;
    let o; try { o = JSON.parse(l); } catch { return; }
    const ply = o.p || o.ply, com = o.c || o.commentaire, cons = o.k || o.conseil, th = o.t || o.theme;
    if (ply && com) pr.comments[ply] = { c: String(com), k: cons ? String(cons) : '', t: th ? String(th).slice(0, 40) : '' };
    else if (o.resume || o.lecons) { pr.resume = String(o.resume || ''); pr.lecons = Array.isArray(o.lecons) ? o.lecons.map(String).slice(0, 5) : []; }
    majIA(g.id);
  };
  // Un appel par morceau de partie : le prof ne s'arrête plus en route
  const morceau = async (idx, synthese) => {
    let pending = '', tout = '';
    await IA.fn(promptProf(g, D, idx, synthese), { signal: IA.ctl.signal, maxTokens: 8192, onText: ({ delta }) => { tout += delta; const ls = (pending + delta).split('\n'); pending = ls.pop(); ls.forEach(lireLigne); } });
    lireLigne(pending);
    objetsJSON(tout).forEach(o => { if (!((o.p || o.ply) && pr.comments[o.p || o.ply])) lireLigne(JSON.stringify(o)); });
    return tout;
  };
  const manque = () => aCommenter(D).filter(i => !pr.comments[i + 1]);
  const TAILLE = 14;
  let ok = false, dernier = '';
  try {
    const tous = aCommenter(D), lots = [];
    for (let k = 0; k < tous.length; k += TAILLE) lots.push(tous.slice(k, k + TAILLE));
    // tous les morceaux partent en même temps (5 au plus) ; le dernier demande aussi la synthèse
    const enParallele = async (ls, synth) => {
      let suivant = 0;
      const ouvrier = async () => { while (suivant < ls.length) { const k = suivant++; dernier = await morceau(ls[k], synth && k === ls.length - 1) || dernier; } };
      await Promise.all(Array.from({ length: Math.min(5, ls.length) }, ouvrier));
    };
    await enParallele(lots, true);
    // rattrapage des coups oubliés (deux essais au plus), lui aussi en parallèle
    for (let essai = 0; essai < 2 && manque().length; essai++) {
      const m = manque(), ls = [];
      for (let k = 0; k < m.length; k += TAILLE) ls.push(m.slice(k, k + TAILLE));
      await enParallele(ls, false);
    }
    if (!pr.resume && Object.keys(pr.comments).length) await morceau(tous.slice(-3), true).catch(() => {});
    if (!Object.keys(pr.comments).length) {
      console.warn('Réponse du prof illisible :', dernier.slice(0, 2000));
      throw { code: 'format', message: dernier.trim() ? "Le prof a répondu dans un format inattendu. Réessaie." : "Le prof n'a rien répondu. Réessaie dans un instant." };
    }
    pr.done = true; ok = true;
    if (!silencieux) toast('Le prof a commenté ta partie.');
  } catch (e) {
    if (e && e.code !== 'cancelled') pr.erreur = iaErreur(e);
    if (e && e.code !== 'cancelled' && silencieux) toast(iaErreur(e), 'err');
    iaCouper(e);
    if (e && (e.code === 'cancelled' || iaDefinitif(e) || e.code === 'rate_limited')) IA.stopLot = true;
  } finally {
    IA.ctl = null; IA.cour = null;
    sauverLib();
    majIA(g.id);
    emit('prof', g.id);
  }
  return ok;
}
const lancerProf = () => commenterPartie(g_());

async function commenterTout() {
  if (IA.lot || !IA.fn) return;
  const liste = LIB.filter(g => estAffinee(g) && !(g.prof && g.prof.done) && deriver(g) && deriver(g).P.moves.length);
  if (!liste.length) { toast('Toutes tes parties analysées sont déjà commentées.', 'info'); return; }
  IA.lot = { fait: 0, total: liste.length }; IA.stopLot = false;
  emit('prof');
  for (const g of liste) {
    if (IA.stopLot || !IA.fn) break;
    await commenterPartie(g, { silencieux: true });
    IA.lot.fait++;
    emit('prof');
  }
  const n = IA.lot.fait;
  IA.lot = null; emit('prof');
  if (n) toast(`Le prof a commenté ${pluriel(n, 'partie')}.`);
}
function majIA(id) {

  if (A.vue === 'rapport' && $('#iaSynth')) $('#iaSynth').innerHTML = synthIA();
}

function statutIA(g, D) {
  const pr = g.prof, n = pr ? Math.min(Object.keys(pr.comments).length, pr.total || 1e9) : 0;
  if (!IA.dispo && !n) return { txt: "Les commentaires IA fonctionnent sur claude.ai, avec ton compte Claude connecté.", btn: false };

  if (IA.ctl) return { prog: pr ? [n, pr.total] : null, txt: n ? `Le prof commente ta partie… ${n} / ${pr.total} coups` : 'Le prof lit ta partie… les premiers commentaires arrivent en général en moins d’une minute.', stop: true };
  if (pr && pr.erreur) return { txt: pr.erreur, btn: IA.dispo, relance: true };

}

function contexteQuestion(p) {
  const g = g_(), D = D_(), fen = p.fen, e = p.ev;
  let c = `Tu es le professeur d'échecs de ton élève (niveau ${niveau(D)}, il avait les ${D.me === 'w' ? 'Blancs' : 'Noirs'}). Réponds en français, en le tutoyant, en 3 à 6 phrases simples.
Appuie-toi sur les données Stockfish ci-dessous. Ne prétends jamais qu'un coup gagne ou perd si les données ne le montrent pas : dans ce cas, raisonne avec des principes (pièces en prise, menaces, sécurité du roi) et dis que tu n'as pas la variante exacte. Évaluations du point de vue de l'élève (positif = l'élève est mieux).

Partie : ${partieTxt(D)}
Position affichée (FEN) : ${fen}
Trait aux ${fen.split(' ')[1] === 'w' ? 'Blancs' : 'Noirs'}.`;
  if (p.enVar) c += `\nCette position vient d'une variante jouée par l'élève à partir du coup ${A.var.base} de la partie : ${A.var.moves.slice(0, A.var.k).map((u, k) => lisible(k ? A.var.fens[k - 1] : D.P.fens[A.var.base], u).san).join(' ')}.`;
  else if (A.ply > 0) c += `\nDernier coup joué, avec l'analyse : ${JSON.stringify(faitsCoup(g, D, A.ply - 1))}`;
  if (e && e.pv.length) c += `\nÉvaluation : ${evalEleve(e, D.me)}. Meilleure suite selon Stockfish : ${ligneTxt(fen, e.pv, 6)}`;
  const cm = !p.enVar && g.prof && g.prof.comments[A.ply];
  if (cm) c += `\nTon commentaire sur ce coup : ${cm.c}${cm.k ? ' Conseil : ' + cm.k : ''}`;
  return c;
}

async function poserQuestion(q) {
  if (!IA.fn) return;
  const p = posCourante(), key = A.var ? 'v' + p.fen : 'p' + A.ply;
  const turns = A.chats[key] || (A.chats[key] = []);
  turns.push({ role: 'user', content: q });
  rendreIA($('#panelBody'));
  const log = $('#chatLog'), bulle = document.createElement('div');
  bulle.className = 'a thinking'; bulle.textContent = 'Le prof réfléchit…'; log.append(bulle);
  IA.ask = new AbortController();
  try {
    const { text } = await IA.fn([{ role: 'user', content: contexteQuestion(p) }, ...turns.slice(-8)], {
      cache: false, signal: IA.ask.signal,
      onText: ({ text }) => { if (bulle.isConnected) { bulle.classList.remove('thinking'); bulle.textContent = text; } },
    });
    turns.push({ role: 'assistant', content: text });
  } catch (e) {
    if (e && e.text) turns.push({ role: 'assistant', content: e.text + ' […]' }); else turns.pop();
    if (e && e.code !== 'cancelled') toast(iaErreur(e), 'err');
    iaCouper(e);
    if (A.tab === 'ia') rendreIA($('#panelBody'));
  } finally { IA.ask = null; }
}

async function expliquerPositionIA(p) {
  if (!IA.fn || !p.ev || !p.ev.pv.length) return;
  const key = p.fen, b = lisible(p.fen, p.ev.pv[0]);
  A.iaPos[key] = { text: 'Le prof réfléchit…', pending: true };
  rendrePanneau();
  try {
    const q = `Explique simplement pourquoi ${b.san} (${b.sens}) est le meilleur coup dans cette position, et quelle idée retenir pour la reconnaître seul la prochaine fois.`;
    const { text } = await IA.fn([{ role: 'user', content: contexteQuestion(p) }, { role: 'user', content: q }], {
      onText: ({ text }) => { A.iaPos[key] = { text, pending: false }; const t = $('#iaPosTxt'); if (t) { t.classList.remove('thinking'); t.textContent = text; } },
    });
    A.iaPos[key] = { text, pending: false };
  } catch (e) {
    delete A.iaPos[key];
    if (e && e.code !== 'cancelled') toast(iaErreur(e), 'err');
    iaCouper(e);
  }
  rendrePanneau();
}

function synthIA() {
  const g = g_(), pr = g && g.prof;
  if (pr && (pr.resume || (pr.lecons || []).length)) return `${pr.resume ? `<p>${esc(pr.resume)}</p>` : ''}${(pr.lecons || []).length ? `<ol style="margin:0;padding-left:18px;display:grid;gap:4px">${pr.lecons.map(l => `<li>${esc(l)}</li>`).join('')}</ol>` : ''}`;

}

const A = { id: null, ply: 0, tab: 'coups', vue: 'analyse', orient: null, board: null, var: null, graph: null, iaPos: {}, chats: {} };
const g_ = () => partieParId(A.id);
const D_ = () => { const g = g_(); return g ? deriver(g) : null; };

function evalLegende(e) {
  if (!e) return 'Analyse en cours…';
  if (e.mate === 0) return 'Échec et mat';
  if (e.mate !== null) return `${e.mate > 0 ? 'Les Blancs' : 'Les Noirs'} matent en ${Math.abs(e.mate)}`;
  const a = Math.abs(e.cp);
  if (a < 35) return 'Position équilibrée';
  return `Avantage ${a < 120 ? 'léger' : a < 300 ? 'net' : 'décisif'} ${e.cp > 0 ? 'des Blancs' : 'des Noirs'}`;
}
const libCoup = (fen, uci) => { const L = lisible(fen, uci); return `${numero(fen)} ${L.san}`; };

// Position affichée : celle de la partie, ou celle de la variante explorée
function posCourante() {
  const D = D_(), g = g_();
  if (A.var && A.var.k > 0) {
    const k = A.var.k;
    return { fen: A.var.fens[k - 1], prevFen: k > 1 ? A.var.fens[k - 2] : D.P.fens[A.var.base], uci: A.var.moves[k - 1], ev: A.var.evals[k - 1], evPrev: k > 1 ? A.var.evals[k - 2] : g.evals[A.var.base], enVar: true };
  }
  const p = A.ply;
  return { fen: D.P.fens[p], prevFen: p > 0 ? D.P.fens[p - 1] : null, uci: p > 0 ? D.P.moves[p - 1].uci : null, ev: g.evals[p], evPrev: p > 0 ? g.evals[p - 1] : null, enVar: false };
}

function ouvrirAnalyse(id, ply) {

  A.graph = graphAvantage($('#advChart'), () => {

function nav(k) {
  const D = D_();
  if (!D) return;
  if (k === 'flip') { A.orient = autre(A.orient); majEchiquier(); return; }
  if (k === 'err') {
    const n = D.P.moves.length;
    for (let s = 1; s <= n; s++) { const i = (A.ply + s - 1) % n; if (D.P.moves[i].color === D.me && MAUVAIS.includes(D.tags[i])) return allerPly(i + 1); }
    toast('Aucune erreur de ta part dans cette partie.', 'info');
    return;
  }
  if (A.var) {
    if (k === 'prev') { A.var.k--; if (A.var.k <= 0) { const b = A.var.base; A.var = null; return allerPly(b); } return majTout(); }
    if (k === 'next') { if (A.var.k < A.var.moves.length) { A.var.k++; majTout(); } return; }
    if (k === 'first' || k === 'last') A.var = null;
  }
  if (k === 'first') allerPly(0);
  else if (k === 'prev') allerPly(A.ply - 1);
  else if (k === 'next') allerPly(A.ply + 1);
  else if (k === 'last') allerPly(D.P.moves.length);
}

function allerPly(p) {
  const D = D_();
  if (!D) return;
  A.var = null;
  A.ply = clamp(p, 0, D.P.moves.length);
  if (A.vue !== 'analyse') { A.vue = 'analyse'; $$('#vueSeg button').forEach(x => x.classList.toggle('on', x.dataset.v === 'analyse')); rendreCorps(); return; }
  majTout();
}
function quitterVariante() { if (!A.var) return; const b = A.var.base; A.var = null; allerPly(b); }

// Un coup joué à la main sur l'échiquier
function coupJoue(uci) {
  const D = D_();
  if (!A.var && A.ply < D.P.moves.length && D.P.moves[A.ply].uci === uci) return allerPly(A.ply + 1);
  if (A.var && A.var.k < A.var.moves.length && A.var.moves[A.var.k] === uci) { A.var.k++; return majTout(); }
  const p = posCourante(), gg = new Chess(p.fen);
  if (!jouer(gg, uci)) return;
  if (!A.var) A.var = { base: A.ply, moves: [], fens: [], evals: [], k: 0 };
  const v = A.var;
  v.moves.length = v.fens.length = v.evals.length = v.k;
  v.moves.push(uci); v.fens.push(gg.fen()); v.evals.push(null); v.k++;
  const k = v.k - 1, fen = gg.fen();
  Moteur.analyser(fen, { prio: true }).then(e => { if (A.var === v && v.fens[k] === fen) { v.evals[k] = e; majTout(); } }).catch(() => { });
  majTout();
}

function majTout() {
  majEchiquier();
  majPos();
  rendrePanneau();
  if (A.graph) A.graph.redraw();
  const D = D_();
  const t = A.var ? `var. ${A.var.k}` : `${A.ply} / ${D.P.moves.length}`;
  if ($('#plyTxt')) $('#plyTxt').textContent = t;
  if ($('#plyTxtM')) $('#plyTxtM').textContent = t;
}

function majEchiquier() {
  if (!A.board) return;
  const D = D_(), g = g_(), p = posCourante();
  const arrows = [], marks = [];
  if (!p.enVar && A.ply > 0) {
    const i = A.ply - 1, t = D.tags[i];
    if (MAUVAIS.includes(t) && g.evals[i] && g.evals[i + 1]) {
      if (D.P.moves[i].color === D.me) { arrows.push({ uci: g.evals[i].pv[0], cls: 'best' }); arrows.push({ uci: g.evals[i + 1].pv[0], cls: 'bad' }); }
      else arrows.push({ uci: g.evals[i + 1].pv[0], cls: 'best' });
    }
  }
  if (p.enVar && p.ev && p.ev.pv[0]) arrows.push({ uci: p.ev.pv[0], cls: 'var' });
  A.board.set({ fen: p.fen, orient: A.orient, last: p.uci ? [p.uci.slice(0, 2), p.uci.slice(2, 4)] : null, arrows, marks, hint: null });
  // barre d'évaluation
  const e = p.ev, wc = e ? 50 + 50 * chances(e.cp) : 50;
  const bar = $('#evalbar');
  bar.classList.toggle('flip', A.orient === 'b');
  $('#evalFill').style.height = wc + '%';
  const txt = e ? texteEval(e).replace('−', '-').replace(/^[+-]/, '').replace('#', 'M') : '';
  $('#evW').textContent = e && e.cp >= 0 ? txt : '';
  $('#evB').textContent = e && e.cp < 0 ? txt : '';
  const vb = $('#varBanner');
  if (A.var) {
    vb.hidden = false;
    vb.innerHTML = `<span><b>Variante</b> depuis ${A.var.base ? libCoup(D.P.fens[A.var.base - 1], D.P.moves[A.var.base - 1].uci) : 'le départ'} · Stockfish évalue chaque coup que tu joues.</span><button class="btn sm" id="quitVar" style="margin-left:auto">${ico('back')}Revenir à la partie <kbd>Échap</kbd></button>`;
    $('#quitVar').onclick = quitterVariante;
  } else vb.hidden = true;
}

function ligneCliquable(fen, pv, n = 8) {
  if (!pv || !pv.length) return '<span class="faint">—</span>';
  const v = variante(fen, pv, n);
  return `<div class="line">${v.map((c, k) => `<span class="n">${c.num}</span><button data-line="${k}" title="${esc(c.sens)}">${esc(c.san)}</button>`).join('')}</div>`;
}
function brancherLigne(el, fen, pv) {
  $$('[data-line]', el).forEach(b => b.onclick = () => {
    const k = +b.dataset.line, base = A.var;
    // rejoue la ligne du moteur comme une variante jusqu'au coup cliqué
    for (const uci of pv.slice(0, k + 1)) coupJoue(uci);
    if (base === undefined) return;
  });
}

/** Explication calculée (règles + moteur) du coup qui mène à la position affichée */
function explicationMoteur(i) {
  const D = D_(), g = g_(), mv = D.P.moves[i], fen = D.P.fens[i], av = g.evals[i], ap = g.evals[i + 1], t = D.tags[i];
  if (!av || !ap) return '<p class="thinking">Stockfish analyse encore ce coup…</p>';
  const mine = mv.color === D.me;
  const pq = () => pourquoi(fen, av, i ? D.P.fens[i - 1] : null, i ? D.P.moves[i - 1].uci : null);
  let h = '';
  if (mine && MAUVAIS.includes(t)) {
    const x = expliquer(fen, mv.uci, av, ap, D.me);
    if (x.matContre) h += `<p><span class="k">Après ce coup, ton adversaire a un mat en ${x.matContre}.</span></p>`;
    if (x.pertes.length) h += `<p><span class="k">Laisse en prise :</span> ${esc(x.pertes.join(', '))}.</p>`;
    if (x.refut) h += `<p><span class="k">Réponse la plus forte :</span> <span class="mv">${esc(x.refut.san)}</span> <span class="muted">(${esc(x.refut.sens)})</span>${x.perte ? `, tu perds environ ${pluriel(x.perte, 'point')} de matériel.` : ''}</p>`;
    if (x.meilleur) {
      const w = pq();
      h += `<p><span class="k">Il fallait :</span> <span class="mv">${esc(x.meilleur.san)}</span> <span class="muted">(${esc(x.meilleur.sens)})</span>${w ? ` : il ${esc(w)}.` : '.'}</p>`;
      if (x.matPour) h += `<p class="k">C'était un mat en ${x.matPour}.</p>`;
      else if (x.gain) h += `<p>Avec cette suite, tu gagnais environ ${pluriel(x.gain, 'point')} de matériel.</p>`;
    }
  } else if (mine) {
    if (t === 'meilleur') { const w = pq(); h += `<p>C'est le coup que Stockfish choisit${w ? ` : il ${esc(w)}` : ''}.</p>`; }
    else if (av.pv.length) { const b = lisible(fen, av.pv[0]); h += `<p>${t === 'excellent' ? 'Excellent coup, presque aussi fort que le choix du moteur' : 'Bon coup, il ne change presque rien'}. Stockfish préférait <span class="mv">${esc(b.san)}</span> <span class="muted">(${esc(b.sens)})</span>.</p>`; }
  } else if (MAUVAIS.includes(t) && ap.pv.length) {
    const fa = D.P.fens[i + 1], pun = lisible(fa, ap.pv[0]), w = pourquoi(fa, ap, fen, mv.uci), s = D.P.moves[i + 1];
    h += `<p>Ton adversaire s'est trompé. <span class="k">Pour le punir :</span> <span class="mv">${esc(pun.san)}</span> <span class="muted">(${esc(pun.sens)})</span>${w ? ` : il ${esc(w)}.` : '.'}</p>`;
    if (s) h += s.uci === ap.pv[0] ? '<p class="up">Tu as trouvé la punition.</p>' : `<p>Tu as joué <span class="mv">${esc(lisible(fa, s.uci).san)}</span>${MAUVAIS.includes(D.tags[i + 1]) ? ' : occasion manquée.' : ', ce qui garde un bon avantage.'}</p>`;
  } else h += `<p class="muted">Coup adverse correct${t === 'meilleur' ? ', c\'est même le meilleur' : ''}.</p>`;
  return h;
}

function majPos() {
  const el = $('#posCard');
  if (!el) return;
  const D = D_(), p = posCourante();
  let titre, chipH = '', avap = '';
  if (p.enVar) titre = `<span class="san">${esc(libCoup(p.prevFen, p.uci))}</span><span class="tag tag-ia" style="color:var(--ia)">variante</span>`;
  else if (A.ply === 0) titre = '<span class="san">Position de départ</span>';
  else {
    const i = A.ply - 1;
    titre = `<span class="san">${esc(libCoup(D.P.fens[i], D.P.moves[i].uci))}</span>`;
    chipH = chip(D.tags[i]);

// ---------- Rapport d'analyse ----------
function seriesSansErreur(D, c) {
  let best = 0, cur = 0;
  D.P.moves.forEach((m, i) => { if (m.color !== c) return; if (MAUVAIS.includes(D.tags[i])) cur = 0; else best = Math.max(best, ++cur); });
  return best;
}
function pointsForts(D, c) {
  const out = [], ph = D.phasePrec[c], noms = { ouverture: 'Ouverture', milieu: 'Milieu de partie', finale: 'Finale' };
  const phs = Object.entries(ph).filter(([, v]) => v !== null).sort((a, b) => b[1] - a[1]);
  if (phs.length && phs[0][1] >= 70) out.push(`<b>${noms[phs[0][0]]} solide</b> : ${pct(phs[0][1])} de précision`);
  const top = D.counts[c].meilleur + D.counts[c].excellent;
  if (top) out.push(`<b>${pluriel(top, 'coup')}</b> au niveau du moteur (meilleur ou excellent)`);
  const s = seriesSansErreur(D, c);
  if (s >= 5) out.push(`<b>Série de ${s} coups</b> sans imprécision`);
  const punis = D.P.moves.filter((m, i) => m.color !== c && MAUVAIS.includes(D.tags[i]) && D.P.moves[i + 1] && g_().evals[i + 1] && D.P.moves[i + 1].uci === g_().evals[i + 1].pv[0]).length;
  if (punis) out.push(`<b>${pluriel(punis, 'erreur adverse punie', 'erreurs adverses punies')}</b> immédiatement`);
  return out.length ? out : ['<span class="faint">Pas de point fort net dans cette partie.</span>'];
}
function syntheseMoteur(D, g) {
  const me = D.me, s = me === 'w' ? 1 : -1, E = g.evals;
  let maxV = -Infinity, maxI = 0;
  E.forEach((e, i) => { const v = s * e.cp; if (v > maxV) { maxV = v; maxI = i; } });
  const parts = [];
  const res = D.resultat === 'victoire' ? 'gagné' : D.resultat === 'defaite' ? 'perdu' : D.resultat === 'nulle' ? 'fait nulle' : null;
  if (maxV >= 300 && D.resultat !== 'victoire') {
    const ev = E[maxI];
    parts.push(`Tu as eu un avantage décisif (${evalEleve(ev, me)}) ${maxI ? `après ${libCoup(D.P.fens[maxI - 1], D.P.moves[maxI - 1].uci)}` : ''}, mais il t'a échappé${res ? ` et tu as finalement ${res}` : ''}.`);
  } else if (res) parts.push(`Tu as ${res} cette partie avec ${pct(D.prec[me])} de précision, contre ${pct(D.prec[D.opp])} pour ton adversaire.`);
  const pire = [...D.erreurs].sort((a, b) => b.delta - a.delta)[0];
  if (pire) parts.push(`Ton coup le plus coûteux : ${libCoup(D.P.fens[pire.i], D.P.moves[pire.i].uci)}.`);
  if (D.manquees.length) parts.push(`Tu as laissé passer ${pluriel(D.manquees.length, 'erreur adverse', 'erreurs adverses')} sans la punir.`);
  const fin = E[E.length - 1];
  if (D.resultat === 'defaite' && fin && s * fin.cp > -150 && !/mat|checkmate/i.test(D.h.Termination || '') && fin.mate !== 0) parts.push(`À la fin, la position n'était pas perdue (${evalEleve(fin, me)}) : l'abandon était prématuré.`);
  return parts.join(' ');
}

function ligneMoment(D, i, extra) {
  const L = lisible(D.P.fens[i], D.P.moves[i].uci);
  return `<button class="row moment" data-goto="${i + 1}"><span class="mv">${numero(D.P.fens[i])} ${esc(L.san)}</span><span class="ellip muted">${extra}</span>${ico('arrow')}</button>`;
}

// ---------- Pages ----------
const MOTIFS = {
  en_prise: { titre: 'Pièces laissées en prise', desc: "Avant de jouer, vérifie que la case d'arrivée et tes autres pièces restent défendues." },
  tactique: { titre: 'Gains de matériel ratés', desc: "Le coup gagnant était là : regarde d'abord les échecs, les prises et les menaces." },
  double: { titre: 'Échecs doubles ratés', desc: "Un échec qui attaque une deuxième pièce gagne souvent du matériel. Cherche-le quand le roi et une pièce adverses sont alignés." },
  mat_concede: { titre: 'Mats concédés', desc: "Avant chaque coup, demande-toi quels échecs ton adversaire peut donner." },
  manquee: { titre: 'Erreurs adverses non punies', desc: "Quand l'adversaire se trompe, prends le temps de chercher la punition avant de suivre ton plan." },
};
const NOM_PHASE = { ouverture: "l'ouverture", milieu: 'le milieu de partie', finale: 'la finale' };

const partiesCompletes = () => LIB.map(g => ({ g, D: deriver(g) })).filter(x => x.D && x.D.affine && x.D.P.moves.length);

function agregats(list) {
  const mot = { en_prise: 0, tactique: 0, double: 0, mat_concede: 0, manquee: 0 };
  const ph = { ouverture: [], milieu: [], finale: [] }, phErr = { ouverture: 0, milieu: 0, finale: 0 };
  for (const { D } of list) {
    D.erreurs.forEach(e => { e.motifs.forEach(m => mot[m]++); phErr[e.phase]++; });
    mot.manquee += D.manquees.length;
    for (const k in ph) if (D.phasePrec[D.me][k] !== null) ph[k].push(D.phasePrec[D.me][k]);
  }
  const phMoy = {}; for (const k in ph) phMoy[k] = moyenne(ph[k]);
  return { mot, phMoy, phErr };
}

function axesTravail(list) {
  const { mot, phMoy, phErr } = agregats(list);
  const axes = Object.entries(mot).filter(([, n]) => n > 0).map(([k, n]) => ({ key: k, n, titre: MOTIFS[k].titre, desc: MOTIFS[k].desc, filtre: k }));
  const phs = Object.entries(phMoy).filter(([, v]) => v !== null).sort((a, b) => a[1] - b[1]);
  if (phs.length && phs[0][1] < 85) axes.push({ key: 'phase', n: phErr[phs[0][0]], titre: `Ta précision dans ${NOM_PHASE[phs[0][0]]}`, desc: `C'est la phase où tu es le moins précis (${pct(phs[0][1])} en moyenne).`, filtre: 'tous' });
  return axes.sort((a, b) => b.n - a.n).slice(0, 3);
}

function lignePartie(g, compact) {
  const D = deriver(g);
  if (!D) return '';
  const opp = D.opp, p = progression(g);
  const resLab = { victoire: 'Victoire', defaite: 'Défaite', nulle: 'Nulle', inconnu: '—' }[D.resultat];
  return `<button class="row games-row" data-open="${g.id}">
    <span class="opp"><span class="pc-dot ${D.me}" title="Tu avais les ${D.me === 'w' ? 'Blancs' : 'Noirs'}"></span><span class="ellip"><b>${esc(D.P.moves.length ? D.nom(opp) : 'Position FEN')}</b> ${D.elo(opp) ? `<small>${D.elo(opp)}</small>` : ''}<br><small class="ellip" style="font-family:var(--f-ui)">${esc(D.ouverture.nom)}</small></span></span>
    <span><span class="res res-${D.resultat}">${resLab}</span></span>
    <span class="muted hide-sm">${esc(D.cadence.type ? D.cadence.txt + ' · ' + D.cadence.type : '—')}</span>

    <span class="mono hide-sm">${p < 1 ? `<span class="bar" style="display:block;width:70px"><i style="width:${p * 100}%"></i></span>` : pct(D.prec[D.me])}</span>

    ${ico('arrow', 'faint')}

}

// ---------- Bulletin (inspiré des « report cards ») ----------
const NOTE = v => v === null ? null : (v = Math.round(v)) >= 90 ? 'A' : v >= 80 ? 'B' : v >= 70 ? 'C' : v >= 60 ? 'D' : 'E';
const NOTE_PAR = (r, k = 1) => r <= 0.25 * k ? 'A' : r <= 0.6 * k ? 'B' : r <= 1 * k ? 'C' : r <= 1.6 * k ? 'D' : 'E';
function bulletin(list) {
  if (!list.length) return '';
  const { mot, phMoy } = agregats(list), n = list.length;
  const vig = (mot.en_prise + mot.mat_concede) / n, tac = (mot.tactique + mot.double + mot.manquee) / n;
  const lignes = [
    ['Ouverture', NOTE(phMoy.ouverture), phMoy.ouverture === null ? 'pas encore de données' : `${pct(phMoy.ouverture)} de précision`],
    ['Milieu de partie', NOTE(phMoy.milieu), phMoy.milieu === null ? 'pas encore de données' : `${pct(phMoy.milieu)} de précision`],
    ['Finale', NOTE(phMoy.finale), phMoy.finale === null ? 'aucune finale jouée' : `${pct(phMoy.finale)} de précision`],
    ['Vigilance', NOTE_PAR(vig), `${vig.toFixed(1).replace('.', ',')} pièce${vig >= 2 ? 's' : ''} laissée${vig >= 2 ? 's' : ''} en prise ou mat concédé par partie`],
    ['Tactique', NOTE_PAR(tac, 8), `${tac.toFixed(1).replace('.', ',')} occasion${tac >= 2 ? 's' : ''} ratée${tac >= 2 ? 's' : ''} par partie`],
  ];
  return `<section class="card"><div class="card-h"><h2>Ton bulletin</h2><span class="tag tag-moteur" data-tip="Notes calculées à partir de tes ${n} partie(s) analysée(s) par Stockfish. A = excellent, E = à travailler en priorité.">${ico('moteur')}${pluriel(n, 'partie')}</span></div>
    <div class="bulletin">${lignes.map(([t, nt, d]) => `<div class="bl"><span class="note note-${nt || 'x'}">${nt || '–'}</span><div><b>${t}</b><small>${d}</small></div></div>`).join('')}</div></section>`;
}

function exoDuJour() {
  const res = exosResolus(), all = exercices(); if (!all.length) return null;
  const pool = all.filter(x => res[x.key] !== 'ok'); const L = pool.length ? pool : all;
  const d = new Date(), k = d.getFullYear() * 400 + d.getMonth() * 32 + d.getDate();
  return L[k % L.length];
}
function carteDuJour() {
  const x = exoDuJour(); if (!x) return '';
  const s = serieJours();

function pageParties(view) {
  view.innerHTML = `<div class="page-head"><div><h1>Mes parties</h1><p>${pluriel(LIB.length, 'partie enregistrée', 'parties enregistrées')} dans ce navigateur.</p></div><button class="btn primary" data-route="import">${ico('analyser')}Importer une partie</button></div>

      <select class="select" id="fres" aria-label="Résultat">${[['tous', 'Tous les résultats'], ['victoire', 'Victoires'], ['defaite', 'Défaites'], ['nulle', 'Nulles']].map(([k, l]) => `<option value="${k}" ${FP.res === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <select class="select" id="fcol" aria-label="Couleur">${[['tous', 'Les deux couleurs'], ['w', 'Avec les Blancs'], ['b', 'Avec les Noirs']].map(([k, l]) => `<option value="${k}" ${FP.col === k ? 'selected' : ''}>${l}</option>`).join('')}</select>

  const draw = () => {
    const q = FP.q.toLowerCase();
    const rows = LIB.filter(g => {
      const D = deriver(g); if (!D) return false;
      if (FP.res !== 'tous' && D.resultat !== FP.res) return false;
      if (FP.col !== 'tous' && D.me !== FP.col) return false;
      return !q || (D.nom(D.opp) + ' ' + D.ouverture.nom + ' ' + (D.ouverture.eco || '')).toLowerCase().includes(q);
    });
    $('#glist').innerHTML = rows.length ? rows.map(g => `<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid var(--line)" class="grow">${lignePartie(g).replace('class="row games-row"', 'class="row games-row" style="border-top:0"')}<button class="icon-btn" data-del="${g.id}" style="margin-right:12px" aria-label="Supprimer cette partie" title="Supprimer">${ico('trash')}</button></div>`).join('')
      : `<div class="empty">${ico('search')}<h3>${LIB.length ? 'Aucune partie ne correspond' : 'Aucune partie'}</h3><p>${LIB.length ? 'Change les filtres pour en voir davantage.' : 'Importe une partie pour commencer.'}</p></div>`;
    const first = $('#glist .grow'); if (first) first.style.borderTop = '0';
    brancherOuvertures($('#glist'));
    $$('[data-del]', view).forEach(b => b.onclick = e => {
      e.stopPropagation();
      if (b.dataset.sure) { supprimerPartie(b.dataset.del); toast('Partie supprimée.'); draw(); return; }
      b.dataset.sure = '1'; b.classList.add('btn', 'sm', 'danger'); b.classList.remove('icon-btn'); b.innerHTML = 'Supprimer ?';
      setTimeout(() => { if (b.isConnected && b.dataset.sure) { delete b.dataset.sure; b.className = 'icon-btn'; b.innerHTML = ico('trash'); } }, 3500);
    });
  };
  $('#fq').oninput = e => { FP.q = e.target.value; draw(); };
  $('#fres').onchange = e => { FP.res = e.target.value; draw(); };
  $('#fcol').onchange = e => { FP.col = e.target.value; draw(); };
  draw();
}

    el.innerHTML = `<label class="drop" id="drop" for="impFile">${ico('upload')}<b style="color:var(--fg)">Dépose un fichier .pgn ici</b><span>ou clique pour le choisir. Les fichiers du dossier <span class="mono">parties/</span> de ton script Python marchent aussi.</span></label><input type="file" id="impFile" accept=".pgn,.txt" hidden>`;
    const lireF = f => { const r = new FileReader(); r.onload = () => { IMP.txt = String(r.result); IMP.tab = 'pgn'; $$('[data-it]').forEach(x => x.classList.toggle('on', x.dataset.it === 'pgn')); corpsImport(); toast(`Fichier « ${f.name} » chargé.`); }; r.readAsText(f); };
    $('#impFile').onchange = e => { const f = e.target.files[0]; if (f) lireF(f); };
    const d = $('#drop');
    d.ondragover = e => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = e => { e.preventDefault(); d.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) lireF(f); };
    return;
  }
  if (IMP.tab === 'fen') {
    el.innerHTML = `<div class="field"><label for="fenIn">Position FEN</label><input class="input mono" id="fenIn" placeholder="rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq - 0 1" value="${esc(IMP.fen)}"></div><div id="fenState"></div>${optionsImport()}<div><button class="btn primary" id="fenGo" disabled>${ico('moteur')}Analyser cette position</button></div>`;
    const check = () => {
      IMP.fen = $('#fenIn').value.trim();
      const v = IMP.fen ? new Chess().validate_fen(IMP.fen) : null;
      $('#fenState').innerHTML = !IMP.fen ? '' : v.valid ? `<div class="ready">${ico('check')}<div><b>Position valide</b><p class="muted">Trait aux ${IMP.fen.split(' ')[1] === 'w' ? 'Blancs' : 'Noirs'}. Tu pourras y jouer des variantes analysées par Stockfish.</p></div></div>` : `<div class="ready bad">${ico('alert')}<div><b>FEN invalide</b><p class="muted">Vérifie les 6 champs (placement, trait, roques, prise en passant, demi-coups, numéro du coup).</p></div></div>`;
      $('#fenGo').disabled = !(v && v.valid);
    };
    $('#fenIn').oninput = check; check();
    brancherOptions();
    $('#fenGo').onclick = () => {
      const col = IMP.col === 'auto' ? IMP.fen.split(' ')[1] : IMP.col;
      const g = ajouterPartie(`[Event "Position"]\n[SetUp "1"]\n[FEN "${IMP.fen}"]\n[Result "*"]\n\n*`, col, 'position');
      if (!g) return toast("Impossible d'ouvrir cette position.", 'err');
      ouvrirAnalyse(g.id, 0);
    };
    return;
  }
  el.innerHTML = `<div class="field"><div style="display:flex;justify-content:space-between;align-items:center"><label for="pgnIn">PGN de la partie</label><button class="btn ghost sm" id="exBtn">Coller un exemple</button></div>
      <textarea class="input" id="pgnIn" spellcheck="false" placeholder='[White "toi"]&#10;[Black "adversaire"]&#10;&#10;1. e4 e5 2. Nf3 Nc6 3. Bc4 …'>${esc(IMP.txt)}</textarea></div>
    <div id="pgnState"></div>${optionsImport()}
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="pgnGo" disabled>${ico('moteur')}Lancer l'analyse</button><button class="btn" id="pgnAll" hidden></button></div>`;
  const check = () => {
    IMP.txt = $('#pgnIn').value;
    const st = $('#pgnState'), games = decouperPgn(IMP.txt), go = $('#pgnGo'), all = $('#pgnAll');
    all.hidden = true;
    if (!IMP.txt.trim()) { st.innerHTML = ''; go.disabled = true; return; }
    const lien = IMP.txt.match(/(chess\.com|lichess\.org)\/\S*/i);
    if (lien && !/\b1\.\s*\S/.test(IMP.txt)) {
      const site = /lichess/i.test(lien[1]) ? 'lichess' : 'chesscom';
      st.innerHTML = `<div class="ready bad">${ico('info')}<div><b>Tu as collé un lien, pas le PGN</b><p class="muted">Un lien ne contient pas les coups. Suis les étapes « ${site === 'lichess' ? 'Lichess' : 'Chess.com'} » du guide pour copier le texte PGN de cette partie, puis colle-le ici.</p></div></div>`;
      go.disabled = true;
      if (GUIDE.site !== site && $('#guideBody')) { GUIDE.site = site; $$('[data-gs]').forEach(x => x.classList.toggle('on', x.dataset.gs === site)); $('#guideBody').innerHTML = guideHTML(site); }
      return;
    }
    const P = games.length ? chargerPartie(games[0]) : null;
    if (!P || !P.moves.length) { st.innerHTML = `<div class="ready bad">${ico('alert')}<div><b>Je n'arrive pas à lire ce PGN</b><p class="muted">Il doit contenir les coups, par exemple « 1. e4 e5 2. Nf3 ». Vérifie que tout le texte a bien été copié.</p></div></div>`; go.disabled = true; return; }
    const h = P.headers, auto = couleurPour(h);
    const col = IMP.col === 'auto' ? auto : IMP.col;
    const colTxt = col ? `tu as les ${col === 'w' ? 'Blancs' : 'Noirs'}${IMP.col === 'auto' ? ' (reconnu grâce à ton pseudo)' : ''}` : 'choisis ta couleur ci-dessous, ou renseigne ton pseudo dans les Paramètres';
    st.innerHTML = `<div class="ready">${ico('check')}<div><b>Partie prête à être analysée</b><p class="muted">${esc(h.White || 'Blancs')} contre ${esc(h.Black || 'Noirs')} · ${pluriel(Math.ceil(P.moves.length / 2), 'coup')} · ${esc(trouverOuverture(P.moves, h).nom)} · ${esc(colTxt)}.</p>${games.length > 1 ? `<p class="muted">Ce fichier contient ${games.length} parties : seule la première est analysée avec « Lancer l'analyse ».</p>` : ''}</div></div>`;
    go.disabled = IMP.col === 'auto' && !auto ? false : false;
    if (games.length > 1) { all.hidden = false; all.textContent = `Importer les ${games.length} parties`; }
  };
  $('#pgnIn').oninput = check;
  $('#exBtn').onclick = () => { $('#pgnIn').value = EXEMPLE_PGN; IMP.col = 'b'; corpsImport(); $('#pgnIn').value = EXEMPLE_PGN; check(); };
  brancherOptions(check);
  check();
  const lancer = pgn => {
    const P = chargerPartie(pgn); if (!P) return null;
    const col = IMP.col === 'auto' ? (couleurPour(P.headers) || 'w') : IMP.col;
    return ajouterPartie(pgn, col);
  };
  $('#pgnGo').onclick = () => {
    const g = lancer(decouperPgn(IMP.txt)[0]);
    if (!g) return toast("Ce PGN n'a pas pu être importé.", 'err');
    IMP.txt = '';
    toast('Partie ajoutée : analyse en cours.');
    ouvrirAnalyse(g.id, 0);
  };
  $('#pgnAll').onclick = () => {
    const ids = decouperPgn(IMP.txt).map(lancer).filter(Boolean);
    IMP.txt = '';
    toast(`${pluriel(ids.length, 'partie importée', 'parties importées')} : Stockfish les analyse l'une après l'autre.`);
    (async () => { for (const g of ids) await analyserPartie(g); })();
    aller('parties');
  };
}
function brancherOptions(after) {
  $$('#colSeg button').forEach(b => b.onclick = () => { IMP.col = b.dataset.c; $$('#colSeg button').forEach(x => x.classList.toggle('on', x === b)); if (after) after(); });
  const d = $('#impDepth'); if (d) d.onchange = () => { REGLAGES.depth = d.value; sauverReglages(); };
}

// ---------- Ouvertures ----------
let colOuv = 'tous';
function pageOuvertures(view) {
  const list = LIB.map(g => ({ g, D: deriver(g) })).filter(x => x.D && x.D.P.moves.length && (colOuv === 'tous' || x.D.me === colOuv));
  const grp = {};
  for (const x of list) {
    const k = x.D.ouverture.nom;
    const o = grp[k] || (grp[k] = { nom: k, eco: x.D.ouverture.eco, n: 0, v: 0, nul: 0, d: 0, prec: [], first: [], last: x });
    o.n++; if (x.D.resultat === 'victoire') o.v++; else if (x.D.resultat === 'nulle') o.nul++; else if (x.D.resultat === 'defaite') o.d++;
    if (x.D.complete && x.D.prec[x.D.me] !== null) o.prec.push(x.D.prec[x.D.me]);
    if (x.D.complete) { const e = x.D.erreurs[0]; if (e) o.first.push(Math.floor(e.i / 2) + 1); }
    if (x.D.date > o.last.D.date) o.last = x;
  }
  const rows = Object.values(grp).sort((a, b) => b.n - a.n);
  view.innerHTML = `<div class="page-head"><div><h1>Ouvertures</h1><p>Tes ouvertures, reconnues à partir des premiers coups de chaque partie, avec tes résultats et le moment où arrive ta première erreur.</p></div><button class="btn primary" data-route="repertoire">${ico('entrainement')}S'entraîner sur mes ouvertures</button>
    <div class="seg" id="ouvSeg">${[['tous', 'Toutes'], ['w', 'Avec les Blancs'], ['b', 'Avec les Noirs']].map(([k, l]) => `<button data-c="${k}" class="${colOuv === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
    <div class="card">${rows.length ? `<div class="row op-row games-head"><span>Ouverture</span><span>Parties</span><span class="hide-sm">Précision</span><span class="hide-sm">Victoires · nulles · défaites</span><span class="hide-sm">1re erreur</span><span></span></div>
      <div class="list">${rows.map(o => { const t = o.v + o.nul + o.d || 1; return `<button class="row op-row" data-open="${o.last.g.id}" title="Ouvrir la partie la plus récente"><span class="ellip">${o.eco ? `<span class="mono faint" style="margin-right:8px">${esc(o.eco)}</span>` : ''}<b style="font-weight:550">${esc(o.nom)}</b></span><span class="mono">${o.n}</span><span class="mono hide-sm">${pct(moyenne(o.prec))}</span><span class="hide-sm"><span class="wdl"><i style="width:${o.v / t * 100}%;background:var(--c-meilleur)"></i><i style="width:${o.nul / t * 100}%;background:var(--fg-3)"></i><i style="width:${o.d / t * 100}%;background:var(--c-gaffe)"></i></span><span class="mono faint" style="font-size:11.5px">${o.v} · ${o.nul} · ${o.d}</span></span><span class="mono hide-sm">${o.first.length ? 'coup ' + Math.round(moyenne(o.first)) : '—'}</span>${ico('arrow', 'faint')}</button>`; }).join('')}</div>`
      : `<div class="empty">${ico('ouvertures')}<h3>Pas encore d'ouverture à afficher</h3><p>Importe des parties pour voir quelles ouvertures tu joues et lesquelles te réussissent.</p><button class="btn primary" data-route="import">${ico('analyser')}Analyser une partie</button></div>`}</div>`;
  $$('#ouvSeg button').forEach(b => b.onclick = () => { colOuv = b.dataset.c; pageOuvertures(view); });
  brancherOuvertures(view);
}

// ---------- Statistiques ----------
function pageStats(view) {
  const list = partiesCompletes();
  let h = `<div class="page-head"><div><h1>Statistiques</h1><p>Calculées sur ${pluriel(list.length, 'partie entièrement analysée', 'parties entièrement analysées')}.</p></div></div>`;
  if (!list.length) { view.innerHTML = h + `<div class="card"><div class="empty">${ico('stats')}<h3>Pas encore de statistiques</h3><p>Elles apparaissent dès qu'une partie est entièrement analysée par Stockfish.</p><button class="btn primary" data-route="import">${ico('analyser')}Analyser une partie</button></div></div>`; return; }
  const tot = { meilleur: 0, excellent: 0, bon: 0, imprecision: 0, erreur: 0, gaffe: 0 };
  list.forEach(({ D }) => { for (const k in tot) tot[k] += D.counts[D.me][k]; });
  const n = Object.values(tot).reduce((a, b) => a + b, 0) || 1;
  const { mot, phMoy } = agregats(list);
  const parCol = c => { const l = list.filter(x => x.D.me === c), r = l.filter(x => x.D.resultat !== 'inconnu'); return { n: l.length, prec: moyenne(l.map(x => x.D.prec[c]).filter(v => v !== null)), win: r.length ? 100 * r.filter(x => x.D.resultat === 'victoire').length / r.length : null }; };
  const cad = {};
  list.forEach(({ D }) => { const k = D.cadence.type || 'Inconnue'; const o = cad[k] || (cad[k] = { n: 0, v: 0, r: 0, p: [] }); o.n++; if (D.resultat !== 'inconnu') o.r++; if (D.resultat === 'victoire') o.v++; if (D.prec[D.me] !== null) o.p.push(D.prec[D.me]); });
  const W = parCol('w'), B = parCol('b'), maxMot = Math.max(1, ...Object.values(mot));
  const colorBar = { meilleur: 'var(--c-meilleur)', excellent: 'var(--c-excellent)', bon: 'var(--c-bon)', imprecision: 'var(--c-imprecision)', erreur: 'var(--c-erreur)', gaffe: 'var(--c-gaffe)' };
  h += `<div class="rep-grid">
    <section class="card span-6"><div class="card-h"><h2>Avec les Blancs et avec les Noirs</h2></div><div class="card-b"><table class="dist"><thead><tr><th></th><th>Blancs</th><th>Noirs</th></tr></thead><tbody>
      <tr><th>Parties</th><td>${W.n}</td><td>${B.n}</td></tr><tr><th>Précision moyenne</th><td>${pct(W.prec)}</td><td>${pct(B.prec)}</td></tr><tr><th>Taux de victoire</th><td>${pct(W.win)}</td><td>${pct(B.win)}</td></tr></tbody></table></div></section>
    <section class="card span-6"><div class="card-h"><h2>Précision par phase</h2><span class="tipq" tabindex="0" data-tip="Ouverture : 10 premiers coups. Finale : peu de pièces sur l'échiquier. Le reste est le milieu de partie.">?</span></div><div class="card-b bars">
      ${['ouverture', 'milieu', 'finale'].map(k => `<div class="hbar"><span>${k === 'milieu' ? 'Milieu de partie' : k[0].toUpperCase() + k.slice(1)}</span><span class="track"><i style="width:${phMoy[k] ?? 0}%;background:var(--accent)"></i></span><span class="val">${pct(phMoy[k])}</span></div>`).join('')}</div></section>
    <section class="card span-6"><div class="card-h"><h2>Répartition de tes coups</h2><span class="faint" style="font-size:12.5px">${pluriel(n, 'coup')}</span></div><div class="card-b bars">
      ${Object.keys(tot).map(k => `<div class="hbar"><span>${badge(k)} ${CLASSES[k].court}</span><span class="track"><i style="width:${tot[k] / n * 100}%;background:${colorBar[k]}"></i></span><span class="val">${pct(tot[k] / n * 100)}</span></div>`).join('')}</div></section>
    <section class="card span-6"><div class="card-h"><h2>Tes erreurs par motif</h2><span class="tag tag-moteur">${ico('moteur')}Moteur</span></div><div class="card-b bars">
      ${Object.keys(mot).map(k => `<div class="hbar" style="grid-template-columns:minmax(0,190px) minmax(0,1fr) 40px"><span class="ellip">${MOTIFS[k].titre}</span><span class="track"><i style="width:${mot[k] / maxMot * 100}%"></i></span><span class="val">${mot[k]}</span></div>`).join('')}</div></section>
    <section class="card span-12"><div class="card-h"><h2>Par cadence</h2></div><div class="card-b"><table class="dist"><thead><tr><th>Cadence</th><th>Parties</th><th>Victoires</th><th>Précision</th></tr></thead><tbody>
      ${Object.entries(cad).map(([k, o]) => `<tr><th>${esc(k)}</th><td>${o.n}</td><td>${o.r ? pct(100 * o.v / o.r) : '–'}</td><td>${pct(moyenne(o.p))}</td></tr>`).join('')}</tbody></table></div></section>
  </div>`;
  view.innerHTML = h;
}

// ---------- Entraînement : tes propres positions ratées ----------
const TR = { filtre: 'tous', cur: null, board: null, etat: 'jeu', essais: 0, hint: false };
const FILTRES_TR = [['tous', 'Tous'], ['visible', 'À ma portée'], ['en_prise', 'Pièces en prise'], ['tactique', 'Gains ratés'], ['double', 'Échecs doubles'], ['manquee', 'Punitions ratées']];

function exercices() {
  const out = [];
  for (const { g, D } of partiesCompletes()) {
    D.erreurs.filter(e => e.tag !== 'imprecision').forEach(e => out.push({ key: g.id + ':' + e.i, g, D, i: e.i, motifs: e.motifs, tag: e.tag, visible: e.visible }));
    D.manquees.forEach(m => out.push({ key: g.id + ':' + m.j, g, D, i: m.j, motifs: ['manquee'], tag: D.tags[m.j], visible: m.visible }));
  }
  const seen = new Set();
  return out.filter(x => !seen.has(x.key) && seen.add(x.key) && x.g.evals[x.i] && x.g.evals[x.i].pv.length);
}

  const x = TR.cur, D = x.D, fen = D.P.fens[x.i], trait = fen.split(' ')[1] === 'w' ? 'Blancs' : 'Noirs';

      <div class="card-b" style="display:grid;gap:12px">
        <p><b>À toi de jouer, les ${trait} ont le trait.</b> Contre ${esc(D.nom(D.opp))}, ${fmtDate(D.date)}, coup ${Math.floor(x.i / 2) + 1}.</p>

        <div class="filters">${x.motifs.filter(m => MOTIFS[m]).map(m => `<span class="tag">${MOTIFS[m].titre}</span>`).join('')}</div>
