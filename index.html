    doc.setFont('helvetica', 'normal'); doc.setTextColor(...NOIR); doc.setFontSize(10);
    doc.text(pdfTxt(CLASSES[t].nom), M + 6, y + 4); doc.text(String(D.counts.w[t]), M + 110, y + 4, { align: 'right' }); doc.text(String(D.counts.b[t]), M + 140, y + 4, { align: 'right' });
    if (ph[k]) { doc.setTextColor(...GRIS); doc.text(pdfTxt(`${ph[k][0]} : ${pct(D.phasePrec.w[ph[k][1]])} / ${pct(D.phasePrec.b[ph[k][1]])}`), M + 150, y + 4); }
    y += 6.5;
  });
  y += 4;

  // Courbe d'avantage
  titre("Advantage over time");
  place(44);
  const gx = M, gy = y, gw = CW, gh = 38, n = g.evals.length;
  doc.setFillColor(247, 245, 241); doc.rect(gx, gy, gw, gh, 'B');
  doc.setDrawColor(210, 204, 193); doc.setLineWidth(0.2); doc.line(gx, gy + gh / 2, gx + gw, gy + gh / 2);
  const px = i => gx + (n > 1 ? i / (n - 1) : 0) * gw, py = e => gy + gh / 2 - chances(e.cp) * (gh / 2 - 1);
  doc.setDrawColor(...NOIR); doc.setLineWidth(0.5);
  for (let i = 1; i < n; i++) if (g.evals[i] && g.evals[i - 1]) doc.line(px(i - 1), py(g.evals[i - 1]), px(i), py(g.evals[i]));
  D.erreurs.forEach(e => { if (g.evals[e.i + 1] && e.tag !== 'imprecision') { doc.setFillColor(...COUL[e.tag]); doc.circle(px(e.i + 1), py(g.evals[e.i + 1]), 0.9, 'B'); } });
  doc.setFontSize(7.5); doc.setTextColor(...GRIS); doc.text('White', gx + 1.5, gy + 4); doc.text('Black', gx + 1.5, gy + gh - 1.5);
  y += gh + 7;

  // Synthèse
  titre("Key takeaways");
  para(syntheseMoteur(D, g), { gap: 3 });
  const pr = g.prof;
  if (pr && pr.resume) { para('Coach\'s summary (AI)', { bold: true, size: 10, gap: 1 }); para(pr.resume, { gap: 2 }); (pr.lecons || []).forEach((l, k) => para(`${k + 1}. ${l}`, { indent: 3, gap: 1 })); y += 2; }

  // Erreurs coûteuses avec échiquiers
  const pires = [...D.erreurs].sort((a, b) => b.delta - a.delta).slice(0, 3).sort((a, b) => a.i - b.i);
  if (pires.length) {
    nouvellePage();
    titre(`Your ${pires.length > 1 ? pires.length + ' most costly mistakes' : 'most costly mistake'}`);
    for (const e of pires) {
      const fen = D.P.fens[e.i], mv = D.P.moves[e.i], ev = g.evals[e.i], best = ev && ev.pv[0] !== mv.uci ? ev.pv[0] : null;
      let img = null;
      try { img = await svgEnPng(plateauSVG(fen, D.me, [[mv.uci, 'rgba(229,72,66,.88)'], [best, 'rgba(46,146,232,.9)']], mv.uci), 480, 480); } catch { }
      place(74);
      const top = y, bs = 66;
      if (img) doc.addImage(img, 'PNG', M, top, bs, bs);
      const tx = M + bs + 6, tw = CW - bs - 6;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...NOIR); doc.text(pdfTxt(libCoup(fen, mv.uci)), tx, top + 5);
      doc.setFontSize(9); doc.setTextColor(...COUL[e.tag]); doc.text(pdfTxt(`${CLASSES[e.tag].nom} · -${Math.round(e.delta * 50)} % winning chances`), tx, top + 10.5);
      let yy = top + 16;
      const bloc = (t, opt = {}) => { doc.setFont('helvetica', opt.bold ? 'bold' : 'normal'); doc.setFontSize(opt.size || 9); doc.setTextColor(...(opt.color || NOIR)); for (const l of doc.splitTextToSize(pdfTxt(t), tw)) { if (yy > top + bs + 4) break; doc.text(l, tx, yy); yy += (opt.size || 9) * 0.42; } yy += 1.5; };
      if (best) { const b = lisible(fen, best); bloc(`Best move: ${b.san} (${b.sens})`, { bold: true, color: [30, 120, 210] }); }
      bloc(explicationMoteur(e.i), { color: GRIS });
      const cm = pr && pr.comments[e.i + 1];
      if (cm) { bloc(`The coach: ${cm.c}`); if (cm.k) bloc(`Tip: ${cm.k}`, { bold: true, color: [46, 139, 95] }); }
      y = top + bs + 8;
    }
  }

  // Conseils du prof
  const conseils = pr ? Object.entries(pr.comments || {}).filter(([, c]) => c.k).sort((a, b) => a[0] - b[0]) : [];
  if (conseils.length) {
    titre('The coach\'s tips (AI)');
    conseils.slice(0, 20).forEach(([ply, c]) => { const i = +ply - 1; para(`${libCoup(D.P.fens[i], D.P.moves[i].uci)} : ${c.k}`, { size: 9.5, gap: 1.5 }); });
  }

  // Partie complète
  titre('The game');
  const coups = D.P.moves.map((m, i) => `${m.color === 'w' ? Math.floor(i / 2) + 1 + '. ' : ''}${lisible(D.P.fens[i], m.uci).san}${{ gaffe: '??', erreur: '?', imprecision: '?!' }[D.tags[i]] || ''}`).join(' ');
  para(coups, { size: 9.5, gap: 2 });
  para('Legend: ?? blunder, ? mistake, ?! inaccuracy. Evaluations calculated by Stockfish 10; comments marked AI written by Claude (Anthropic).', { size: 8, color: GRIS });
  pied();

  const nom = `blundercheck-${pdfTxt(D.nom('w')).replace(/\W+/g, '')}-${pdfTxt(D.nom('b')).replace(/\W+/g, '')}.pdf`.toLowerCase();
  const ok = await telecharger(nom, doc.output('blob'));
  if (ok) toast('PDF report ready.');
}

// ---------- Bilan de la période, en images verticales 9:16 (TikTok, Reels, stories) ----------
const BL = { periode: '7', idx: 0, imgs: [] };
const PERIODES = [['7', 'Last 7 days'], ['30', 'Last 30 days'], ['tout', 'All time']];

function donneesBilan() {
  const lim = BL.periode === 'tout' ? 0 : Date.now() - (+BL.periode) * 864e5;
  const list = partiesCompletes().filter(({ g, D }) => (D.date || g.addedAt) >= lim);
  if (!list.length) return null;
  const precs = list.map(x => x.D.prec[x.D.me]).filter(v => v !== null);
  const res = { victoire: 0, nulle: 0, defaite: 0 };
  list.forEach(x => { if (res[x.D.resultat] !== undefined) res[x.D.resultat]++; });
  let pire = null, top = null, bestGame = null;
  for (const x of list) {
    const errs = x.D.erreurs.filter(e => e.tag !== 'imprecision');
    const pool = errs.some(e => e.visible) ? errs.filter(e => e.visible) : errs;
    for (const e of pool) if (!pire || e.delta > pire.e.delta) pire = { ...x, e };
    // meilleur coup : la punition la plus forte d'une erreur adverse, sinon un coup « meilleur » décisif
    x.D.P.moves.forEach((m, i) => {
      if (m.color !== x.D.me || !i) return;
      const t = x.D.tags[i], prev = x.D.tags[i - 1];
      if (['meilleur', 'excellent'].includes(t) && MAUVAIS.includes(prev) && prev !== 'imprecision') {
        const gain = x.D.deltas[i - 1];
        if (!top || gain > top.gain) top = { ...x, i, gain };
      }
    });
    const p = x.D.prec[x.D.me];
    if (p !== null && (!bestGame || p > bestGame.p)) bestGame = { ...x, p };
  }
  const mot = agregats(list).mot, topMot = Object.entries(mot).sort((a, b) => b[1] - a[1])[0];
  const ouv = {}; list.forEach(x => { ouv[x.D.ouverture.nom] = (ouv[x.D.ouverture.nom] || 0) + 1; });
  const ouvTop = Object.entries(ouv).sort((a, b) => b[1] - a[1])[0];
  const erreursVis = list.reduce((n, x) => n + x.D.erreurs.filter(e => e.visible && e.tag !== 'imprecision').length, 0);
  return { list, n: list.length, prec: precs.length ? moyenne(precs) : null, res, pire, top, bestGame, topMot: topMot && topMot[1] ? topMot : null, ouvTop, erreursVis, serie: serieJours().n };
}

const gros = (y, txt, size = 150, fill = C.fg) => `<text x="${BW / 2}" y="${y}" ${FN} font-size="${size}" font-weight="800" fill="${fill}" text-anchor="middle">${esc(txt)}</text>`;
const ligne = (y, txt, size = 44, fill = C.fg2, w = 400) => `<text x="${BW / 2}" y="${y}" ${FN} font-size="${size}" font-weight="${w}" fill="${fill}" text-anchor="middle">${esc(txt)}</text>`;
const echiquierBilan = (y, fen, orient, fleches, marque) => `<g transform="translate(${(BW - 840) / 2},${y}) scale(1.75)">${plateauCorps(fen, orient, fleches, marque)}</g>`;

function imagesBilan(d) {
  const slides = [];

    ${gros(900, String(d.n), 340, C.acc)}${ligne(990, d.n > 1 ? 'games analyzed' : 'game analyzed', 52)}

    <g ${FN} font-size="34" fill="${C.fg2}" text-anchor="middle"><text x="${BW / 2 - 300}" y="1315">wins</text><text x="${BW / 2}" y="1315">draws</text><text x="${BW / 2 + 300}" y="1315">losses</text></g>
    ${d.serie ? ligne(1520, `Current streak: ${d.serie} day${d.serie > 1 ? 's' : ''} of training`, 40, C.acc, 600) : ''}`, k, t));
  slides.push((k, t) => cadreBilan(`${ligne(560, 'My average accuracy', 60, C.fg, 700)}
    ${gros(930, d.prec === null ? '–' : pct(d.prec), 300, C.acc)}
    ${d.bestGame ? `${ligne(1150, 'My best game', 44, C.fg2)}${ligne(1225, `${pct(d.bestGame.p)} against ${d.bestGame.D.nom(d.bestGame.D.opp)}`, 52, C.fg, 700)}` : ''}
    ${d.ouvTop ? `${ligne(1420, 'My favorite opening', 44, C.fg2)}${ligne(1495, d.ouvTop[0].length > 34 ? d.ouvTop[0].slice(0, 33) + '…' : d.ouvTop[0], 48, C.fg, 700)}` : ''}`, k, t));
  if (d.pire) {
    const { D, g, e } = d.pire, fen = D.P.fens[e.i], mv = D.P.moves[e.i], best = g.evals[e.i] && g.evals[e.i].pv[0];
    const b = best && best !== mv.uci ? lisible(fen, best) : null;
    slides.push((k, t) => cadreBilan(`${ligne(360, 'My worst blunder 😭', 70, C.gaffe, 800)}
      ${ligne(450, `${libCoup(fen, mv.uci)} against ${D.nom(D.opp)}`, 44, C.fg, 600)}
      ${echiquierBilan(520, fen, D.me, [[mv.uci, 'rgba(229,72,66,.9)'], [best !== mv.uci ? best : null, 'rgba(64,156,226,.92)']], mv.uci)}
      ${b ? ligne(1480, `You needed ${b.san}`, 56, C.bon, 700) + ligne(1550, b.sens, 38) : ''}`, k, t));
  }
  if (d.top) {
    const { D, i } = d.top, fen = D.P.fens[i], mv = D.P.moves[i];
    slides.push((k, t) => cadreBilan(`${ligne(360, 'My best move 🔥', 70, C.bon, 800)}
      ${ligne(450, `${libCoup(fen, mv.uci)} against ${D.nom(D.opp)}`, 44, C.fg, 600)}
      ${echiquierBilan(520, fen, D.me, [[mv.uci, 'rgba(93,187,138,.92)']], D.P.moves[i - 1].uci)}
      ${ligne(1480, 'My opponent had just made a mistake,', 44, C.fg2)}${ligne(1540, "and I found the best move.", 44, C.fg2)}`, k, t));
  }
  slides.push((k, t) => cadreBilan(`${ligne(560, 'To work on', 76, C.fg, 800)}
    ${d.topMot ? `${ligne(800, MOTIFS[d.topMot[0]].titre, 58, C.acc, 700)}${ligne(880, `${d.topMot[1]} times out of ${d.n} game${d.n > 1 ? 's' : ''}`, 42)}` : ligne(800, 'Nothing recurring, well done!', 58, C.acc, 700)}
    ${ligne(1100, `${d.erreursVis} mistake${d.erreursVis > 1 ? 's were' : ' was'} visible at a glance`, 42)}
    ${ligne(1300, 'What about you, how many blunders do you make?', 54, C.fg, 700)}`, k, t));
  const total = slides.length;
  return slides.map((f, k) => f(k, slides.length));
}

// ---------- Mode Rush : tes erreurs en puzzles chronométrés (3 minutes, 3 vies) ----------
const K_RUSH = 'coupjuste-rush-v1';
const RS = { etat: 'accueil', score: 0, vies: 3, fin: 0, pool: [], k: 0, board: null, tick: null, bloque: false, record: lire(K_RUSH, { best: 0, parties: 0 }) };
const RUSH_MS = 180000;

function melanger(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function pageRush(view) {
  clearInterval(RS.tick);
  const all = exercices();
  if (RS.etat === 'jeu') RS.etat = 'accueil';
  if (all.length < 3) {
    view.innerHTML = `${enteteRush()}<div class="card"><div class="empty">${ico('entrainement')}<h3>Not enough puzzles yet</h3><p>Rush uses your own mistakes. Analyze a few more games (at least 3 missed positions are needed) to unlock it.</p><button class="btn primary" data-route="import">${ico('analyser')}Import my games</button></div></div>`;
    return;
  }
  if (RS.etat === 'fin') return finRush(view);
  view.innerHTML = `${enteteRush()}
  <section class="card rush-intro">
    <div class="rush-big">${ico('flame')}</div>
    <h2>3 minutes. 3 lives. Your own mistakes.</h2>
    <p class="muted">Each position comes from one of your games. Find the best move as fast as possible. A good move scores a point, a mistake costs a life.</p>
    <div class="rush-stats"><div><span class="v">${RS.record.best}</span><span>your record</span></div><div><span class="v">${all.length}</span><span>positions available</span></div><div><span class="v">${RS.record.parties}</span><span>rushes played</span></div></div>
    <button class="btn primary lg" id="rsGo">${ico('flame')}Start the Rush</button>
  </section>`;
  $('#rsGo').onclick = () => demarrerRush(view);
}
const enteteRush = () => `<div class="page-head"><div><h1>Rush</h1><p>The fastest way to stop repeating the same blunders.</p></div><button class="btn" data-route="entrainement">${ico('entrainement')}Classic training</button></div>`;

function demarrerRush(view) {
  const all = exercices(), vis = melanger(all.filter(x => x.visible)), dur = melanger(all.filter(x => !x.visible));
  Object.assign(RS, { etat: 'jeu', score: 0, vies: 3, fin: Date.now() + RUSH_MS, pool: [...vis, ...dur], k: 0, bloque: false, rates: [] });
  view.innerHTML = `${enteteRush()}<div class="rush-grid">
    <div class="train-board"><svg class="board-svg" id="rsBoard" role="img" aria-label="Rush board"></svg></div>
    <section class="card rush-side">
      <div class="rush-timer mono" id="rsTime">3:00</div>
      <div class="rush-bar"><i id="rsBar"></i></div>
      <div class="rush-row"><div><span class="eyebrow">Score</span><span class="rush-score mono" id="rsScore">0</span></div><div><span class="eyebrow">Lives</span><span class="rush-vies" id="rsVies"></span></div></div>
      <p id="rsTrait" class="muted"></p>
      <div id="rsFb" class="rush-fb"></div>
      <button class="btn ghost sm" id="rsStop" style="justify-self:start">${ico('stop')}Give up</button>
    </section></div>`;
  RS.board = creerEchiquier($('#rsBoard'), { onMove: essaiRush });
  $('#rsStop').onclick = () => terminerRush(view);
  RS.tick = setInterval(() => {
    if (ROUTE !== 'rush') { clearInterval(RS.tick); RS.etat = 'accueil'; return; }
    const r = Math.max(0, RS.fin - Date.now());
    const t = $('#rsTime'); if (t) { t.textContent = `${Math.floor(r / 60000)}:${String(Math.floor(r / 1000) % 60).padStart(2, '0')}`; t.classList.toggle('urgent', r < 20000); }
    const b = $('#rsBar'); if (b) b.style.width = (r / RUSH_MS * 100) + '%';
    if (!r) terminerRush(view);
  }, 200);
  puzzleRush();
}
function puzzleRush() {
  const x = RS.pool[RS.k % RS.pool.length], fen = x.D.P.fens[x.i];
  RS.cur = x; RS.bloque = false;
  $('#rsVies').innerHTML = [0, 1, 2].map(k => `<i class="${k < RS.vies ? 'on' : ''}"></i>`).join('');
  $('#rsScore').textContent = RS.score;
  $('#rsTrait').innerHTML = `<b>${fen.split(' ')[1] === 'w' ? 'White' : 'Black'} to move.</b> ${x.motifs.includes('manquee') ? 'Punish the opponent\'s mistake.' : 'Find better than in your game.'}`;

// ---------- Entraînement d'ouvertures : tes propres lignes, corrigées là où tu t'es trompé ----------
const K_REP = 'coupjuste-repertoire-v1';
const RP = { cle: null, p: 0, fautes: 0, board: null, etat: 'jeu', suivi: lire(K_REP, {}), filtre: 'tous' };
const REP_MAX = 16;

function lignesOuverture() {
  const vues = new Map();
  for (const { g, D } of partiesCompletes()) {
    const seq = [];
    let fixe = false;
    for (let i = 0; i < Math.min(D.P.moves.length, REP_MAX); i++) {
      const mv = D.P.moves[i];
      if (mv.color !== D.me) { seq.push({ i, uci: mv.uci, moi: false }); continue; }
      const ev = g.evals[i];
      if (MAUVAIS.includes(D.tags[i]) && ev && ev.pv[0]) { seq.push({ i, uci: ev.pv[0], moi: true, fix: mv.uci, tag: D.tags[i] }); fixe = true; break; }
      seq.push({ i, uci: mv.uci, moi: true });
    }
    if (seq.filter(s => s.moi).length < 2) continue;
    const cle = D.me + ':' + seq.map(s => s.uci).join(' ');
    if (vues.has(cle)) { vues.get(cle).n++; continue; }
    vues.set(cle, { cle, g, D, seq, fixe, n: 1, nom: D.ouverture.nom, eco: D.ouverture.eco, color: D.me });
  }
  return [...vues.values()];
}
function statutLigne(l) {
  const s = RP.suivi[l.cle] || { ok: 0 };
  if (s.ok >= 3) return { k: 'ok', txt: 'Mastered' };
  if (l.fixe && !s.ok) return { k: 'fix', txt: 'To fix' };
  return { k: 'rev', txt: s.ok ? `Passed ${s.ok} times` : 'To learn' };
}

  const ordre = { fix: 0, rev: 1, ok: 2 };

      ${nFix ? `<p class="faint" style="font-size:12.5px;padding:0 16px 8px">${nFix} line${nFix > 1 ? 's' : ''} contain${nFix > 1 ? '' : 't'} a mistake to fix.</p>` : ''}

    </section>
    <div class="train-board"><svg class="board-svg" id="rpBoard" role="img" aria-label="Opening training board"></svg></div>
    <section class="card rush-side"><div><span class="eyebrow">${l.eco ? esc(l.eco) + ' · ' : ''}With ${l.color === 'w' ? 'White' : 'Black'}</span><h2 style="font-size:18px;margin-top:4px">${esc(l.nom)}</h2></div>
      <div class="rep-prog"><i id="rpBar"></i></div>

      <button class="btn ghost sm" id="rpOpen" style="justify-self:start">${ico('board')}See the original game</button>
    </section></div>`;
  $$('#rpSeg button').forEach(b => b.onclick = () => { RP.filtre = b.dataset.c; RP.cle = null; pageRepertoire(view); });
  $$('[data-l]', view).forEach(b => b.onclick = () => { RP.cle = b.dataset.l; pageRepertoire(view); });
  $('#rpRe').onclick = () => lancerLigne(l);

  $('#rpOpen').onclick = () => ouvrirAnalyse(l.g.id, 0);
  $('#rpHint').onclick = () => { const s = l.seq[RP.p]; if (s && s.moi && RP.etat === 'jeu') { RP.fautes++; RP.board.set({ hint: s.uci.slice(0, 2) }); } };
  RP.board = creerEchiquier($('#rpBoard'), { onMove: uci => essaiLigne(l, uci) });
  lancerLigne(l);
}
function fenLigne(l, p) { return l.D.P.fens[l.seq[0].i + p] || l.D.P.fens[0]; }
function lancerLigne(l) {
  RP.p = 0; RP.fautes = 0; RP.etat = 'jeu';
  RP.board.set({ fen: l.D.P.fens[0], orient: l.color, last: null, arrows: [], hint: null, interactive: false });
  $('#rpFb').innerHTML = `<p class="muted">Play the moves of your line. Your opponent's moves are played automatically.</p>`;

}
function avancerLigne(l) {

  if (RP.p >= l.seq.length) return finLigne(l);
  const s = l.seq[RP.p], fen = fenLigne(l, RP.p);

    return;
  }
  RP.etat = 'jeu';
  RP.board.set({ fen, interactive: true, arrows: [], hint: null });
}
function essaiLigne(l, uci) {
  if (RP.etat !== 'jeu') return;
  const s = l.seq[RP.p], fen = fenLigne(l, RP.p);
  if (uci.slice(0, 4) === s.uci.slice(0, 4)) {
    const g = new Chess(fen); jouer(g, s.uci);
    RP.board.set({ fen: g.fen(), last: [s.uci.slice(0, 2), s.uci.slice(2, 4)], interactive: false, hint: null });
    if (s.fix) $('#rpFb').innerHTML = `<div class="feedback ok"><b>${ico('check')}That's it!</b><p>In your game, you had played <span class="mv">${esc(lisible(fen, s.fix).san)}</span> (${CLASSES[s.tag].nom.toLowerCase()}). Remember this instead: <span class="mv">${esc(lisible(fen, s.uci).san)}</span>.</p></div>`;
    else $('#rpFb').innerHTML = `<div class="feedback ok"><b>${ico('check')}${esc(lisible(fen, s.uci).san)}</b></div>`;
    RP.p++; setTimeout(() => avancerLigne(l), 250);
    return;
  }
  RP.fautes++; RP.etat = 'rate';
  const b = lisible(fen, s.uci);
  RP.board.set({ fen, arrows: [{ uci: s.uci, cls: 'best' }], interactive: false });
  $('#rpFb').innerHTML = `<div class="feedback ko"><b>That's not your line.</b><p>Here, you need to play <span class="mv">${esc(b.san)}</span>${s.fix ? ` : it fixes your mistake from the game` : ''}. Play it again.</p></div>`;
  setTimeout(() => { if (RP.etat === 'rate' && RP.cle === l.cle) { RP.etat = 'jeu'; RP.board.set({ fen, arrows: [{ uci: s.uci, cls: 'best' }], interactive: true }); } }, 900);
}
function finLigne(l) {
  RP.etat = 'fin';
  const s = RP.suivi[l.cle] || { ok: 0, essais: 0 };
  s.essais = (s.essais || 0) + 1; s.last = Date.now();
  if (!RP.fautes) s.ok = (s.ok || 0) + 1;
  RP.suivi[l.cle] = s; ecrire(K_REP, RP.suivi);
  if (!RP.fautes) noterJour();
  $('#rpFb').innerHTML = RP.fautes
    ? `<div class="feedback"><b>Line finished with ${pluriel(RP.fautes, 'mistake')}.</b><p>Do it again without a mistake for it to count as passed.</p></div>`
    : `<div class="feedback ok"><b>Flawless! 🎯</b><p>${s.ok >= 3 ? 'Line mastered: passed 3 times.' : `Passed ${s.ok} times out of 3 to master it.`}</p></div>`;
  $$('.rep-row.on .rep-st').forEach(e => { const st = statutLigne(l); e.textContent = st.txt; e.className = 'rep-st st-' + st.k; });
}

// ---------- Version hébergée (blundercheck.app) : le prof passe par /api/prof ----------
// Utilisé seulement quand la page ne tourne pas dans claude.ai (pas de window.claude).
function webSample() {
  const fusion = msgs => msgs.reduce((acc, m) => {
    const last = acc[acc.length - 1];
    if (last && last.role === m.role) last.content += '\n\n' + m.content; else acc.push({ role: m.role, content: String(m.content) });
    return acc;
  }, []);
  async function appel(input, opts = {}) {
    const messages = fusion(typeof input === 'string' ? [{ role: 'user', content: input }] : input);
    let r;
    try {
      r = await fetch('/api/prof', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ messages, max_tokens: opts.maxTokens || 4096 }), signal: opts.signal });
    } catch (e) { throw (e && e.name === 'AbortError') ? { code: 'cancelled' } : { code: 'network', message: 'Couldn\'t connect to the coach.' }; }
    if (!r.ok) {
      let msg = 'The coach is unavailable right now.';
      try { const j = await r.json(); if (j && j.error) msg = j.error; } catch { }
      throw { code: r.status === 429 ? 'quota' : 'server', message: msg };
    }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '', text = '';
    try {
      for (;;) {
        const { value, done } = await rd.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n'); buf = parts.pop();
        for (const l of parts) {
          if (!l.startsWith('data:')) continue;
          let ev; try { ev = JSON.parse(l.slice(5)); } catch { continue; }
          if (ev.type === 'content_block_delta' && ev.delta && ev.delta.type === 'text_delta') {
            text += ev.delta.text;
            if (opts.onText) opts.onText({ delta: ev.delta.text, text });
          } else if (ev.type === 'error') throw { code: 'server', message: 'The coach ran into an error.', text };
        }
      }
    } catch (e) {
      if (e && e.name === 'AbortError') throw { code: 'cancelled', text };
      throw e && e.code ? e : { code: 'network', message: 'The connection to the coach was cut.', text };
    }
    return { text };
  }
  appel.json = async (prompt, opts = {}) => {
    const { text } = await appel(prompt, opts);
    const m = text.match(/\{[\s\S]*\}/);
    if (!m) throw { code: 'invalid_json' };
    try { return JSON.parse(m[0]); } catch { throw { code: 'invalid_json' }; }
  };
  return appel;
}

function carteSVG(D, g, i) {
  const W = 1080, H = 1350, B = 880, X0 = 100, Y0 = 300, c = B / 8;
  const fen = D.P.fens[i], mv = D.P.moves[i], ev0 = g.evals[i], ev1 = g.evals[i + 1];

  const cs = getComputedStyle(document.documentElement), SQ = { l: cs.getPropertyValue('--sq-l').trim() || '#ECE5D2', d: cs.getPropertyValue('--sq-d').trim() || '#4F7363' };
  let s = '';
  for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
    const [x, y] = xy(String.fromCharCode(97 + f) + (r + 1));
    s += `<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="${(f + r) % 2 === 0 ? SQ.d : SQ.l}"/>`;
  }
  const hl = (sq, fill) => { const [x, y] = xy(sq); s += `<rect x="${x}" y="${y}" width="${c}" height="${c}" fill="${fill}"/>`; };
  hl(mv.uci.slice(0, 2), 'rgba(214,178,98,.55)'); hl(mv.uci.slice(2, 4), 'rgba(214,178,98,.55)');
  fen.split(' ')[0].split('/').forEach((row, ri) => {

      s += `<use href="#${cl}${ch.toLowerCase()}" transform="translate(${x},${y}) scale(${c / 40})"/>`;

    x1 += c / 2; y1 += c / 2; x2 += c / 2; y2 += c / 2;
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); if (!L) return '';
    const ux = dx / L, uy = dy / L, nx = -uy, ny = ux, w = 10, hw = 26, hl = 36;
    const tx = x2 - ux * 10, ty = y2 - uy * 10, bx = tx - ux * hl, by = ty - uy * hl, sx = x1 + ux * 18, sy = y1 + uy * 18;
    const p = [[sx + nx * w, sy + ny * w], [bx + nx * w, by + ny * w], [bx + nx * hw, by + ny * hw], [tx, ty], [bx - nx * hw, by - ny * hw], [bx - nx * w, by - ny * w], [sx - nx * w, sy - ny * w]];
    return `<polygon points="${p.map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="${fill}"/>`;
  };
  s += fleche(mv.uci, 'rgba(242,85,90,.9)');

  return `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">

  <rect x="${W - X0 - 230}" y="148" width="230" height="64" rx="32" fill="${col}" fill-opacity=".18" stroke="${col}" stroke-width="3"/>
  <text x="${W - X0 - 115}" y="191" ${F} font-size="32" font-weight="700" fill="${col}" text-anchor="middle">${esc(CLASSES[tag] ? CLASSES[tag].court + ' ' + CLASSES[tag].g : '')}</text>

async function svgEnPng(svg, W = 1080, H = 1350) {
  const img = new Image();

  return cv.toDataURL('image/png');
}

const PS = { site: 'chesscom', pseudo: '', n: 10, list: null, etat: '', msg: '' };

async function partiesChessCom(u, n) {
  const r = await fetch(`https://api.chess.com/pub/player/${encodeURIComponent(u.toLowerCase())}/games/archives`);
  if (r.status === 404) throw { msg: `No player “ ${u} ” on Chess.com.` };
  if (!r.ok) throw { msg: 'Chess.com isn\'t responding right now. Try again in a moment.' };
  const arch = ((await r.json()).archives || []).slice(-3).reverse();
  const out = [];
  for (const url of arch) {
    const m = await fetch(url); if (!m.ok) continue;
    const games = ((await m.json()).games || []).filter(x => x.pgn && x.rules === 'chess').sort((a, b) => b.end_time - a.end_time);
    out.push(...games.map(x => x.pgn));
    if (out.length >= n) break;
  }
  return out.slice(0, n);
}
async function partiesLichess(u, n) {
  const r = await fetch(`https://lichess.org/api/games/user/${encodeURIComponent(u)}?max=${n}&moves=true&tags=true&clocks=false&evals=false&opening=false&literate=false`, { headers: { Accept: 'application/x-chess-pgn' } });
  if (r.status === 404) throw { msg: `No player “ ${u} ” on Lichess.` };
  if (r.status === 429) throw { msg: 'Lichess is limiting requests: try again in a minute.' };
  if (!r.ok) throw { msg: 'Lichess isn\'t responding right now. Try again in a moment.' };
  return decouperPgn(await r.text()).slice(0, n);
}

// ---- dessin ----
function texteMulti(ctx, txt, x, y, maxW, lh, align = 'center') {
  const mots = String(txt).split(' '); let ligne = '', lignes = [];

  if (ligne) lignes.push(ligne);
  ctx.textAlign = align;

  return lignes.length;
}
function flecheCanvas(ctx, x1, y1, x2, y2, c, w) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy); if (!L) return;

  ctx.fillStyle = c; ctx.globalAlpha = 0.9; ctx.beginPath();

  ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
}
function plateauCanvas(ctx, f, orient, X, Y, S) {
  const c = S / 8, cs = getComputedStyle(document.documentElement);
  const L = cs.getPropertyValue('--sq-l').trim() || '#ECE5D2', Dk = cs.getPropertyValue('--sq-d').trim() || '#4F7363';
  const xy = sq => { const fi = sq.charCodeAt(0) - 97, r = +sq[1] - 1; return orient === 'w' ? [X + fi * c, Y + (7 - r) * c] : [X + (7 - fi) * c, Y + r * c]; };
  for (let r = 0; r < 8; r++) for (let fi = 0; fi < 8; fi++) { const [x, y] = xy(String.fromCharCode(97 + fi) + (r + 1)); ctx.fillStyle = (fi + r) % 2 === 0 ? Dk : L; ctx.fillRect(x, y, c + 0.5, c + 0.5); }
  if (f.last) for (const sq of [f.last.slice(0, 2), f.last.slice(2, 4)]) { const [x, y] = xy(sq); ctx.fillStyle = 'rgba(214,178,98,.5)'; ctx.fillRect(x, y, c, c); }
  const fen = f.anim ? f.anim.fen : f.fen;
  const cache = f.anim ? f.anim.uci.slice(0, 2) : null;
  fen.split(' ')[0].split('/').forEach((row, ri) => {
    let fi = 0;
    for (const ch of row) {

      const sq = String.fromCharCode(97 + fi) + (8 - ri);

        const [x, y] = xy(sq), im = ST.imgs[(ch === ch.toUpperCase() ? 'w' : 'b') + ch.toLowerCase()];

    if (p) {
      const [x1, y1] = xy(f.anim.uci.slice(0, 2)), [x2, y2] = xy(f.anim.uci.slice(2, 4)), e = 1 - Math.pow(1 - f.anim.p, 3);
      const im = ST.imgs[p.color + p.type]; if (im) ctx.drawImage(im, x1 + (x2 - x1) * e, y1 + (y2 - y1) * e - Math.sin(e * Math.PI) * c * 0.25, c, c);

}

// ---- audio : musique + bruitages ----
function audioStudio(actx, sc, t0, sortie) {
  const master = actx.createGain(); master.gain.value = 0.9; master.connect(sortie);
  const bruit = (t, dur, f1, f2, vol) => {
    const len = Math.floor(actx.sampleRate * dur), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for (let k = 0; k < len; k++) d[k] = (Math.random() * 2 - 1) * (1 - k / len);
    const s = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = buf; fl.type = 'bandpass'; fl.frequency.setValueAtTime(f1, t); fl.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(fl).connect(g).connect(master); s.start(t); s.stop(t + dur);
  };
  const ton = (t, f, dur, vol, type = 'sine', f2) => {
    const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
  };
  if (ST.sons) for (const e of sc.sons) {
    const t = t0 + e.t;
    if (e.s === 'whoosh') bruit(t, 0.45, 400, 3000, 0.5);
    if (e.s === 'clac') { bruit(t, 0.06, 1800, 900, 0.9); ton(t, 220, 0.08, 0.3, 'triangle', 120); }
    if (e.s === 'tick') ton(t, 1250, 0.07, 0.35);
    if (e.s === 'buzz') { ton(t, 160, 0.55, 0.32, 'sawtooth', 70); ton(t + 0.02, 155, 0.55, 0.25, 'square', 65); }
    if (e.s === 'ding') { ton(t, 880, 0.5, 0.35); ton(t + 0.09, 1320, 0.6, 0.3); }
    if (e.s === 'boum') { ton(t, 90, 0.7, 0.8, 'sine', 35); bruit(t, 0.3, 300, 80, 0.6); }
  }
  if (ST.musique) {
    const bpm = 112, beat = 60 / bpm, notes = [55, 55, 65.41, 49];
    for (let k = 0; k * beat < sc.duree - 0.3; k++) {
      const t = t0 + k * beat;
      ton(t, 120, 0.18, 0.55, 'sine', 45);
      if (k % 2) bruit(t, 0.05, 8000, 6000, 0.12);
      bruit(t + beat / 2, 0.03, 9000, 7000, 0.06);
      if (k % 4 === 0) ton(t, notes[(k / 4) % 4], beat * 3.8, 0.12, 'triangle');
    }
  }
  return master;
}

// ---- lecture et export ----
async function jouerStudio(enregistrer) {
  const sc = scenario(), cv = $('#stCanvas');

  await piecesStudio(); try { await document.fonts.ready; } catch { }
  const ctx = cv.getContext('2d');
  const actx = new (window.AudioContext || window.webkitAudioContext)();
  const dest = enregistrer ? actx.createMediaStreamDestination() : null;
  const mix = actx.createGain(); mix.connect(actx.destination); if (dest) mix.connect(dest);
  const t0 = actx.currentTime + 0.15;
  audioStudio(actx, sc, t0, mix);
  ST.enCours = true; majBoutonsStudio();
  let rec = null, morceaux = [], mime = '';
  if (enregistrer) {
    const flux = cv.captureStream(30);
    dest.stream.getAudioTracks().forEach(tr => flux.addTrack(tr));
    mime = ['video/mp4;codecs="avc1.42E01E, mp4a.40.2"', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || '';
    try { rec = new MediaRecorder(flux, { mimeType: mime || undefined, videoBitsPerSecond: 8e6 }); } catch { toast("Video recording isn't available in this browser.", 'err'); ST.enCours = false; actx.close(); majBoutonsStudio(); return; }
    rec.ondataavailable = e => { if (e.data.size) morceaux.push(e.data); };
    rec.start(250); ST.rec = rec;
  }
  const fin = () => {
    cancelAnimationFrame(ST.raf); ST.enCours = false; ST.rec = null;
    setTimeout(() => actx.close().catch(() => { }), 300);
    if (rec) rec.onstop = async () => {
      const type = (rec.mimeType || mime || 'video/webm').split(';')[0], ext = type.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(morceaux, { type });
      $('#stEtat').textContent = '';
      if (await telecharger(`blundercheck-${ST.modele}.${ext}`, blob)) toast(`Video ready (${ext.toUpperCase()}).`);
    };
    if (rec && rec.state !== 'inactive') rec.stop();
    majBoutonsStudio();
    dessinerStudio(ctx, sc, 1);
  };
  const boucle = () => {
    if (ROUTE !== 'studio') { if (rec && rec.state !== 'inactive') rec.stop(); ST.enCours = false; actx.close().catch(() => { }); return; }
    const t = actx.currentTime - t0;
    dessinerStudio(ctx, sc, Math.max(0, t));
    const e = $('#stEtat'); if (e) e.textContent = `${enregistrer ? 'Recording' : 'Preview'} · ${Math.max(0, Math.ceil(sc.duree - t))} s`;
    if (t >= sc.duree) return fin();
    ST.raf = requestAnimationFrame(boucle);
  };
  ST.raf = requestAnimationFrame(boucle);
}

  const DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  const ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  switch (p.type) {
    case 'p': { const d = p.color === 'w' ? 1 : -1; add(-1, d); add(1, d); break; }
    case 'n': [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]].forEach(([a, b]) => add(a, b)); break;
    case 'k': for (const [a, b] of DIAG.concat(ORTH)) add(a, b); break;
    case 'b': slide(DIAG); break;
    case 'r': slide(ORTH); break;
    case 'q': slide(DIAG.concat(ORTH)); break;
  }
  return out;
}

function attackers(g, color, sq) {
  return ALL_SQ.filter(s => {
    const p = g.get(s);
    return p && p.color === color && attacksFrom(g, s).includes(sq);
  });
}

function materiel(g, c) {
  let t = 0;
  for (const s of ALL_SQ) {
    const p = g.get(s);
    if (p) t += VAL[p.type] * (p.color === c ? 1 : -1);
  }
  return t;
}

function gainMateriel(fen, pv, c, n = 6) {
  const g = new Chess(fen);
  const depart = materiel(g, c);
  for (const u of pv.slice(0, n)) jouer(g, u);
  return materiel(g, c) - depart;
}

function casesEnPrise(g, c) {
  const res = [];
  for (const sq of ALL_SQ) {
    const p = g.get(sq);
    if (!p || p.color !== c || p.type === 'k') continue;
    const att = attackers(g, autre(c), sq);
    if (!att.length) continue;
    const def = attackers(g, c, sq);
    const moinsCher = Math.min(...att.map(a => VAL[g.get(a).type]));
    if (!def.length || moinsCher < VAL[p.type]) res.push(sq);
  }
  return res;
}

function enFr(san) {
  if (!OPT.notationFr || !san) return san;
  let s = EN_VERS_FR[san[0]] ? EN_VERS_FR[san[0]] + san.slice(1) : san;
  return s.replace(/=([QRBN])/, (_, x) => '=' + EN_VERS_FR[x]);
}

/** Coup + sa signification : {san, sens} */
function lisible(fen, uci) {
  const g = new Chess(fen);
  const p = g.get(uci.slice(0, 2));
  const cible = g.get(uci.slice(2, 4));
  const m = jouer(g, uci);
  if (!m) return { san: uci, sens: '' };
  let sens;
  if (m.flags.includes('k')) sens = 'petit roque';
  else if (m.flags.includes('q')) sens = 'grand roque';
  else {
    if (m.captured) sens = `${NOM[p.type]} mange ${cible ? NOM[cible.type] : 'pion'} en ${m.to}`;
    else sens = `${NOM[p.type]} en ${m.to}`;
    if (m.promotion) sens += `, devient ${NOM[m.promotion]}`;
  }
  if (g.in_checkmate()) sens += ', échec et mat';
  else if (g.in_check()) sens += ', échec';
  return { san: enFr(m.san), sens };
}

function numero(fen) {
  const [, turn, , , , full] = fen.split(' ');
  return turn === 'w' ? `${full}.` : `${full}…`;
}

/** Suite de coups, chacun avec sa signification */
function variante(fen, pv, n = 4) {
  const g = new Chess(fen);
  const out = [];
  for (const u of pv.slice(0, n)) {
    const f = g.fen();
    const l = lisible(f, u);
    out.push({ num: numero(f), ...l });
    if (!jouer(g, u)) break;
  }
  return out;
}

/** Petite phrase qui explique le meilleur coup (règles simples, pas d'IA) */
function pourquoi(fen, e, prevFen, prevUci) {
  if (!e || !e.pv.length) return '';
  const coup = e.pv[0], pv = e.pv;
  const board = new Chess(fen);
  const moi = board.turn();
  const from = coup.slice(0, 2), to = coup.slice(2, 4);
  const piece = board.get(from);
  const cibleAvant = board.get(to);
  const apres = new Chess(fen);
  const mv = jouer(apres, coup);
  if (!mv) return '';
  const capture = !!mv.captured;
  const raisons = [];

  if (e.mate !== null && e.mate !== 0 && (e.mate > 0) === (moi === 'w'))
    raisons.push(`mène au mat en ${Math.abs(e.mate)}`);

  // Si l'adversaire vient de prendre, on compte depuis avant sa prise
  let reprise = false;
  let g = gainMateriel(fen, pv, moi);
  if (prevFen && prevUci) {
    const avantLui = new Chess(prevFen);
    const d = jouer(avantLui, prevUci);
    if (d && d.captured) {
      g += materiel(board, moi) - materiel(new Chess(prevFen), moi);
      reprise = to === prevUci.slice(2, 4);
    }
  }
  if (g > 0 && !raisons.length && pv.length >= 2)
    raisons.push(`gagne environ ${g} point${g > 1 ? 's' : ''} de matériel dans la suite`);
  if (capture) {
    const tc = cibleAvant ? cibleAvant.type : 'p';
    if (reprise) raisons.push(`reprend ${le(tc)} (échange)`);
    else if (g === 0 && pv.length > 1) raisons.push(`échange ${ton(piece.type)} contre ${son(tc)}`);
    else raisons.push(`prend ${le(tc)}`);
  }
  if (apres.in_check() && !apres.in_checkmate()) raisons.push('donne échec');
  if (mv.flags.includes('k') || mv.flags.includes('q')) raisons.push("met ton roi à l'abri et active ta tour");

  // Pièces menacées avant le coup, qui ne le sont plus après
  const enPriseApres = casesEnPrise(apres, moi);
  const sauvees = casesEnPrise(board, moi).filter(sq => !enPriseApres.includes(sq === from ? to : sq));
  for (const sq of sauvees.slice(0, 1)) {
    const ty = board.get(sq).type;
    if (sq === from) raisons.push(`met ${ton(ty)} à l'abri (${FEM[ty] ? 'elle était attaquée' : 'il était attaqué'})`);
    else raisons.push(`protège ${ton(ty)} en ${sq}`);
  }

  // Nouvelle menace créée par la pièce jouée
  if (!capture) {
    const viseesAdv = casesEnPrise(apres, autre(moi));
    for (const sq of attacksFrom(apres, to)) {
      const c = apres.get(sq);
      if (c && c.color !== moi && c.type !== 'k' && viseesAdv.includes(sq)) {
        raisons.push(`attaque ${le(c.type)} en ${sq}`);
        break;
      }
    }
  }

  if (!raisons.length) {
    const rangDepart = moi === 'w' ? 0 : 7;
    const centre = ['d4', 'e4', 'd5', 'e5'];
    const fouLibere = () => ALL_SQ.some(sq => {
      const p = board.get(sq);
      return p && p.type === 'b' && p.color === moi &&
        attacksFrom(apres, sq).length >= attacksFrom(board, sq).length + 2;
    });
    const mineur = piece.type === 'n' || piece.type === 'b';
    if (mineur && sqFR(from)[1] === rangDepart) raisons.push('développe une pièce');
    else if (mineur && centre.includes(to)) raisons.push(`installe ${ton(piece.type)} sur une case centrale`);
    else if (piece.type === 'p' && centre.concat(['c4', 'c5']).includes(to)) raisons.push('prend de la place au centre');
    else if (piece.type === 'p' && fouLibere()) raisons.push('ouvre la diagonale de ton fou pour le développer');
    else raisons.push('améliore la position sans rien lâcher');
  }
  return raisons.slice(0, 3).join(', ');
}

/** Pourquoi ton coup est mauvais + ce qu'il fallait jouer */
function expliquer(fenAvant, coup, avant, apres, c) {
  const res = {};
  const g = new Chess(fenAvant);
  jouer(g, coup);
  const fenApres = g.fen();
  res.matContre = apres.mate !== null && apres.mate !== 0 && (apres.mate < 0) === (c === 'w') ? Math.abs(apres.mate) : 0;
  res.pertes = casesEnPrise(g, c).map(sq => `${ton(g.get(sq).type)} en ${sq}`);
  if (apres.pv.length) {
    res.refut = lisible(fenApres, apres.pv[0]);
    res.refutLigne = variante(fenApres, apres.pv);
    const p = gainMateriel(fenApres, apres.pv, c);
    if (p < 0 && !res.matContre) res.perte = -p;
  }
  if (avant.pv.length) {
    res.meilleur = lisible(fenAvant, avant.pv[0]);
    res.meilleurLigne = variante(fenAvant, avant.pv);
    if (avant.mate !== null && avant.mate !== 0 && (avant.mate > 0) === (c === 'w')) res.matPour = Math.abs(avant.mate);
    else {
      const gg = gainMateriel(fenAvant, avant.pv, c);
      if (gg > 0) res.gain = gg;
    }
  }
  return res;
}

// ---------- Classement des coups (échelle de chances de gain, comme Lichess) ----------

const chances = cp => 2 / (1 + Math.exp(-0.00368208 * cp)) - 1;   // -1..1 côté blancs

function tagCoup(uci, color, avant, apres) {
  if (!avant || !apres || apres.cp === null || avant.cp === null) return '';
  if (avant.pv[0] === uci) return 'meilleur';
  const s = color === 'w' ? 1 : -1;
  const delta = s * (chances(avant.cp) - chances(apres.cp));
  if (delta >= 0.3) return 'gaffe';
  if (delta >= 0.2) return 'erreur';
  if (delta >= 0.1) return 'imprecision';
  return delta < 0.03 ? 'excellent' : 'bon';
}

function deltaCoup(color, avant, apres) {
  if (!avant || !apres) return 0;
  return (color === 'w' ? 1 : -1) * (chances(avant.cp) - chances(apres.cp));
}

/** Phase de jeu d'une position : ouverture (10 premiers coups), finale (peu de pièces), sinon milieu */
function phaseDe(fen, ply) {
  const v = { q: 9, r: 5, b: 3, n: 3 };
  let m = 0;
  for (const ch of fen.split(' ')[0]) { const t = ch.toLowerCase(); if (v[t]) m += v[t]; }
  if (m <= 26) return 'finale';
  if (ply < 20) return 'ouverture';
  return 'milieu';
}

function precisionCoup(color, avant, apres) {
  const s = color === 'w' ? 1 : -1;
  const wpA = 50 + 50 * s * chances(avant.cp);
  const wpB = 50 + 50 * s * chances(apres.cp);
  const a = 103.1668 * Math.exp(-0.04354 * Math.max(0, wpA - wpB)) - 3.1669;
  return Math.max(0, Math.min(100, a));
}

// ---------- Lecture du PGN ----------

function decouperPgn(txt) {
  txt = txt.replace(/\r/g, '').trim();
  if (!txt) return [];
  return txt.split(/\n\s*\n(?=\s*\[Event\s)/).map(s => s.trim()).filter(Boolean);
}

const _PARSE = new Map();
function chargerPartie(pgn) {
  if (_PARSE.has(pgn)) return _PARSE.get(pgn);
  const r = _chargerPartie(pgn);
  if (_PARSE.size > 60) _PARSE.delete(_PARSE.keys().next().value);
  _PARSE.set(pgn, r);
  return r;
}
function _chargerPartie(pgn) {
  const k = pgn.indexOf('[');            // texte collé avant les en-têtes (ex. une FEN) : on l'ignore
  if (k > 0) pgn = pgn.slice(k);
  let clean = pgn.replace(/\{[^}]*\}/g, ' ').replace(/;[^\n]*/g, ' ').replace(/\$\d+/g, ' ');
  let prev;
  do { prev = clean; clean = clean.replace(/\([^()]*\)/g, ' '); } while (clean !== prev);
  clean = clean.replace(/[!?]+/g, '');
  const g = new Chess();
  if (!g.load_pgn(clean, { sloppy: true })) return null;
  const headers = g.header();
  const start = headers.FEN || DEFAULT_FEN;
  const r = new Chess(start);
  const fens = [r.fen()], moves = [];
  for (const h of g.history({ verbose: true })) {
    const m = r.move({ from: h.from, to: h.to, promotion: h.promotion });
    if (!m) return null;
    moves.push({ uci: h.from + h.to + (h.promotion || ''), san: m.san, color: m.color, from: m.from, to: m.to });
    fens.push(r.fen());
  }
  if (!moves.length && !headers.FEN) return null;
  return { headers, fens, moves };
}

function evalFin(fen) {
  const g = new Chess(fen);
  if (g.in_checkmate()) return { cp: g.turn() === 'w' ? -10000 : 10000, mate: 0, pv: [] };
  if (g.game_over()) return { cp: 0, mate: null, pv: [] };
  return null;
}

/** Ligne UCI "info ... score ... pv ..." -> {cp, mate, pv} côté blancs */
function lireInfo(fen, line, best) {
  const s = fen.split(' ')[1] === 'w' ? 1 : -1;
  let cp = null, mate = null, pv = [];
  if (line) {
    const m = line.match(/score (cp|mate) (-?\d+)/);
    if (m) { if (m[1] === 'cp') cp = s * +m[2]; else mate = s * +m[2]; }
    const p = line.match(/ pv (.+)$/);
    if (p) pv = p[1].trim().split(/\s+/);
  }
  const b = best && best.split(' ')[1];
  if (!pv.length && b && b !== '(none)') pv = [b];
  if (mate !== null) cp = mate === 0 ? -s * 10000 : (10000 - Math.abs(mate)) * Math.sign(mate);
  const g = new Chess(fen), ok = [];
  for (const u of pv) {
    if (!/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(u) || !jouer(g, u)) break;
    ok.push(u);
  }
  return { cp: cp === null ? 0 : cp, mate, pv: ok };
}

function texteEval(e) {
  if (!e) return '…';
  if (e.mate === 0) return 'mat';
  if (e.mate !== null) return `#${e.mate > 0 ? '+' : '-'}${Math.abs(e.mate)}`;
  const v = e.cp / 100;
  return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1);
}

const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
function dateDePgn(h) {
  const d = (h.UTCDate || h.Date || '').match(/(\d{4})\.(\d{2})\.(\d{2})/);
  if (!d) return null;
  return Date.UTC(+d[1], +d[2] - 1, +d[3]);
}
const fmtDate = ts => { if (!ts) return '—'; const d = new Date(ts); return `${d.getUTCDate()} ${MOIS[d.getUTCMonth()]} ${d.getUTCFullYear()}`; };

// Cadence : "600" -> 10 min · Rapide ; "180+2" -> 3+2 · Blitz
function cadence(tc) {
  if (!tc || tc === '-' || tc === '?') return { txt: tc === '-' ? 'Différé' : '—', type: tc === '-' ? 'Différé' : '' };
  if (/^\d+\/\d+$/.test(tc)) return { txt: 'Différé', type: 'Différé' };
  const m = tc.match(/^(\d+)(?:\+(\d+))?$/);
  if (!m) return { txt: tc, type: '' };
  const base = +m[1], inc = +(m[2] || 0), tot = base + 40 * inc;
  const type = tot < 180 ? 'Bullet' : tot < 480 ? 'Blitz' : tot < 1500 ? 'Rapide' : 'Classique';
  const b = base % 60 === 0 ? `${base / 60}` : `${(base / 60).toFixed(1)}`;
  return { txt: inc ? `${b}+${inc}` : `${b} min`, type };
}

// ---------- Voix du prof (synthèse vocale du navigateur, gratuite) ----------
const VOIX = { btn: null };

function lisibleOral(t) {
  return t.replace(/\b([KQRBNDTFC])?([a-h])?x?([a-h][1-8])\+?#?/g, (m, p, f, c) => {
    const P = { K: 'roi', R: (typeof REGLAGES !== 'undefined' && REGLAGES.notationFr) ? 'roi' : 'tour', Q: 'dame', D: 'dame', T: 'tour', B: 'fou', F: 'fou', N: 'cavalier', C: 'cavalier' };
    return (p ? P[p] + ' ' : '') + (m.includes('x') ? 'prend ' : '') + c.toUpperCase().split('').join(' ');
  });
}
function stopVoix() { try { speechSynthesis.cancel(); } catch { } if (VOIX.btn) VOIX.btn.classList.remove('on'); VOIX.btn = null; }
function parler(btn) {
  if (!('speechSynthesis' in window)) return;
  const meme = VOIX.btn === btn; stopVoix(); if (meme) return;
  const box = btn.closest('.ia-box'); if (!box) return;
  const txt = [...box.querySelectorAll('p')].map(p => p.textContent.replace(/^Conseil\s*/, 'Mon conseil : ')).join(' ');
  const u = new SpeechSynthesisUtterance(lisibleOral(txt));
  u.lang = 'fr-FR'; u.rate = 1.03;
  const v = speechSynthesis.getVoices().filter(v => /^fr/i.test(v.lang)); if (v.length) u.voice = v.find(x => /google|natural|premium|enhanced/i.test(x.name)) || v[0];
  u.onend = u.onerror = () => { if (VOIX.btn === btn) stopVoix(); };
  VOIX.btn = btn; btn.classList.add('on'); speechSynthesis.speak(u);
}

// ---------- Données locales : réglages + bibliothèque de parties ----------
const K_SET = 'coupjuste-reglages-v1', K_LIB = 'coupjuste-parties-v1', K_TRAIN = 'coupjuste-exos-v1';
const lire = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v ?? d; } catch { return d; } };
const ecrire = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } };

const REGLAGES = Object.assign({ theme: 'dark', niveau: true, board: 'vert', coords: true, sons: true, anim: true, voixAuto: false, notationFr: false, depth: '14|2500', pseudos: '' }, lire(K_SET, {}));
function sauverReglages() { ecrire(K_SET, REGLAGES); }
function appliquerTheme() {
  const r = document.documentElement;
  if (REGLAGES.theme === 'system') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', REGLAGES.theme);
  OPT.notationFr = !!REGLAGES.notationFr;
  r.dataset.board = REGLAGES.board || 'vert';
  r.dataset.coords = REGLAGES.coords === false ? 'off' : 'on';
  r.dataset.anim = REGLAGES.anim === false ? 'off' : 'on';
}
const mesPseudos = () => REGLAGES.pseudos.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);

// Bibliothèque : [{id, pgn, color, addedAt, depth, evals, prof, source}]
let LIB = lire(K_LIB, []);
if (!Array.isArray(LIB)) LIB = [];
const DERIVES = new Map();   // id -> données calculées (non stockées)

function sauverLib() {
  if (ecrire(K_LIB, LIB)) return true;
  // stockage plein : on allège les variantes des plus anciennes parties
  LIB.forEach(g => (g.evals || []).forEach(e => { if (e) e.pv = e.pv.slice(0, 4); }));
  return ecrire(K_LIB, LIB);
}
const partieParId = id => LIB.find(g => g.id === id);
const nouvelId = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function couleurPour(h) {
  const ps = mesPseudos();
  if ((h.White || '').toLowerCase() && ps.includes((h.White || '').toLowerCase())) return 'w';
  if ((h.Black || '').toLowerCase() && ps.includes((h.Black || '').toLowerCase())) return 'b';
  return null;
}

function ajouterPartie(pgn, color, source = 'import') {
  const P = chargerPartie(pgn);
  if (!P) return null;
  // même partie déjà présente ? on la réutilise
  const sig = P.moves.map(m => m.uci).join(' ') + '|' + (P.headers.White || '') + '|' + (P.headers.Date || '') + '|' + (P.headers.EndTime || '');
  const deja = LIB.find(g => g.sig === sig);
  if (deja) { if (color && deja.color !== color) { deja.color = color; DERIVES.delete(deja.id); sauverLib(); } return deja; }
  const g = { id: nouvelId(), sig, pgn, color: color || couleurPour(P.headers) || 'w', addedAt: Date.now(), depth: REGLAGES.depth, evals: new Array(P.fens.length).fill(null), affine: false, prof: null, source };
  LIB.unshift(g);
  sauverLib();
  emit('lib');
  return g;
}
function supprimerPartie(id) {
  LIB = LIB.filter(g => g.id !== id);
  DERIVES.delete(id);
  sauverLib();
  emit('lib');
}
const estAnalysee = g => g.evals && g.evals.length && g.evals.every(Boolean);
const estAffinee = g => estAnalysee(g) && g.affine !== false;   // les anciennes parties (sans le champ) sont déjà profondes
function progression(g) {
  if (estAffinee(g)) return 1;
  const p = PROG[g.id];
  if (p && p.phase === 'affinage') return 0.75 + 0.25 * (p.total ? p.fait / p.total : 1);
  return 0.75 * (g.evals ? g.evals.filter(Boolean).length / g.evals.length : 0);
}

/** Tout ce qu'on calcule à partir d'une partie (mis en cache) */
function deriver(g) {
  const c = DERIVES.get(g.id);
  const cle = g.evals.filter(Boolean).length + '|' + (g.rev || 0) + '|' + estAffinee(g);
  if (c && c.v === cle && c.color === g.color) return c;
  const P = chargerPartie(g.pgn);
  if (!P) return null;
  const h = P.headers, me = g.color, opp = autre(me), E = g.evals;
  const tags = P.moves.map((mv, i) => {
    let t = tagCoup(mv.uci, mv.color, E[i], E[i + 1]);
    if (t === 'imprecision' && i < 10) t = 'bon';       // bruit de théorie d'ouverture
    return t;
  });
  const deltas = P.moves.map((mv, i) => E[i] && E[i + 1] ? deltaCoup(mv.color, E[i], E[i + 1]) : 0);
  const phases = P.moves.map((mv, i) => phaseDe(P.fens[i], i));
  const prec = {}, counts = {}, phasePrec = { w: {}, b: {} };
  for (const c of ['w', 'b']) {
    const acc = [], byPh = { ouverture: [], milieu: [], finale: [] };
    counts[c] = { meilleur: 0, excellent: 0, bon: 0, imprecision: 0, erreur: 0, gaffe: 0 };
    P.moves.forEach((mv, i) => {
      if (mv.color !== c || !E[i] || !E[i + 1]) return;
      const a = precisionCoup(c, E[i], E[i + 1]);
      acc.push(a); byPh[phases[i]].push(a);
      if (tags[i]) counts[c][tags[i]]++;
    });
    prec[c] = moyenne(acc);
    for (const ph in byPh) phasePrec[c][ph] = byPh[ph].length >= 3 ? moyenne(byPh[ph]) : null;
  }
  const res = h.Result || '*';
  const resultat = res === '1/2-1/2' ? 'nulle' : res === '1-0' ? (me === 'w' ? 'victoire' : 'defaite') : res === '0-1' ? (me === 'b' ? 'victoire' : 'defaite') : 'inconnu';
  const nomC = c => { const n = h[c === 'w' ? 'White' : 'Black']; return n && n !== '?' ? n : (c === 'w' ? 'Blancs' : 'Noirs'); };
  const eloC = c => { const v = h[c === 'w' ? 'WhiteElo' : 'BlackElo']; return /^\d+$/.test(v || '') ? +v : null; };

  // Mes erreurs, avec leurs motifs
  const calculerMotifs = () => {
  const erreurs = [], manquees = [];
  if (E.every(Boolean)) {
    P.moves.forEach((mv, i) => {
      if (mv.color === me && MAUVAIS.includes(tags[i])) {
        const x = expliquer(P.fens[i], mv.uci, E[i], E[i + 1], me);
        const w = pourquoi(P.fens[i], E[i], i ? P.fens[i - 1] : null, i ? P.moves[i - 1].uci : null);
        const motifs = [];
        if (x.pertes.length && (x.perte || 0) > 0) motifs.push('en_prise');
        if (x.matPour || (x.gain || 0) >= 2) motifs.push('tactique');
        if (/donne échec/.test(w) && /attaque/.test(w)) motifs.push('double');
        if (x.matContre) motifs.push('mat_concede');
        const best = E[i].pv[0] ? lisible(P.fens[i], E[i].pv[0]).san : '';
        const visible = motifs.includes('en_prise') || motifs.includes('mat_concede') || motifs.includes('double') || (motifs.includes('tactique') && /[x+#]/.test(best));
        erreurs.push({ i, tag: tags[i], delta: deltas[i], phase: phases[i], motifs, pourquoi: w, visible });
      }
      if (mv.color === opp && MAUVAIS.includes(tags[i]) && P.moves[i + 1]) {
        const s = P.moves[i + 1];
        if (s.uci !== E[i + 1].pv[0] && deltas[i + 1] >= 0.1) { const pun = E[i + 1].pv[0] ? lisible(P.fens[i + 1], E[i + 1].pv[0]).san : ''; manquees.push({ i, j: i + 1, delta: deltas[i + 1], tag: tags[i], visible: /[x+#]/.test(pun) }); }
      }
    });
  }
  return { erreurs, manquees };
  };
  let motifs = null;
  const d = {
    v: cle, color: g.color, affine: estAffinee(g), P, h, me, opp, tags, deltas, phases, prec, counts, phasePrec, resultat,
    nom: nomC, elo: eloC, date: dateDePgn(h) || g.addedAt, ouverture: trouverOuverture(P.moves, h),
    cadence: cadence(h.TimeControl), complete: E.every(Boolean),
    get erreurs() { return (motifs || (motifs = calculerMotifs())).erreurs; },
    get manquees() { return (motifs || (motifs = calculerMotifs())).manquees; },
  };
  DERIVES.set(g.id, d);
  return d;
}

function exosResolus() { return lire(K_TRAIN, {}); }
const K_SERIE = 'coupjuste-serie-v1';
const jourCle = (d = new Date()) => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
function serieJours() {
  const s = new Set(lire(K_SERIE, [])); let n = 0; const d = new Date();
  if (!s.has(jourCle(d))) d.setDate(d.getDate() - 1);
  while (s.has(jourCle(d))) { n++; d.setDate(d.getDate() - 1); }
  return { n, auj: s.has(jourCle()) };
}

function marquerExo(key, ok) {
  if (ok) noterJour(); const s = exosResolus(); s[key] = ok ? 'ok' : (s[key] === 'ok' ? 'ok' : 'ko'); ecrire(K_TRAIN, s); }

  LIB = []; DERIVES.clear();
  try { localStorage.removeItem(K_LIB); localStorage.removeItem(K_TRAIN); } catch { }
  emit('lib');
