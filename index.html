<style>
/* Coquille : barre latérale fixe + barre du haut ; l'analyse se lit en deux zones (échiquier | panneau à onglets) sous une bande d'infos */
:root {
  --side: #0D110F; --bg: #111614; --s1: #18201C; --s2: #1E2722; --s3: #26302A;
  --line: #29332D; --line-2: #36413A;
  --fg: #EDE7D8; --fg-2: #A7B0A8; --fg-3: #79837B;
  --accent: #C9A45C; --accent-ink: #1A1407; --accent-soft: rgba(201, 164, 92, .13); --accent-line: rgba(201, 164, 92, .42);
  --c-meilleur: #5DBB8A; --c-excellent: #7CC59C; --c-bon: #A7B0A8; --c-imprecision: #EFD06A; --c-erreur: #E8894A; --c-gaffe: #E5534B;
  --ia: #8FB8DE; --ia-soft: rgba(143, 184, 222, .10); --ia-line: rgba(143, 184, 222, .32);
  --hl-last: rgba(214, 178, 98, .5); --hl-sel: rgba(214, 178, 98, .68); --hl-hint: rgba(143, 184, 222, .6);
  --arrow-best: rgba(64, 156, 226, .92); --arrow-bad: rgba(229, 72, 66, .9); --arrow-var: rgba(143, 184, 222, .92);
  --adv-area: rgba(237, 231, 216, .10); --adv-line: rgba(237, 231, 216, .72);
  --eval-w: #EDE7D8; --eval-b: #2A332E;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  --f-ui: "Geist", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Geist Mono", ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --r: 10px; --r-sm: 8px;
  --side-w: 232px; --top-h: 60px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --side: #E9E5DA; --bg: #F4F1E8; --s1: #FFFFFF; --s2: #F8F6F0; --s3: #ECE8DD; --line: #E1DCCF; --line-2: #D1CBBC;
  --fg: #18201C; --fg-2: #56605A; --fg-3: #87908A;
  --accent: #96742B; --accent-ink: #FFFFFF; --accent-soft: rgba(150, 116, 43, .11); --accent-line: rgba(150, 116, 43, .38);
  --c-meilleur: #2E8B5F; --c-excellent: #3F9A6E; --c-bon: #6F7871; --c-imprecision: #9A7B00; --c-erreur: #C0601C; --c-gaffe: #C9352F;
  --ia: #3D6FA3; --ia-soft: rgba(61, 111, 163, .07); --ia-line: rgba(61, 111, 163, .28);
  --hl-last: rgba(214, 170, 70, .45); --hl-sel: rgba(214, 170, 70, .62);
  --arrow-best: rgba(40, 120, 200, .88); --arrow-bad: rgba(201, 53, 47, .85); --arrow-var: rgba(61, 111, 163, .85);
  --adv-area: rgba(24, 32, 28, .07); --adv-line: rgba(24, 32, 28, .62);
  --eval-w: #FFFFFF; --eval-b: #26302A; --shadow: 0 12px 32px rgba(20, 30, 24, .12);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --side: #E9E5DA; --bg: #F4F1E8; --s1: #FFFFFF; --s2: #F8F6F0; --s3: #ECE8DD; --line: #E1DCCF; --line-2: #D1CBBC;
  --fg: #18201C; --fg-2: #56605A; --fg-3: #87908A;
  --accent: #96742B; --accent-ink: #FFFFFF; --accent-soft: rgba(150, 116, 43, .11); --accent-line: rgba(150, 116, 43, .38);
  --c-meilleur: #2E8B5F; --c-excellent: #3F9A6E; --c-bon: #6F7871; --c-imprecision: #9A7B00; --c-erreur: #C0601C; --c-gaffe: #C9352F;
  --ia: #3D6FA3; --ia-soft: rgba(61, 111, 163, .07); --ia-line: rgba(61, 111, 163, .28);
  --hl-last: rgba(214, 170, 70, .45); --hl-sel: rgba(214, 170, 70, .62);
  --arrow-best: rgba(40, 120, 200, .88); --arrow-bad: rgba(201, 53, 47, .85); --arrow-var: rgba(61, 111, 163, .85);
  --adv-area: rgba(24, 32, 28, .07); --adv-line: rgba(24, 32, 28, .62);
  --eval-w: #FFFFFF; --eval-b: #26302A; --shadow: 0 12px 32px rgba(20, 30, 24, .12);
  color-scheme: light;
}

/* thèmes d'échiquier (Paramètres → Personnalisation) */
:root, :root[data-board="vert"] { --sq-l: #ECE5D2; --sq-d: #4F7363; --co-on-l: #4F7363; --co-on-d: #ECE5D2; }
:root[data-board="bois"] { --sq-l: #F0D9B5; --sq-d: #B58863; --co-on-l: #B58863; --co-on-d: #F0D9B5; }
:root[data-board="bleu"] { --sq-l: #DEE3E6; --sq-d: #8CA2AD; --co-on-l: #788A94; --co-on-d: #DEE3E6; }
:root[data-board="marbre"] { --sq-l: #EDE6D8; --sq-d: #A8957A; --co-on-l: #A8957A; --co-on-d: #EDE6D8; }
:root[data-board="ardoise"] { --sq-l: #C9CFD8; --sq-d: #6A768A; --co-on-l: #5F6B7F; --co-on-d: #D5DAE2; }
:root[data-board="corail"] { --sq-l: #F4E7DD; --sq-d: #D88C6F; --co-on-l: #C27458; --co-on-d: #F4E7DD; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font: 14px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--fg-2); }
.faint { color: var(--fg-3); }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ico.lg { width: 20px; height: 20px; }

/* ---------- Coquille ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); background: var(--side);
  display: flex; flex-direction: column; gap: 4px; padding: 14px 12px max(14px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 16px; text-decoration: none; font-weight: 650; font-size: 15px; letter-spacing: -.01em; }
.brand svg { width: 22px; height: 22px; }
.nav { display: grid; gap: 2px; }
.nav-sec { padding: 14px 10px 6px; }
.nav button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; border: 0; background: none; color: var(--fg-2);
  padding: 8px 10px; border-radius: var(--r-sm); font-weight: 500; transition: background .12s, color .12s;
}
.nav button:hover { background: var(--s2); color: var(--fg); }
.nav button.on { background: color-mix(in srgb, var(--fg) 8%, transparent); color: var(--fg); box-shadow: inset 3px 0 0 var(--accent); }
.nav button.on .ico { color: var(--accent); }
.nav .count { margin-left: auto; font: 500 11.5px var(--f-mono); color: var(--fg-3); }
.side-foot { margin-top: auto; display: grid; gap: 8px; padding: 10px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--fg-2); }
.status-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); margin-right: 7px; vertical-align: 1px; }
.status-dot.pret { background: var(--accent); }
.status-dot.calcul { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); animation: pulse 1.4s infinite; }
.status-dot.erreur { background: var(--c-gaffe); }
@keyframes pulse { 50% { box-shadow: 0 0 0 5px transparent; } }
.kbd-hint { display: flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--fg-3); padding: 0; font-size: 12.5px; }
.kbd-hint:hover { color: var(--fg); }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; height: var(--top-h); background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.only-mobile { display: none !important; }
.search { position: relative; flex: 1; max-width: 520px; }
.search input {
  width: 100%; height: 36px; border: 1px solid var(--line); background: var(--s1); border-radius: var(--r-sm); padding: 0 40px 0 36px; color: var(--fg);
}
.search input::placeholder { color: var(--fg-3); }
.search input:focus { border-color: var(--line-2); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.search > .ico { position: absolute; left: 11px; top: 10px; color: var(--fg-3); }
.search kbd { position: absolute; right: 9px; top: 8px; }
kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; color: var(--fg-2); background: var(--s2); }
.search-res {
  position: absolute; top: 42px; left: 0; right: 0; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow);
  padding: 6px; display: grid; gap: 2px; max-height: 60vh; overflow: auto;
}
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.profile { position: relative; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--s2); color: var(--fg);
  font: 600 13px var(--f-ui); display: grid; place-items: center; padding: 0;
}
.menu {
  position: absolute; right: 0; top: 42px; min-width: 240px; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; z-index: 50;
}
.menu .who { padding: 8px 10px 10px; border-bottom: 1px solid var(--line); margin-bottom: 4px; }
.menu button { display: flex; gap: 10px; align-items: center; border: 0; background: none; padding: 8px 10px; border-radius: 6px; text-align: left; color: var(--fg-2); width: 100%; }
.menu button:hover { background: var(--s2); color: var(--fg); }

.view {
  flex: 1; width: 100%; max-width: 1480px; margin: 0 auto;
  padding-block: 28px 64px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  animation: vin .18s ease-out;
}
@keyframes vin { from { opacity: .4; transform: translateY(3px); } }
.page-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.page-head h1 { font-size: 26px; }
.page-head p { color: var(--fg-2); margin-top: 6px; max-width: 62ch; }

/* ---------- Composants ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--s1); color: var(--fg); font-weight: 550; white-space: nowrap; transition: background .12s, border-color .12s, box-shadow .12s;
}
.btn:hover { background: var(--s2); border-color: var(--line-2); }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); font-weight: 650; }
.btn.primary:hover { box-shadow: 0 0 0 4px var(--accent-soft); background: color-mix(in srgb, var(--accent) 88%, #fff); }
.btn.ghost { background: none; border-color: transparent; color: var(--fg-2); }
.btn.ghost:hover { background: var(--s2); color: var(--fg); }
.btn.danger { color: var(--c-gaffe); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.ia { border-color: var(--ia-line); color: var(--ia); background: var(--ia-soft); }
.btn.ia:hover { border-color: var(--ia); }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.icon-btn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--s1); color: var(--fg-2); padding: 0; }
.icon-btn:hover { color: var(--fg); border-color: var(--line-2); background: var(--s2); }
.icon-btn:disabled { opacity: .4; cursor: not-allowed; }

.card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 0; }
.card-h h2, .card-h h3 { font-size: 14px; font-weight: 600; }
.card-b { padding: 14px 16px 16px; }
.grid-kpi { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { padding: 14px 16px; display: grid; gap: 6px; align-content: start; }
.kpi .v { font: 600 24px/1.1 var(--f-ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 13px; color: var(--fg-2); font-weight: 500; margin-left: 4px; }
.kpi .d { font-size: 12.5px; color: var(--fg-2); }
.up { color: var(--c-meilleur); } .down { color: var(--c-gaffe); }
[data-tip] { position: relative; }
[data-tip]:hover::after, [data-tip]:focus-visible::after {
  content: attr(data-tip); position: absolute; left: 0; top: calc(100% + 6px); z-index: 30; width: max-content; max-width: 260px;
  background: var(--s3); color: var(--fg); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 8px; font: 400 12.5px/1.4 var(--f-ui);
  text-transform: none; letter-spacing: 0; box-shadow: var(--shadow); pointer-events: none;
}
.tipq { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--line-2); font: 600 9.5px var(--f-ui); color: var(--fg-3); cursor: help; vertical-align: 1px; margin-left: 4px; }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--s2); border: 1px solid var(--line); border-radius: var(--r-sm); }
.seg button { border: 0; background: none; color: var(--fg-2); padding: 5px 12px; border-radius: 6px; font-weight: 550; font-size: 13px; }
.seg button.on { background: var(--s1); color: var(--fg); box-shadow: 0 0 0 1px var(--line-2); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); padding: 0 8px; }
.tabs button {
  border: 0; background: none; color: var(--fg-2); padding: 12px 10px 11px; font-weight: 550; font-size: 13px; position: relative; display: inline-flex; gap: 7px; align-items: center;
}
.tabs button:hover { color: var(--fg); }
.tabs button.on { color: var(--fg); }
.tabs button.on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.tabs button.ia-tab.on::after { background: var(--ia); }

.cls {
  display: inline-grid; place-items: center; min-width: 20px; height: 18px; padding: 0 4px; border-radius: 5px; font: 700 10.5px/1 var(--f-mono);
  color: var(--bg); vertical-align: 1px;
}
.cls-meilleur { background: transparent; color: var(--c-meilleur); box-shadow: inset 0 0 0 1px var(--accent-line); } .cls-excellent { background: transparent; color: var(--c-excellent); box-shadow: inset 0 0 0 1px var(--accent-line); }
.cls-bon { background: transparent; color: var(--c-bon); box-shadow: inset 0 0 0 1px var(--line-2); }
.cls-imprecision { background: var(--c-imprecision); } .cls-erreur { background: var(--c-erreur); } .cls-gaffe { background: var(--c-gaffe); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px 0 4px; border-radius: 99px; border: 1px solid var(--line); font-size: 12.5px; font-weight: 550; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; letter-spacing: .02em; border: 1px solid var(--line); color: var(--fg-2); white-space: nowrap; }
.tag .ico { width: 13px; height: 13px; }
.tag-moteur { color: var(--fg-2); }
.tag-ia { color: var(--ia); border-color: var(--ia-line); background: var(--ia-soft); }
.res { font: 600 12px var(--f-mono); padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); }
.res-victoire { color: var(--c-meilleur); border-color: var(--accent-line); }
.res-defaite { color: var(--c-gaffe); border-color: color-mix(in srgb, var(--c-gaffe) 40%, transparent); }
.res-nulle { color: var(--fg-2); }

.list { display: grid; }
.row {
  display: grid; align-items: center; gap: 12px; padding: 11px 16px; border-top: 1px solid var(--line); text-align: left; width: 100%;
  background: none; border-left: 0; border-right: 0; border-bottom: 0; color: var(--fg); transition: background .1s;
}
.row:first-child { border-top: 0; }
button.row:hover, a.row:hover { background: var(--s2); }
.games-row { grid-template-columns: minmax(0, 2.2fr) 80px 110px 110px 90px 90px 20px; }
.games-head { font-size: 11.5px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding-block: 10px; }
.opp { display: flex; gap: 10px; align-items: center; min-width: 0; }
.opp .pc-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; border: 1px solid var(--line-2); }
.pc-dot.w { background: var(--eval-w); } .pc-dot.b { background: var(--eval-b); }
.opp b { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opp small { color: var(--fg-3); font-family: var(--f-mono); }
.ellip { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.empty { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 40px 20px; color: var(--fg-2); }
.empty .ico { width: 28px; height: 28px; color: var(--fg-3); }
.empty h3 { color: var(--fg); font-size: 15px; }
.empty p { max-width: 46ch; }

.skel { background: linear-gradient(90deg, var(--s2) 0%, var(--s3) 50%, var(--s2) 100%); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; border-radius: 4px; color: transparent !important; }
@keyframes shimmer { to { background-position: -200% 0; } }
.bar { height: 4px; border-radius: 4px; background: var(--s3); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease-out; }

.field { display: grid; gap: 6px; }
.field label, .lbl { font-size: 12.5px; color: var(--fg-2); font-weight: 550; }
.input, .select, textarea.input {
  border: 1px solid var(--line); background: var(--s2); border-radius: var(--r-sm); padding: 8px 10px; color: var(--fg); min-width: 0;
}
.input:focus, .select:focus { outline: none; border-color: var(--line-2); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea.input { width: 100%; resize: vertical; font: 12.5px/1.55 var(--f-mono); min-height: 170px; }
.switch { position: relative; width: 36px; height: 20px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--s3); border: 1px solid var(--line-2); transition: background .15s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--fg-2); transition: transform .15s, background .15s; }
.switch input:checked + span { background: var(--accent); border-color: var(--accent); }
.switch input:checked + span::after { transform: translateX(16px); background: var(--accent-ink); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

.toasts { position: fixed; right: max(20px, env(safe-area-inset-right, 0px)); bottom: max(20px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; z-index: 80; }
.toast { display: flex; gap: 10px; align-items: center; background: var(--s2); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 10px 14px; box-shadow: var(--shadow); max-width: 360px; animation: tin .18s ease-out; }
.toast .ico { color: var(--accent); }
.toast-err .ico { color: var(--c-gaffe); }
.toast.out { opacity: 0; transform: translateY(4px); transition: .2s; }
@keyframes tin { from { opacity: 0; transform: translateY(6px); } }
.modal-bg { position: fixed; inset: 0; background: rgba(5, 7, 10, .55); z-index: 90; display: grid; place-items: center; padding: 20px; }
.modal { width: min(520px, 100%); background: var(--s1); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.modal .card-h { padding: 16px 18px 0; }
.kbd-list { display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; padding: 16px 18px 20px; align-items: center; }
.kbd-list span:nth-child(odd) { display: flex; gap: 4px; }

/* ---------- Graphiques ---------- */
.chart { position: relative; width: 100%; }
.chart-svg { display: block; width: 100%; overflow: visible; }
.chart .tip {
  position: absolute; z-index: 5; pointer-events: none; background: var(--s3); border: 1px solid var(--line-2); border-radius: 6px; padding: 6px 9px;
  font-size: 12.5px; display: grid; gap: 2px; box-shadow: var(--shadow); white-space: nowrap;
}
.g-mid { stroke: var(--line-2); stroke-dasharray: 3 4; }
.g-grid { stroke: var(--line); }
.g-area { fill: var(--adv-area); }
.g-line { fill: none; stroke: var(--adv-line); stroke-width: 1.5; stroke-linejoin: round; }
.g-prec { stroke: var(--accent); }
.g-elo { stroke: var(--fg-2); stroke-dasharray: 4 3; }
.g-pt { stroke: var(--s1); stroke-width: 2; }
.g-prec-pt { fill: var(--accent); } .g-elo-pt { fill: var(--fg-2); }
.g-cur { stroke: var(--accent); stroke-width: 1.2; }
.g-hover { stroke: var(--fg-3); stroke-width: 1; }
.g-dot { fill: var(--accent); stroke: var(--s1); stroke-width: 2; }
.g-crit { stroke: var(--s1); stroke-width: 1.5; }
.g-crit.g-gaffe { fill: var(--c-gaffe); } .g-crit.g-erreur { fill: var(--c-erreur); }
.g-crit:not(.mine) { fill: var(--s1); stroke-width: 1.5; }
.g-crit.g-gaffe:not(.mine) { stroke: var(--c-gaffe); } .g-crit.g-erreur:not(.mine) { stroke: var(--c-erreur); }
.g-lab, .g-axis { fill: var(--fg-3); font: 10px var(--f-mono); }
.g-hit { cursor: crosshair; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--fg-2); }
.legend i { display: inline-block; width: 14px; height: 2px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }

/* ---------- Échiquier ---------- */
.board-svg { width: 100%; aspect-ratio: 1; display: block; border-radius: 6px; touch-action: none; user-select: none; -webkit-user-select: none; }
.board-svg .sq-l { fill: var(--sq-l); } .board-svg .sq-d { fill: var(--sq-d); }
.board-svg .hl-last { fill: var(--hl-last); } .board-svg .hl-sel { fill: var(--hl-sel); } .board-svg .hl-hint { fill: var(--hl-hint); }
.board-svg .hl-bad { fill: rgba(242, 85, 90, .32); }
.board-svg .chk { fill: rgba(242, 85, 90, .55); }
.board-svg .co-l { fill: var(--co-on-l); font: 600 6px var(--f-mono); }
.board-svg .co-d { fill: var(--co-on-d); font: 600 6px var(--f-mono); }
.board-svg .pc.mob { cursor: grab; }
.board-svg .pc.ghosted { opacity: .3; }
.board-svg .pc.drag { pointer-events: none; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .35)); }
.board-svg .dot { fill: rgba(10, 14, 20, .28); pointer-events: none; }
.board-svg .dot-cap { fill: none; stroke: rgba(10, 14, 20, .28); stroke-width: 3; pointer-events: none; }
.board-svg .arrow { pointer-events: none; }
.board-svg .arrow.best { fill: var(--arrow-best); } .board-svg .arrow.bad { fill: var(--arrow-bad); } .board-svg .arrow.var { fill: var(--arrow-var); }
.evalbar { position: relative; border-radius: 4px; overflow: hidden; background: var(--eval-b); border: 1px solid var(--line); }
.evalbar > i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--eval-w); transition: height .3s ease-out; }
.evalbar.flip > i { top: 0; bottom: auto; }
.evalbar b { position: absolute; left: 0; right: 0; font: 600 9px var(--f-mono); text-align: center; padding: 3px 0; }
.evalbar b.w-side { bottom: 0; color: var(--eval-b); }
.evalbar b.b-side { top: 0; color: var(--eval-w); }
.evalbar.flip b.w-side { bottom: auto; top: 0; }
.evalbar.flip b.b-side { top: auto; bottom: 0; }

/* ---------- Écran d'analyse ---------- */
.an-head { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px; padding: 14px 16px; margin-bottom: 16px; }
.players { display: flex; align-items: center; gap: 14px; min-width: 0; flex-wrap: wrap; }
.player { display: flex; gap: 9px; align-items: center; min-width: 0; }
.player b { font-weight: 600; }
.player .elo { font: 500 12.5px var(--f-mono); color: var(--fg-2); }
.player.me b::after { content: "toi"; margin-left: 7px; font: 600 10px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent-line); border-radius: 4px; padding: 1px 5px; vertical-align: 2px; }
.vs { color: var(--fg-3); font-size: 12.5px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; color: var(--fg-2); font-size: 13px; }
.meta span { display: inline-flex; gap: 6px; align-items: center; }
.meta b { color: var(--fg); font-weight: 550; }
.an-head .seg { margin-left: auto; }
.an-progress { flex-basis: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; font-size: 12.5px; color: var(--fg-2); }

.an-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 400px); gap: 16px; align-items: start; }
.an-left { display: grid; gap: 12px; min-width: 0; }
.board-zone { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; width: 100%; max-width: calc(100vh - var(--top-h) - 300px + 32px); min-width: min(100%, 320px); margin: 0 auto; }
.controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; width: 100%; max-width: max(calc(100vh - var(--top-h) - 300px + 32px), 352px); margin: 0 auto; }
.controls .ply { margin-left: auto; font: 500 12.5px var(--f-mono); color: var(--fg-2); }
.var-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border: 1px solid var(--ia-line); background: var(--ia-soft); border-radius: var(--r-sm); font-size: 13px; width: 100%; max-width: max(calc(100vh - var(--top-h) - 300px + 32px), 352px); margin: 0 auto; }
.var-banner b { color: var(--ia); }

.pos-card { padding: 14px 16px; display: grid; gap: 10px; }
.pos-top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
.pos-top .san { font: 600 18px var(--f-mono); }
.pos-top .ev { margin-left: auto; font: 600 18px var(--f-mono); }
.pos-sub { color: var(--fg-2); font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.line { display: flex; flex-wrap: wrap; gap: 2px 6px; font: 13px/1.7 var(--f-mono); }
.line button { border: 0; background: none; padding: 0 3px; border-radius: 4px; color: var(--fg); font: inherit; }
.line button:hover { background: var(--s3); }
.line .n { color: var(--fg-3); }
.expl { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.expl p { max-width: 68ch; }
.expl .k { font-weight: 600; }
.mv { font-family: var(--f-mono); font-weight: 600; }

.panel { position: sticky; top: calc(var(--top-h) + env(safe-area-inset-top, 0px) + 16px); height: calc(100vh - var(--top-h) - 48px); display: flex; flex-direction: column; overflow: hidden; }
.panel-body { flex: 1; overflow-y: auto; min-height: 0; }
.panel-sec { padding: 14px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.panel-sec:last-child { border-bottom: 0; }
.panel-sec h3 { font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.summary-chips { display: flex; flex-wrap: wrap; gap: 6px; }

.moves { display: grid; grid-template-columns: 38px minmax(0, 1fr) minmax(0, 1fr); font: 13px var(--f-mono); padding: 6px 8px 12px; }
.moves .n { color: var(--fg-3); padding: 6px 0 6px 8px; }
.moves button {
  display: flex; align-items: center; gap: 6px; border: 0; background: none; text-align: left; padding: 5px 8px; border-radius: 6px; color: var(--fg); font: inherit; min-width: 0;
}
.moves button:hover { background: var(--s2); }
.moves button.on { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent-line); }
.moves button .e { margin-left: auto; color: var(--fg-3); font-size: 11.5px; }
.moves button.mine .s { font-weight: 600; }
.moves .cls { min-width: 18px; height: 16px; font-size: 9.5px; }
.moves .cls-bon { display: none; }

.ia-box { border: 1px solid var(--ia-line); background: var(--ia-soft); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 8px; }
.ia-box p { max-width: 68ch; }
.ia-box .conseil { font-weight: 600; }
.thinking { color: var(--fg-2); font-style: italic; }
.conseil-box { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; padding: 9px 11px; border-radius: var(--r-sm); background: var(--s1); border: 1px solid var(--ia-line); }
.conseil-box .ico { color: var(--ia); margin-top: 2px; }
.conseil-box b { color: var(--ia); font-weight: 600; margin-right: 4px; }
.guide { display: grid; gap: 14px; }
.guide h4 { font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center; }
.guide .steps li { font-size: 13.5px; color: var(--fg); }
.guide .steps li b { font-weight: 600; }
.guide code, .mention code { font: 12px var(--f-mono); background: var(--s2); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.legal { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; padding: 12px; border-radius: var(--r-sm); background: var(--s2); border: 1px solid var(--line); font-size: 13px; color: var(--fg-2); }
.legal .ico { color: var(--accent); margin-top: 1px; }
.legal b { color: var(--fg); }
.mention { display: grid; gap: 4px; padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--fg-2); }
.mention:first-child { border-top: 0; }
.mention b { color: var(--fg); font-weight: 600; }
.mention a { color: var(--fg); }
.chat { display: grid; gap: 10px; }
.chat .q { justify-self: end; max-width: 88%; background: var(--s3); border-radius: 10px 10px 2px 10px; padding: 8px 11px; }
.chat .a { max-width: 96%; white-space: pre-wrap; }
.chat-form { display: flex; gap: 8px; }
.chat-form .input { flex: 1; }
.err-msg { color: var(--c-gaffe); font-size: 13px; }

/* ---------- Rapport ---------- */
.rep-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-6 { grid-column: span 6; } .span-4 { grid-column: span 4; }
.acc-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.acc { display: grid; gap: 4px; padding: 14px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--s2); }
.acc .v { font: 600 30px/1 var(--f-ui); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.dist { width: 100%; border-collapse: collapse; font-size: 13px; }
.dist th { text-align: left; font-weight: 500; color: var(--fg-2); padding: 7px 0; }
.dist td { text-align: right; font: 500 13px var(--f-mono); padding: 7px 0 7px 12px; }
.dist thead th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--fg-3); text-align: right; }
.dist thead th:first-child { text-align: left; }
.dist tr + tr th, .dist tr + tr td { border-top: 1px solid var(--line); }
.moment { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.moment .mv { font-size: 13.5px; white-space: nowrap; }
.strength { display: grid; gap: 6px; }
.strength li { color: var(--fg-2); }
.strength b { color: var(--fg); font-weight: 550; }

/* ---------- Pages ---------- */
.ov-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
.work { display: grid; gap: 10px; padding: 14px 16px 16px; }
.work-item { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--s2); }
.work-item .n { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font: 600 12px var(--f-mono); background: var(--s3); color: var(--fg-2); }
.work-item b { font-weight: 600; }
.work-item p { color: var(--fg-2); font-size: 13px; margin-top: 2px; }
.work-item .btn { margin-top: 8px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.import-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.drop { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 26px; display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--fg-2); transition: border-color .12s, background .12s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop .ico { width: 24px; height: 24px; color: var(--fg-3); }
.ready { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px 12px; align-items: start; padding: 12px; border-radius: var(--r-sm); border: 1px solid var(--accent-line); background: var(--accent-soft); }
.ready .ico { color: var(--accent); margin-top: 2px; }
.ready.bad { border-color: color-mix(in srgb, var(--c-gaffe) 40%, transparent); background: color-mix(in srgb, var(--c-gaffe) 8%, transparent); }
.ready.bad .ico { color: var(--c-gaffe); }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: end; }
.steps { display: grid; gap: 12px; counter-reset: s; }
.steps li { list-style: none; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; color: var(--fg-2); font-size: 13px; }
.steps li::before { counter-increment: s; content: counter(s); width: 22px; height: 22px; border-radius: 6px; background: var(--s3); color: var(--fg); display: grid; place-items: center; font: 600 11.5px var(--f-mono); }
.steps { padding: 0; margin: 0; }
.unavail { opacity: .7; }

.bars { display: grid; gap: 10px; }
.hbar { display: grid; grid-template-columns: 120px minmax(0, 1fr) 56px; gap: 12px; align-items: center; font-size: 13px; }
.hbar .track { height: 8px; border-radius: 4px; background: var(--s3); overflow: hidden; }
.hbar .track i { display: block; height: 100%; border-radius: 4px; background: var(--fg-2); }
.hbar .val { text-align: right; font: 500 12.5px var(--f-mono); }
.op-row { grid-template-columns: minmax(0, 2fr) 70px 70px 150px 90px 20px; }
.wdl { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--s3); }
.wdl i { display: block; height: 100%; }

.train-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 16px; align-items: start; }
.train-board { max-width: calc(100vh - var(--top-h) - 170px); width: 100%; margin: 0 auto; }
.feedback { padding: 12px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--s2); display: grid; gap: 6px; }
.feedback.ok { border-color: var(--accent-line); background: var(--accent-soft); }
.feedback.ko { border-color: color-mix(in srgb, var(--c-gaffe) 40%, transparent); background: color-mix(in srgb, var(--c-gaffe) 8%, transparent); }

.set-list { display: grid; }
.set-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 16px; border-top: 1px solid var(--line); }
.set-row:first-child { border-top: 0; }
.set-row p { color: var(--fg-2); font-size: 13px; margin-top: 2px; max-width: 60ch; }

.mbar { display: none; }

/* ---------- Responsive ---------- */
@media (max-width: 1240px) {
  .grid-kpi { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .games-row { grid-template-columns: minmax(0, 2fr) 70px 100px 90px 20px; }
  .games-row .hide-md { display: none; }
}
@media (max-width: 1100px) {
  .an-grid { grid-template-columns: minmax(0, 1fr) 340px; }
  .ov-grid, .import-grid, .train-grid { grid-template-columns: minmax(0, 1fr); }
  .span-8, .span-6, .span-4 { grid-column: span 12; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; z-index: 70; left: 0; top: 0; width: 272px; transform: translateX(-102%); transition: transform .2s ease-out; box-shadow: var(--shadow); padding-top: max(14px, env(safe-area-inset-top, 0px)); }
  .side.open { transform: none; }
  .scrim { position: fixed; inset: 0; z-index: 65; background: rgba(5, 7, 10, .5); }
  .only-mobile { display: inline-grid !important; }
  .hide-mobile { display: none !important; }
  .top { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); gap: 8px; }
  .search { max-width: none; }
  .search kbd { display: none; }
  .view { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 96px; }
  .page-head h1 { font-size: 22px; }
  .an-grid { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; height: auto; max-height: none; }
  .panel-body { overflow: visible; }
  .board-zone, .controls, .var-banner { max-width: 100%; }
  .controls { display: none; }
  .an-head .seg { margin-left: 0; }
  .mbar {
    display: flex; position: fixed; z-index: 45; left: 0; right: 0; bottom: 0; gap: 6px; justify-content: space-between; align-items: center;
    background: var(--s1); border-top: 1px solid var(--line);
    padding: 8px max(12px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  }
  .mbar .icon-btn { width: 44px; height: 40px; }
  .mbar .ply { font: 500 12.5px var(--f-mono); color: var(--fg-2); }
  .toasts { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); }
  .grid-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .games-row { grid-template-columns: minmax(0, 1fr) 64px 20px; }
  .games-row .hide-sm { display: none; }
  .op-row { grid-template-columns: minmax(0, 1fr) 60px 20px; }
  .op-row .hide-sm { display: none; }
  .acc-pair { grid-template-columns: 1fr; }
  .set-row { grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .train-board { max-width: 100%; }
  .hbar { grid-template-columns: 96px minmax(0, 1fr) 48px; }
  .top .btn.primary span { display: none; }
  .top .btn.primary { width: 36px; padding: 0; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Accueil ---------- */
.btn.lg { height: 44px; padding: 0 18px; font-size: 15px; }
.hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 32px; align-items: center; padding-block: 12px 40px; }
.hero-txt { display: grid; gap: 18px; justify-items: start; }
.hero h1 { font-size: clamp(32px, 4.4vw, 54px); line-height: 1.04; letter-spacing: -.035em; font-weight: 650; }
.hero h1 sup { font-size: .38em; color: var(--fg-3); vertical-align: super; letter-spacing: 0; }
.hero-sub { font-size: 17px; line-height: 1.55; color: var(--fg-2); max-width: 52ch; }
.hero-sub b { color: var(--fg); font-weight: 600; }
.hero-cta { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-note { font-size: 13px; }
.hero-demo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; overflow: hidden; }
.demo-board { padding: 16px 16px 0; }
.demo-board .board-svg { max-width: 380px; margin: 0 auto; }
.demo-txt { padding: 16px; display: grid; gap: 12px; }
.land-sec { padding-block: 36px 8px; border-top: 1px solid var(--line); margin-top: 8px; }
.land-sec > h2 { font-size: 24px; letter-spacing: -.02em; margin-bottom: 20px; }
.land-steps { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.land-steps li { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 12px; }

<script>
window.BC_LANG = (function () { try { var s = localStorage.getItem('bc-lang'); if (s === 'fr' || s === 'en') return s; } catch (e) { } return /^fr/i.test(navigator.language || '') ? 'fr' : 'en'; })();

const SEED_PGN = '';
const SEED_EVALS = [];
if (window.BC_LANG === 'en') (function () {
(function(){const M={"Accueil": "Home", "Mes parties": "My games", "Analyser une partie": "Analyze a game", "Progresser": "Improve", "Mon prof": "My coach", "Ouvertures": "Openings", "Statistiques": "Statistics", "Entraînement": "Training", "Mes ouvertures": "My openings", "Mon bilan": "My recap", "Studio TikTok": "TikTok Studio", "Compte": "Account", "Mon profil": "My profile", "Tarifs": "Pricing", "Paramètres": "Settings", "Stockfish 10 · dans ton navigateur": "Stockfish 10 · in your browser", "Raccourcis clavier": "Keyboard shortcuts", "Ouvrir le menu": "Open the menu", "Rechercher une partie, un adversaire, une ouverture…": "Search a game, an opponent, an opening…", "Rechercher dans tes parties": "Search your games", "Menu du profil": "Profile menu"};const w=document.createTreeWalker(document.querySelector('.app'),NodeFilter.SHOW_TEXT);let n;while((n=w.nextNode())){const t=n.nodeValue.trim();if(M[t])n.nodeValue=n.nodeValue.replace(t,M[t]);}document.querySelectorAll('[aria-label],[placeholder]').forEach(e=>['aria-label','placeholder'].forEach(a=>{const v=e.getAttribute(a);if(v&&M[v])e.setAttribute(a,M[v]);}));})();
// ---------- Logique d'analyse (port de rejouer.py) ----------
const DEFAULT_FEN = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1';
const FILES = 'abcdefgh';
const VAL = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 0 };
const NOM = { p: 'pawn', n: 'knight', b: 'bishop', r: 'rook', q: 'queen', k: 'king' };
const FEM = { r: 1, q: 1 };
const le = t => (FEM[t] ? 'the ' : 'the ') + NOM[t];
const ton = t => (FEM[t] ? 'your ' : 'your ') + NOM[t];
const son = t => (FEM[t] ? 'their ' : 'their ') + NOM[t];
const EN_VERS_FR = { K: 'R', Q: 'Q', R: 'R', B: 'B', N: 'N' };
const OPT = { notationFr: false };
const ALL_SQ = [];
for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) ALL_SQ.push(FILES[f] + (r + 1));

const sqFR = s => [s.charCodeAt(0) - 97, +s[1] - 1];
const sqName = (f, r) => FILES[f] + (r + 1);
const autre = c => (c === 'w' ? 'b' : 'w');

function jouer(g, uci) {
  return g.move({ from: uci.slice(0, 2), to: uci.slice(2, 4), promotion: uci[4] });
}

function attacksFrom(g, sq) {
  const p = g.get(sq);
  if (!p) return [];
  const [f, r] = sqFR(sq);
  const out = [];
  const add = (df, dr) => {
    const nf = f + df, nr = r + dr;
    if (nf >= 0 && nf < 8 && nr >= 0 && nr < 8) out.push(sqName(nf, nr));
  };
  const slide = dirs => {
    for (const [df, dr] of dirs) {
      let nf = f + df, nr = r + dr;
      while (nf >= 0 && nf < 8 && nr >= 0 && nr < 8) {
        const s = sqName(nf, nr);
        out.push(s);
        if (g.get(s)) break;
        nf += df; nr += dr;
      }
    }
  };
  const DIAG = [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  const ORTH = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  switch (p.type) {
    case 'p': { const d = p.color === 'w' ? 1 : -1; add(-1, d); add(1, d); break; }
    case 'n': [[1, 2], [2, 1], [-1, 2], [-2, 1], [1, -2], [2, -1], [-1, -2], [-2, -1]].forEach(([a, b]) => add(a, b)); break;
    case 'k': for (const [a, b] of DIAG.concat(ORTH)) add(a, b); break;
    case 'b': slide(DIAG); break;
    case 'r': slide(ORTH); break;
    case 'q': slide(DIAG.concat(ORTH)); break;
  }
  return out;
}

function attackers(g, color, sq) {
  return ALL_SQ.filter(s => {
    const p = g.get(s);
    return p && p.color === color && attacksFrom(g, s).includes(sq);
  });
}

function materiel(g, c) {
  let t = 0;
  for (const s of ALL_SQ) {
    const p = g.get(s);
    if (p) t += VAL[p.type] * (p.color === c ? 1 : -1);
  }
  return t;
}

function gainMateriel(fen, pv, c, n = 6) {
  const g = new Chess(fen);
  const depart = materiel(g, c);
  for (const u of pv.slice(0, n)) jouer(g, u);
  return materiel(g, c) - depart;
}

function casesEnPrise(g, c) {
  const res = [];
  for (const sq of ALL_SQ) {
    const p = g.get(sq);
    if (!p || p.color !== c || p.type === 'k') continue;
    const att = attackers(g, autre(c), sq);
    if (!att.length) continue;
    const def = attackers(g, c, sq);
    const moinsCher = Math.min(...att.map(a => VAL[g.get(a).type]));
    if (!def.length || moinsCher < VAL[p.type]) res.push(sq);
  }
  return res;
}

function enFr(san) {
  if (!OPT.notationFr || !san) return san;
  let s = EN_VERS_FR[san[0]] ? EN_VERS_FR[san[0]] + san.slice(1) : san;
  return s.replace(/=([QRBN])/, (_, x) => '=' + EN_VERS_FR[x]);
}

/** Coup + sa signification : {san, sens} */
function lisible(fen, uci) {
  const g = new Chess(fen);
  const p = g.get(uci.slice(0, 2));
  const cible = g.get(uci.slice(2, 4));
  const m = jouer(g, uci);
  if (!m) return { san: uci, sens: '' };
  let sens;
  if (m.flags.includes('k')) sens = 'kingside castling';
  else if (m.flags.includes('q')) sens = 'queenside castling';
  else {
    if (m.captured) sens = `${NOM[p.type]} takes ${cible ? NOM[cible.type] : 'pawn'} on ${m.to}`;
    else sens = `${NOM[p.type]} on ${m.to}`;
    if (m.promotion) sens += `, promotes to ${NOM[m.promotion]}`;
  }
  if (g.in_checkmate()) sens += ', checkmate';
  else if (g.in_check()) sens += ', check';
  return { san: enFr(m.san), sens };
}

function numero(fen) {
  const [, turn, , , , full] = fen.split(' ');
  return turn === 'w' ? `${full}.` : `${full}…`;
}

/** Suite de coups, chacun avec sa signification */
function variante(fen, pv, n = 4) {
  const g = new Chess(fen);
  const out = [];
  for (const u of pv.slice(0, n)) {
    const f = g.fen();
    const l = lisible(f, u);
    out.push({ num: numero(f), ...l });
    if (!jouer(g, u)) break;
  }
  return out;
}

/** Petite phrase qui explique le meilleur coup (règles simples, pas d'IA) */
function pourquoi(fen, e, prevFen, prevUci) {
  if (!e || !e.pv.length) return '';
  const coup = e.pv[0], pv = e.pv;
  const board = new Chess(fen);
  const moi = board.turn();
  const from = coup.slice(0, 2), to = coup.slice(2, 4);
  const piece = board.get(from);
  const cibleAvant = board.get(to);
  const apres = new Chess(fen);
  const mv = jouer(apres, coup);
  if (!mv) return '';
  const capture = !!mv.captured;
  const raisons = [];

  if (e.mate !== null && e.mate !== 0 && (e.mate > 0) === (moi === 'w'))
    raisons.push(`leads to mate in ${Math.abs(e.mate)}`);

  // Si l'adversaire vient de prendre, on compte depuis avant sa prise
  let reprise = false;
  let g = gainMateriel(fen, pv, moi);
  if (prevFen && prevUci) {
    const avantLui = new Chess(prevFen);
    const d = jouer(avantLui, prevUci);
    if (d && d.captured) {
      g += materiel(board, moi) - materiel(new Chess(prevFen), moi);
      reprise = to === prevUci.slice(2, 4);
    }
  }
  if (g > 0 && !raisons.length && pv.length >= 2)
    raisons.push(`wins about ${g} point${g > 1 ? 's' : ''} of material in the continuation`);
  if (capture) {
    const tc = cibleAvant ? cibleAvant.type : 'p';
    if (reprise) raisons.push(`recaptures ${le(tc)} (trade)`);
    else if (g === 0 && pv.length > 1) raisons.push(`trades ${ton(piece.type)} against ${son(tc)}`);
    else raisons.push(`takes ${le(tc)}`);
  }
  if (apres.in_check() && !apres.in_checkmate()) raisons.push('gives check');
  if (mv.flags.includes('k') || mv.flags.includes('q')) raisons.push("puts your king to safety and activates your rook");

  // Pièces menacées avant le coup, qui ne le sont plus après
  const enPriseApres = casesEnPrise(apres, moi);
  const sauvees = casesEnPrise(board, moi).filter(sq => !enPriseApres.includes(sq === from ? to : sq));
  for (const sq of sauvees.slice(0, 1)) {
    const ty = board.get(sq).type;
    if (sq === from) raisons.push(`moves ${ton(ty)} to safety (${FEM[ty] ? 'it was under attack' : 'it was under attack'})`);
    else raisons.push(`protects ${ton(ty)} on ${sq}`);
  }

  // Nouvelle menace créée par la pièce jouée
  if (!capture) {
    const viseesAdv = casesEnPrise(apres, autre(moi));
    for (const sq of attacksFrom(apres, to)) {
      const c = apres.get(sq);
      if (c && c.color !== moi && c.type !== 'k' && viseesAdv.includes(sq)) {
        raisons.push(`attacks ${le(c.type)} on ${sq}`);
        break;
      }
    }
  }

  if (!raisons.length) {
    const rangDepart = moi === 'w' ? 0 : 7;
    const centre = ['d4', 'e4', 'd5', 'e5'];
    const fouLibere = () => ALL_SQ.some(sq => {
      const p = board.get(sq);
      return p && p.type === 'b' && p.color === moi &&
        attacksFrom(apres, sq).length >= attacksFrom(board, sq).length + 2;
    });
    const mineur = piece.type === 'n' || piece.type === 'b';
    if (mineur && sqFR(from)[1] === rangDepart) raisons.push('develops a piece');
    else if (mineur && centre.includes(to)) raisons.push(`puts ${ton(piece.type)} on a central square`);
    else if (piece.type === 'p' && centre.concat(['c4', 'c5']).includes(to)) raisons.push('takes space in the center');
    else if (piece.type === 'p' && fouLibere()) raisons.push('opens the diagonal for your bishop so it can develop');
    else raisons.push('improves the position without giving anything away');
  }
  return raisons.slice(0, 3).join(', ');
}

/** Pourquoi ton coup est mauvais + ce qu'il fallait jouer */
function expliquer(fenAvant, coup, avant, apres, c) {
  const res = {};
  const g = new Chess(fenAvant);
  jouer(g, coup);
  const fenApres = g.fen();
  res.matContre = apres.mate !== null && apres.mate !== 0 && (apres.mate < 0) === (c === 'w') ? Math.abs(apres.mate) : 0;
  res.pertes = casesEnPrise(g, c).map(sq => `${ton(g.get(sq).type)} on ${sq}`);
  if (apres.pv.length) {
    res.refut = lisible(fenApres, apres.pv[0]);
    res.refutLigne = variante(fenApres, apres.pv);
    const p = gainMateriel(fenApres, apres.pv, c);
    if (p < 0 && !res.matContre) res.perte = -p;
  }
  if (avant.pv.length) {
    res.meilleur = lisible(fenAvant, avant.pv[0]);
    res.meilleurLigne = variante(fenAvant, avant.pv);
    if (avant.mate !== null && avant.mate !== 0 && (avant.mate > 0) === (c === 'w')) res.matPour = Math.abs(avant.mate);
    else {
      const gg = gainMateriel(fenAvant, avant.pv, c);
      if (gg > 0) res.gain = gg;
    }
  }
  return res;
}

// ---------- Classement des coups (échelle de chances de gain, comme Lichess) ----------

const chances = cp => 2 / (1 + Math.exp(-0.00368208 * cp)) - 1;   // -1..1 côté blancs

function tagCoup(uci, color, avant, apres) {
  if (!avant || !apres || apres.cp === null || avant.cp === null) return '';
  if (avant.pv[0] === uci) return 'meilleur';
  const s = color === 'w' ? 1 : -1;
  const delta = s * (chances(avant.cp) - chances(apres.cp));
  if (delta >= 0.3) return 'gaffe';
  if (delta >= 0.2) return 'erreur';
  if (delta >= 0.1) return 'imprecision';
  return delta < 0.03 ? 'excellent' : 'bon';
}

function deltaCoup(color, avant, apres) {
  if (!avant || !apres) return 0;
  return (color === 'w' ? 1 : -1) * (chances(avant.cp) - chances(apres.cp));
}

/** Phase de jeu d'une position : ouverture (10 premiers coups), finale (peu de pièces), sinon milieu */
function phaseDe(fen, ply) {
  const v = { q: 9, r: 5, b: 3, n: 3 };
  let m = 0;
  for (const ch of fen.split(' ')[0]) { const t = ch.toLowerCase(); if (v[t]) m += v[t]; }
  if (m <= 26) return 'finale';
  if (ply < 20) return 'ouverture';
  return 'milieu';
}

function precisionCoup(color, avant, apres) {
  const s = color === 'w' ? 1 : -1;
  const wpA = 50 + 50 * s * chances(avant.cp);
  const wpB = 50 + 50 * s * chances(apres.cp);
  const a = 103.1668 * Math.exp(-0.04354 * Math.max(0, wpA - wpB)) - 3.1669;
  return Math.max(0, Math.min(100, a));
}

// ---------- Lecture du PGN ----------

function decouperPgn(txt) {
  txt = txt.replace(/\r/g, '').trim();
  if (!txt) return [];
  return txt.split(/\n\s*\n(?=\s*\[Event\s)/).map(s => s.trim()).filter(Boolean);
}

const _PARSE = new Map();
function chargerPartie(pgn) {
  if (_PARSE.has(pgn)) return _PARSE.get(pgn);
  const r = _chargerPartie(pgn);
  if (_PARSE.size > 60) _PARSE.delete(_PARSE.keys().next().value);
  _PARSE.set(pgn, r);
  return r;
}
function _chargerPartie(pgn) {
  const k = pgn.indexOf('[');            // texte collé avant les en-têtes (ex. une FEN) : on l'ignore
  if (k > 0) pgn = pgn.slice(k);
  let clean = pgn.replace(/\{[^}]*\}/g, ' ').replace(/;[^\n]*/g, ' ').replace(/\$\d+/g, ' ');
  let prev;
  do { prev = clean; clean = clean.replace(/\([^()]*\)/g, ' '); } while (clean !== prev);
  clean = clean.replace(/[!?]+/g, '');
  const g = new Chess();
  if (!g.load_pgn(clean, { sloppy: true })) return null;
  const headers = g.header();
  const start = headers.FEN || DEFAULT_FEN;
  const r = new Chess(start);
  const fens = [r.fen()], moves = [];
  for (const h of g.history({ verbose: true })) {
    const m = r.move({ from: h.from, to: h.to, promotion: h.promotion });
    if (!m) return null;
    moves.push({ uci: h.from + h.to + (h.promotion || ''), san: m.san, color: m.color, from: m.from, to: m.to });
    fens.push(r.fen());
  }
  if (!moves.length && !headers.FEN) return null;
  return { headers, fens, moves };
}

function evalFin(fen) {
  const g = new Chess(fen);
  if (g.in_checkmate()) return { cp: g.turn() === 'w' ? -10000 : 10000, mate: 0, pv: [] };
  if (g.game_over()) return { cp: 0, mate: null, pv: [] };
  return null;
}

/** Ligne UCI "info ... score ... pv ..." -> {cp, mate, pv} côté blancs */
function lireInfo(fen, line, best) {
  const s = fen.split(' ')[1] === 'w' ? 1 : -1;
  let cp = null, mate = null, pv = [];
  if (line) {
    const m = line.match(/score (cp|mate) (-?\d+)/);
    if (m) { if (m[1] === 'cp') cp = s * +m[2]; else mate = s * +m[2]; }
    const p = line.match(/ pv (.+)$/);
    if (p) pv = p[1].trim().split(/\s+/);
  }
  const b = best && best.split(' ')[1];
  if (!pv.length && b && b !== '(none)') pv = [b];
  if (mate !== null) cp = mate === 0 ? -s * 10000 : (10000 - Math.abs(mate)) * Math.sign(mate);
  const g = new Chess(fen), ok = [];
  for (const u of pv) {
    if (!/^[a-h][1-8][a-h][1-8][qrbn]?$/.test(u) || !jouer(g, u)) break;
    ok.push(u);
  }
  return { cp: cp === null ? 0 : cp, mate, pv: ok };
}

function texteEval(e) {
  if (!e) return '…';
  if (e.mate === 0) return 'mate';
  if (e.mate !== null) return `#${e.mate > 0 ? '+' : '-'}${Math.abs(e.mate)}`;
  const v = e.cp / 100;
  return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1);
}

function trouverOuverture(moves, headers = {}) {
  const sans = moves.slice(0, 20).map(m => m.san.replace(/[+#]/g, ''));
  let best = null, bestLen = 0;
  for (const [seq, nom, eco] of OUVERTURES) {
    const s = seq.split(' ');
    if (s.length > bestLen && s.length <= sans.length && s.every((x, i) => x === sans[i])) { best = { nom, eco }; bestLen = s.length; }
  }
  if (best) return { ...best, eco: headers.ECO || best.eco, plies: bestLen };
  if (headers.Opening) return { nom: headers.Opening, eco: headers.ECO || '', plies: 0 };
  if (headers.ECOUrl) {
    const slug = headers.ECOUrl.split('/').pop().replace(/-/g, ' ').replace(/\s\d.*$/, '');
    return { nom: slug, eco: headers.ECO || '', plies: 0 };
  }
  return { nom: headers.ECO ? `Opening ${headers.ECO}` : 'Unidentified opening', eco: headers.ECO || '', plies: 0 };
}

  };

    nom: nomC, elo: eloC, date: dateDePgn(h) || g.addedAt, ouverture: trouverOuverture(P.moves, h),

// ---------- Moteur Stockfish : plusieurs workers en parallèle, WebAssembly si possible ----------
// Profils : [profondeur max, temps max en ms] pour l'aperçu (toutes les positions) puis l'affinage (moments clés)
const PROFILS = {
  '12|1200': { nom: 'Fast', apercu: [9, 250], fin: [12, 700] },
  '14|2500': { nom: 'Normal', apercu: [10, 350], fin: [13, 1000] },
  '16|5000': { nom: 'Deep', apercu: [11, 700], fin: [16, 3500] },
};
const profil = () => PROFILS[REGLAGES.depth] || PROFILS['14|2500'];

const SF_CDN = 'https://cdn.jsdelivr.net/npm/stockfish@10.0.2/src/stockfish.asm.js';
const absUrl = f => new URL(f, location.href).href;
function chargerScript(src) {
  return new Promise((res, rej) => {
    if (window.STOCKFISH) return res();
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script blocked'));
    document.head.append(s);
  });
}
async function workerBlob(fichier, hash = '') {
  const r = await fetch(fichier);
  if (!r.ok) throw new Error('fichier ' + r.status);
  const url = URL.createObjectURL(new Blob([await r.text()], { type: 'text/javascript' }));
  return new Worker(url + hash);
}
// Chaque façon de lancer Stockfish, de la plus rapide à la plus compatible
const STRATEGIES = [
  { nom: 'WebAssembly', w: () => new Worker('stockfish.js') },
  { nom: 'WebAssembly', w: () => workerBlob('stockfish.js', '#' + absUrl('stockfish.wasm')) },
  { nom: 'asm.js', w: () => new Worker('stockfish.asm.js') },
  { nom: 'asm.js', w: () => workerBlob('stockfish.asm.js') },
  { nom: 'asm.js', w: () => new Worker(URL.createObjectURL(new Blob([`importScripts(${JSON.stringify(SF_CDN)});`], { type: 'text/javascript' }))) },
  { nom: 'asm.js sans worker', principal: true },
];

// Un "slot" = une instance de Stockfish, dans un worker ou (en dernier recours) dans la page
function slotWorker(w) {
  const s = { send: c => w.postMessage(c), kill: () => w.terminate(), onLine: null, onErr: null };
  w.onmessage = ev => s.onLine && s.onLine(String(ev.data));
  w.onerror = ev => { if (ev && ev.preventDefault) ev.preventDefault(); s.onErr && s.onErr(ev && ev.message || 'worker error'); };
  return s;
}
async function slotPrincipal() {
  await chargerScript(SF_CDN);
  if (typeof STOCKFISH !== 'function') throw new Error('Stockfish not found');
  const sf = STOCKFISH();
  const s = { send: c => setTimeout(() => sf.postMessage(c, true), 0), kill: () => { }, onLine: null, onErr: null, principal: true };
  sf.onmessage = l => s.onLine && s.onLine(String(l));
  return s;
}

const Moteur = {
  pool: [], q: [], type: null, etat: 'arret', init: null, raisons: [], strat: null,
  get nb() { return this.strat && this.strat.principal ? 1 : clamp((navigator.hardwareConcurrency || 2) - 1, 1, 4); },

  async creer(strat) {
    const slot = strat.principal ? await slotPrincipal() : slotWorker(await strat.w());
    return new Promise((resolve, reject) => {
      const t = setTimeout(() => { slot.kill(); reject(new Error('no response')); }, 6000);
      slot.onLine = l => { if (l.startsWith('uciok')) { clearTimeout(t); resolve(slot); } };
      slot.onErr = m => { clearTimeout(t); slot.kill(); reject(new Error(m)); };
      slot.send('uci');
    });
  },
  brancher(slot) {
    const s = { slot, cur: null };
    slot.onLine = l => this.ligne(s, l);
    slot.onErr = () => this.perdre(s);

    this.pool.push(s);
    return s;
  },
  perdre(s) {
    clearTimeout(s.garde);
    try { s.slot.kill(); } catch { }
    if (s.cur) { this.q.unshift(s.cur); s.cur = null; }
    this.pool = this.pool.filter(x => x !== s);
    if (!this.pool.length) { this.init = null; this.etat = 'arret'; if (this.q.length) this.demarrer(); }
    emit('moteur');
    this.dispatch();
  },
  demarrer() {
    if (this.init) return this.init;
    this.etat = 'demarrage'; emit('moteur');
    this.init = (async () => {
      let slot = null;
      for (const st of STRATEGIES) {
        try { slot = await this.creer(st); this.strat = st; this.type = st.nom; break; }
        catch (e) { this.raisons.push(`${st.nom} : ${e && e.message || e}`); }
      }
      if (!slot) { this.etat = 'erreur'; emit('moteur'); this.echecTout(); return false; }
      this.brancher(slot);
      this.etat = 'pret'; emit('moteur'); this.dispatch();
      for (let k = 1; k < this.nb; k++) this.creer(this.strat).then(x => { this.brancher(x); emit('moteur'); this.dispatch(); }).catch(() => { });
      return true;
    })();
    return this.init;
  },
  analyser(fen, { depth, ms, tag = '', prio = false } = {}) {
    if (!depth) [depth, ms] = profil().fin;
    const fin = evalFin(fen);
    if (fin) return Promise.resolve(fin);
    if (this.etat === 'erreur') return Promise.reject({ code: 'moteur' });
    return new Promise((resolve, reject) => {
      const job = { fen, depth, ms, tag, resolve, reject };
      if (prio) this.q.unshift(job); else this.q.push(job);
      this.demarrer();

    });

  abandonner(tag) {

  },

      let { depth, ms } = j;
      if (s.slot.principal) { depth = Math.min(depth, 11); ms = Math.min(ms, 350); }   // ne pas figer la page
      s.slot.send('position fen ' + j.fen);
      s.slot.send(`go depth ${depth} movetime ${ms}`);
      clearTimeout(s.garde);
      s.garde = setTimeout(() => { if (s.cur === j) { s.slot.send('stop'); s.garde = setTimeout(() => { if (s.cur === j) this.perdre(s); }, 4000); } }, ms + 6000);

    if (e !== this.etat) { this.etat = e; emit('moteur'); }
  },
  ligne(s, l) {
    const j = s.cur;
    if (!j) return;
    if (l.startsWith('info') && l.includes(' score ') && l.includes(' pv ')) {
      j.any = l;
      if (!/ (upper|lower)bound/.test(l)) j.exact = l;

      e.pv = e.pv.slice(0, 10);
      j.resolve(e);
      this.dispatch();
    }
  },
  echecTout() {
    const all = this.pool.map(s => s.cur).filter(Boolean).concat(this.q);
    this.q = []; this.pool.forEach(s => (s.cur = null));
    all.forEach(j => j.reject({ code: 'moteur' }));
  },
};

// ---------- Analyse d'une partie en deux temps ----------
// 1. Aperçu : toutes les positions, vite, en parallèle  ->  courbe, classement et rapport disponibles
// 2. Affinage : seulement les moments clés, plus profond ->  explications et prof IA fiables
const ANALYSES = new Set();
const PROG = {};   // id -> {phase, fait, total}

function aAffiner(g, D) {
  const set = new Set();
  D.P.moves.forEach((mv, i) => {
    const a = g.evals[i], b = g.evals[i + 1];
    if (!a || !b) return;
    const d = deltaCoup(mv.color, a, b), swing = Math.abs(chances(b.cp) - chances(a.cp));
    if (d >= 0.07 || swing >= 0.15) { set.add(i); set.add(i + 1); }
  });
  return [...set].filter(i => !g.evals[i] || (g.evals[i].lvl || 2) < 2).sort((x, y) => x - y);
}

async function analyserPartie(g) {
  if (ANALYSES.has(g.id) || estAffinee(g)) return;
  ANALYSES.add(g.id);
  const P = chargerPartie(g.pgn), pr = profil();
  const ecrire = (i, e, lvl) => { e.lvl = lvl; g.evals[i] = e; g.rev = (g.rev || 0) + 1; };
  try {
    // 1. aperçu
    const manque = P.fens.map((f, i) => i).filter(i => !g.evals[i]);
    PROG[g.id] = { phase: 'apercu', fait: P.fens.length - manque.length, total: P.fens.length };
    let compte = 0;
    await Promise.all(manque.map(i => Moteur.analyser(P.fens[i], { depth: pr.apercu[0], ms: pr.apercu[1], tag: g.id }).then(e => {
      ecrire(i, e, 1); PROG[g.id].fait++; emit('progres', g.id, i);
      if (++compte % 12 === 0) sauverLib();
    })));
    sauverLib();
    emit('apercu', g.id);
    // 2. affinage des moments clés
    const D = deriver(g);
    const liste = aAffiner(g, D);
    PROG[g.id] = { phase: 'affinage', fait: 0, total: liste.length };
    await Promise.all(liste.map(i => Moteur.analyser(P.fens[i], { depth: pr.fin[0], ms: pr.fin[1], tag: g.id }).then(e => {
      ecrire(i, e, 2); PROG[g.id].fait++; emit('progres', g.id, i);
    })));
    g.affine = true;
    g.rev = (g.rev || 0) + 1;
    sauverLib();
    emit('analysee', g.id);
  } catch (e) {
    if (e && e.code === 'moteur') toast("The Stockfish engine could not start in this browser.", 'err');
    sauverLib();
  } finally {
    delete PROG[g.id];
    ANALYSES.delete(g.id);
  }
}

// ---------- Échiquier SVG interactif (clic ou glisser-déposer) ----------
function creerEchiquier(svg, { onMove } = {}) {
  const st = { fen: DEFAULT_FEN, orient: 'w', last: null, arrows: [], sel: null, hint: null, interactive: true, drag: null, marks: [] };
  svg.setAttribute('viewBox', '0 0 320 320');
  const xy = sq => { const [f, r] = sqFR(sq); return st.orient === 'w' ? [f * 40, (7 - r) * 40] : [(7 - f) * 40, r * 40]; };
  const sqAt = (x, y) => {
    const f0 = Math.floor(x / 40), r0 = Math.floor(y / 40);
    if (f0 < 0 || f0 > 7 || r0 < 0 || r0 > 7) return null;
    return st.orient === 'w' ? sqName(f0, 7 - r0) : sqName(7 - f0, r0);
  };
  const pt = e => { const r = svg.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 320, (e.clientY - r.top) / r.height * 320]; };
  const jeu = () => new Chess(st.fen);
  const cibles = () => st.sel ? jeu().moves({ square: st.sel, verbose: true }).map(m => m.to) : [];

  function fleche(uci, cls) {
    if (!uci) return '';
    let [x1, y1] = xy(uci.slice(0, 2)), [x2, y2] = xy(uci.slice(2, 4));
    x1 += 20; y1 += 20; x2 += 20; y2 += 20;
    const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
    if (!len) return '';
    const ux = dx / len, uy = dy / len, nx = -uy, ny = ux, w = 3.4, hw = 9, hl = 12.5;
    const tx = x2 - ux * 4, ty = y2 - uy * 4, bx = tx - ux * hl, by = ty - uy * hl, sx = x1 + ux * 7, sy = y1 + uy * 7;
    const p = [[sx + nx * w, sy + ny * w], [bx + nx * w, by + ny * w], [bx + nx * hw, by + ny * hw], [tx, ty], [bx - nx * hw, by - ny * hw], [bx - nx * w, by - ny * w], [sx - nx * w, sy - ny * w]];
    return `<polygon class="arrow ${cls}" points="${p.map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
  }

  function render() {
    const g = jeu();
    let s = '';
    for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
      const [x, y] = xy(sqName(f, r));
      s += `<rect x="${x}" y="${y}" width="40" height="40" class="${(f + r) % 2 === 0 ? 'sq-d' : 'sq-l'}"/>`;
    }
    const hl = (sq, cls) => { const [x, y] = xy(sq); s += `<rect x="${x}" y="${y}" width="40" height="40" class="${cls}"/>`; };
    if (st.last) { hl(st.last[0], 'hl-last'); hl(st.last[1], 'hl-last'); }
    for (const m of st.marks) hl(m.sq, m.cls);
    if (st.hint) hl(st.hint, 'hl-hint');
    if (st.sel) hl(st.sel, 'hl-sel');
    if (g.in_check()) {
      for (const sq of ALL_SQ) { const p = g.get(sq); if (p && p.type === 'k' && p.color === g.turn()) { const [x, y] = xy(sq); s += `<circle cx="${x + 20}" cy="${y + 20}" r="18" class="chk"/>`; } }
    }
    for (let i = 0; i < 8; i++) {
      const f = st.orient === 'w' ? i : 7 - i, rb = st.orient === 'w' ? 0 : 7;
      s += `<text x="${i * 40 + 36.5}" y="317.5" class="${(f + rb) % 2 === 0 ? 'co-d' : 'co-l'}">${FILES[f]}</text>`;
      const r = st.orient === 'w' ? 7 - i : i, fg = st.orient === 'w' ? 0 : 7;
      s += `<text x="2" y="${i * 40 + 8}" class="${(fg + r) % 2 === 0 ? 'co-d' : 'co-l'}">${r + 1}</text>`;
    }
    const tour = g.turn();
    const rows = st.fen.split(' ')[0].split('/');
    rows.forEach((row, ri) => {
      let f = 0;
      for (const ch of row) {
        if (/\d/.test(ch)) { f += +ch; continue; }
        const col = ch === ch.toUpperCase() ? 'w' : 'b', sq = sqName(f, 7 - ri);
        const [x, y] = xy(sq);
        const mobile = st.interactive && col === tour;
        const cache = st.drag && st.drag.moved && st.drag.sq === sq;
        s += `<use href="#${col}${ch.toLowerCase()}" transform="translate(${x},${y})" class="pc${mobile ? ' mob' : ''}${cache ? ' ghosted' : ''}"/>`;
        f++;
      }
    });
    for (const t of cibles()) {
      const [x, y] = xy(t);
      s += g.get(t) ? `<circle cx="${x + 20}" cy="${y + 20}" r="17" class="dot-cap"/>` : `<circle cx="${x + 20}" cy="${y + 20}" r="5.5" class="dot"/>`;
    }
    for (const a of st.arrows) s += fleche(a.uci, a.cls);
    if (st.drag && st.drag.moved) {
      const p = g.get(st.drag.sq);
      if (p) s += `<use href="#${p.color}${p.type}" id="dragGhost" transform="translate(${st.drag.x - 20},${st.drag.y - 20})" class="pc drag"/>`;
    }
    svg.innerHTML = s;
  }

  function jouerCoup(from, to) {
    const g = jeu(), p = g.get(from);
    let promo = '';
    if (p && p.type === 'p' && (to[1] === '8' || to[1] === '1')) promo = 'q';
    st.sel = null; st.drag = null;
    render();
    if (onMove) onMove(from + to + promo);
  }

  svg.addEventListener('pointerdown', e => {
    if (!st.interactive) return;
    const [x, y] = pt(e), sq = sqAt(x, y);
    if (!sq) return;
    if (st.sel && cibles().includes(sq)) { jouerCoup(st.sel, sq); return; }
    const g = jeu(), p = g.get(sq);
    if (p && p.color === g.turn()) {
      st.sel = sq; st.drag = { sq, x, y, x0: x, y0: y, moved: false };
      try { svg.setPointerCapture(e.pointerId); } catch { }
      e.preventDefault();
    } else st.sel = null;
    render();
  });
  svg.addEventListener('pointermove', e => {
    if (!st.drag) return;
    const [x, y] = pt(e);
    st.drag.x = x; st.drag.y = y;
    if (!st.drag.moved && Math.hypot(x - st.drag.x0, y - st.drag.y0) > 5) { st.drag.moved = true; render(); return; }
    const gh = svg.querySelector('#dragGhost');
    if (gh) gh.setAttribute('transform', `translate(${x - 20},${y - 20})`);
  });
  svg.addEventListener('pointerup', e => {
    if (!st.drag) return;
    const [x, y] = pt(e), sq = sqAt(x, y), d = st.drag;
    st.drag = null;
    if (d.moved && sq && sq !== d.sq && cibles().includes(sq)) return jouerCoup(d.sq, sq);
    if (d.moved) st.sel = null;
    render();
  });
  svg.addEventListener('pointercancel', () => { st.drag = null; render(); });

  render();
  return {
    set(o) { const avant = st.fen; Object.assign(st, o); if (!('sel' in o)) st.sel = null; render(); if (o.fen && avant && o.fen !== avant && o.last) sonCoup(avant, o.fen); },
    get orient() { return st.orient; },
    render,
  };
}

// ---------- Sons des coups (synthétisés, aucun fichier) ----------
let AUDIO = null;
function bip(ctx, t, freq, dur, vol, type = 'triangle') {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.55, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function sonCoup(avant, apres) {
  if (REGLAGES.sons === false) return;
  if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
  try {
    AUDIO = AUDIO || new (window.AudioContext || window.webkitAudioContext)();
    if (AUDIO.state === 'suspended') AUDIO.resume();
    const n = f => f.split(' ')[0].replace(/[^a-z]/gi, '').length;
    const prise = n(apres) < n(avant), echec = new Chess(apres).in_check(), t = AUDIO.currentTime + 0.005;
    if (prise) { bip(AUDIO, t, 340, 0.09, 0.32); bip(AUDIO, t + 0.012, 900, 0.05, 0.12, 'square'); }
    else bip(AUDIO, t, 620, 0.06, 0.25);
    if (echec) bip(AUDIO, t + 0.08, 980, 0.12, 0.14, 'sine');
  } catch { }
}

// ---------- Graphiques (SVG dessinés à la taille réelle, infobulles HTML) ----------
function monterGraph(wrap, dessiner) {
  wrap.classList.add('chart');
  wrap.innerHTML = '<svg class="chart-svg"></svg><div class="tip" hidden></div>';
  const svg = wrap.firstChild, tip = wrap.lastChild;
  let w = 0;
  const go = () => { w = wrap.clientWidth; if (w > 0) dessiner(svg, tip, w); };
  go();
  if (window.ResizeObserver) { const ro = new ResizeObserver(() => { if (wrap.clientWidth !== w) go(); }); ro.observe(wrap); wrap._ro = ro; }
  return { redraw: go };
}
function placerTip(tip, wrap, x, y, html) {
  tip.innerHTML = html; tip.hidden = false;
  const tw = tip.offsetWidth, W = wrap.clientWidth;
  tip.style.left = clamp(x - tw / 2, 0, W - tw) + 'px';
  tip.style.top = Math.max(0, y - tip.offsetHeight - 10) + 'px';
}

/** Courbe d'avantage : chances de gain des Blancs, cliquable */
function graphAvantage(wrap, get) {
  return monterGraph(wrap, (svg, tip, W) => {
    const H = +wrap.dataset.h || 150, padT = 8, padB = 18;
    const { evals, tags, moves, fens, ply, onPick, me } = get();
    const N = Math.max(1, evals.length - 1);
    const X = i => (i / N) * (W - 2) + 1;
    const Y = cp => padT + (H - padT - padB) / 2 * (1 - chances(cp));
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
    const pts = [];
    evals.forEach((e, i) => { if (e) pts.push([X(i), Y(e.cp), i]); });
    const mid = Y(0);
    let s = `<line class="g-mid" x1="0" x2="${W}" y1="${mid}" y2="${mid}"/>`;
    s += `<text class="g-lab" x="4" y="${padT + 9}">White</text><text class="g-lab" x="4" y="${H - padB - 3}">Black</text>`;
    if (pts.length > 1) {
      const d = pts.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      s += `<path class="g-area" d="${d} L${pts[pts.length - 1][0].toFixed(1)} ${H - padB} L${pts[0][0].toFixed(1)} ${H - padB} Z"/>`;
      s += `<path class="g-line" d="${d}"/>`;
    }
    // numéros de coups sur l'axe
    const pas = N > 80 ? 20 : N > 40 ? 10 : 5;
    for (let m = pas; m * 2 <= N; m += pas) s += `<text class="g-axis" x="${X(m * 2 - 1)}" y="${H - 4}" text-anchor="middle">${m}</text>`;
    tags.forEach((t, i) => {
      if ((t !== 'gaffe' && t !== 'erreur') || !evals[i + 1]) return;
      const mine = moves[i].color === me;
      s += `<circle class="g-crit g-${t}${mine ? ' mine' : ''}" cx="${X(i + 1)}" cy="${Y(evals[i + 1].cp)}" r="${mine ? 3.6 : 2.6}"/>`;
    });
    if (ply >= 0) s += `<line class="g-cur" x1="${X(ply)}" x2="${X(ply)}" y1="${padT - 4}" y2="${H - padB}"/>`;
    if (evals[ply]) s += `<circle class="g-dot" cx="${X(ply)}" cy="${Y(evals[ply].cp)}" r="4"/>`;
    s += `<line class="g-hover" x1="0" x2="0" y1="${padT - 4}" y2="${H - padB}" visibility="hidden"/>`;
    s += `<rect x="0" y="0" width="${W}" height="${H}" fill="transparent" class="g-hit"/>`;
    svg.innerHTML = s;
    const hv = svg.querySelector('.g-hover');
    const plyAt = e => { const r = svg.getBoundingClientRect(); return clamp(Math.round((e.clientX - r.left) / r.width * N), 0, N); };
    const hit = svg.querySelector('.g-hit');
    hit.onpointermove = e => {
      const p = plyAt(e), x = X(p);
      hv.setAttribute('x1', x); hv.setAttribute('x2', x); hv.setAttribute('visibility', 'visible');
      const ev = evals[p];
      let html = p === 0 ? '<b>Start</b>' : `<b class="mono">${numero(fens[p - 1])} ${esc(enFr(moves[p - 1].san))}</b>`;
      if (p > 0 && tags[p - 1] && CLASSES[tags[p - 1]]) html += ` ${badge(tags[p - 1])}`;
      html += `<span class="mono"> ${ev ? texteEval(ev) : '…'}</span>`;
      placerTip(tip, wrap, x, ev ? Y(ev.cp) : mid, html);
    };
    hit.onpointerleave = () => { hv.setAttribute('visibility', 'hidden'); tip.hidden = true; };
    hit.onclick = e => onPick && onPick(plyAt(e));
  });
}

/** Courbe double : précision (%) et classement (Elo) partie après partie */
function graphProgression(wrap, get) {
  return monterGraph(wrap, (svg, tip, W) => {
    const H = 220, padL = 34, padR = 40, padT = 12, padB = 26;
    const pts = get();   // [{date, prec, elo, label}]
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('height', H);
    if (!pts.length) { svg.innerHTML = ''; return; }
    const n = pts.length, X = i => n === 1 ? (padL + W - padR) / 2 : padL + i / (n - 1) * (W - padL - padR);
    const Yp = v => padT + (1 - v / 100) * (H - padT - padB);
    const elos = pts.map(p => p.elo).filter(v => v !== null);
    let lo = Math.min(...elos), hi = Math.max(...elos);
    if (!elos.length) { lo = 0; hi = 1; }
    if (hi - lo < 40) { lo -= 20; hi += 20; }
    const Ye = v => padT + (1 - (v - lo) / (hi - lo)) * (H - padT - padB);
    let s = '';
    for (const v of [0, 25, 50, 75, 100]) s += `<line class="g-grid" x1="${padL}" x2="${W - padR}" y1="${Yp(v)}" y2="${Yp(v)}"/><text class="g-axis" x="${padL - 6}" y="${Yp(v) + 3}" text-anchor="end">${v}</text>`;
    if (elos.length) for (const v of [lo, (lo + hi) / 2, hi]) s += `<text class="g-axis g-axis-elo" x="${W - padR + 6}" y="${Ye(v) + 3}">${Math.round(v)}</text>`;
    const path = (arr, Y) => arr.map((p, k) => (k ? 'L' : 'M') + p[0].toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' ');
    const P = pts.map((p, i) => [X(i), p.prec]).filter(p => p[1] !== null);
    const Eo = pts.map((p, i) => [X(i), p.elo]).filter(p => p[1] !== null);
    if (P.length > 1) s += `<path class="g-line g-prec" d="${path(P, Yp)}"/>`;
    if (Eo.length > 1) s += `<path class="g-line g-elo" d="${path(Eo, Ye)}"/>`;
    P.forEach(p => { s += `<circle class="g-pt g-prec-pt" cx="${p[0]}" cy="${Yp(p[1])}" r="3.2"/>`; });
    Eo.forEach(p => { s += `<circle class="g-pt g-elo-pt" cx="${p[0]}" cy="${Ye(p[1])}" r="3.2"/>`; });
    const step = Math.ceil(n / Math.max(1, Math.floor((W - padL - padR) / 70)));
    pts.forEach((p, i) => { if (i % step === 0 || i === n - 1) s += `<text class="g-axis" x="${X(i)}" y="${H - 8}" text-anchor="middle">${fmtDateCourt(p.date)}</text>`; });
    s += `<line class="g-hover" x1="0" x2="0" y1="${padT}" y2="${H - padB}" visibility="hidden"/><rect class="g-hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;
    svg.innerHTML = s;
    const hv = svg.querySelector('.g-hover'), hit = svg.querySelector('.g-hit');
    hit.onpointermove = e => {
      const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
      let k = 0, best = Infinity;
      pts.forEach((p, i) => { const d = Math.abs(X(i) - x); if (d < best) { best = d; k = i; } });
      const p = pts[k];
      hv.setAttribute('x1', X(k)); hv.setAttribute('x2', X(k)); hv.setAttribute('visibility', 'visible');
      placerTip(tip, wrap, X(k), Yp(p.prec ?? 50), `<b>${fmtDate(p.date)}</b><span>${esc(p.label)}</span><span class="mono">Accuracy ${pct(p.prec)}${p.elo ? ' · ' + p.elo + ' Elo' : ''}</span>`);
    };
    hit.onpointerleave = () => { hv.setAttribute('visibility', 'hidden'); tip.hidden = true; };
    hit.onclick = e => { const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W; let k = 0, b = Infinity; pts.forEach((p, i) => { const d = Math.abs(X(i) - x); if (d < b) { b = d; k = i; } }); if (pts[k].onPick) pts[k].onPick(); };
  });
}

// ---------- Le prof IA (Claude, via la capacité "sample" du compte claude.ai) ----------
const IA = { fn: null, dispo: false, ctl: null, ask: null };
const IA_ERR = {
  not_granted: "You didn't allow this page to use Claude: AI comments are paused for this visit.",
  sampling_disabled: "Claude isn't available on this account.",
  rate_limited: "Claude usage limit reached. Try again a bit later.",
  session_expired: "Your claude.ai session expired: sign in again and retry.",
  prompt_too_large: "This game is too long to be commented in one go.",
  refused: "Claude declined to answer this request.",
  empty_completion: "The coach didn't answer. Try again.",
